<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Valk – BREMAT</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<script src="lib/lucide.min.js"></script>
<script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
<!--
  =====================================================================
  Valk – a BREMAT Központ helyi része (helyi/Kozpont.ps1 szolgálja ki,
  http://localhost:47801/). Cellák → jigek → adapterek → termékek, szigetekként.
  Jighez, adapterhez és termékhez: saját adatok, jegyzetek, és a hozzá kötött mappa
  fájljai (PDF, STEP, kép előnézettel; feltöltés, átnevezés, áthelyezés,
  Lomtárba törlés). Felül kereső: mindenre egyszerre.
  A fájlok a helyükön maradnak; az összekötés és a jegyzetek a gépen,
  az %APPDATA%\BrematKozpont\adatok.json-ban vannak. Semmi nem megy a netre.
  =====================================================================
-->
<style>
:root {
  --bg: #eceef2;
  --glass: rgba(255, 255, 255, .62);
  --glass-strong: rgba(255, 255, 255, .92);
  --glass-line: rgba(255, 255, 255, .85);
  --line: rgba(16, 20, 28, .1);
  --shadow: 0 12px 40px rgba(24, 30, 44, .12);
  --shadow-sm: 0 4px 16px rgba(24, 30, 44, .08);
  --text: #12151b;
  --muted: #586070;
  --hover: rgba(16, 20, 28, .055);
  --accent: #c8102e;
  --accent-dark: #a90d27;
  --accent-soft: rgba(200, 16, 46, .1);
  --ok: #1e9a4e;
  --lv-home: #586070; --lv-cell: #c8102e; --lv-jig: #6a3fc0; --lv-ad: #b26a00; --lv-prod: #1f62b8; --lv-files: #2f6f5e; --lv-set: #586070;
  --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); min-height: 100vh; }
a { color: inherit; }
button, input, textarea, select { font: inherit; color: inherit; }
.backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.backdrop i { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .55; animation: drift 26s ease-in-out infinite alternate; }
.backdrop i:nth-child(1) { width: 46vw; height: 46vw; left: -10vw; top: -14vw; background: #d9e4f5; }
.backdrop i:nth-child(2) { width: 38vw; height: 38vw; right: -8vw; top: 10vh; background: #f3dde2; animation-delay: -9s; }
.backdrop i:nth-child(3) { width: 42vw; height: 42vw; left: 30vw; bottom: -20vw; background: #dcefee; animation-delay: -17s; }
@keyframes drift { to { transform: translate(4vw, 3vh) scale(1.08); } }
.glass { background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); }
svg.lucide { width: 18px; height: 18px; stroke-width: 1.9; flex: none; }
.muted { color: var(--muted); }

/* ---------- Gombok, mezők ---------- */
.btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; color: var(--text); transition: background .2s, transform .2s var(--ease); white-space: nowrap; }
.btn:hover { background: #fff; transform: translateY(-1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.danger { color: var(--accent); }
.btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
.btn svg { width: 16px; height: 16px; }
.icon-btn { border: 0; background: transparent; border-radius: 10px; padding: 6px; cursor: pointer; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.input { width: 100%; padding: 9px 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--glass-strong); outline: none; }
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { resize: vertical; min-height: 70px; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
label.field .input { font-weight: 500; color: var(--text); font-size: 15px; }

/* ---------- Fejléc + kereső ---------- */
.top { position: sticky; top: 10px; z-index: 30; margin: 10px 16px 0; padding: 10px 12px; border-radius: 20px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: rgba(255, 255, 255, .8); }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand .ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.brand b { font: 600 18px/1.1 var(--display); display: block; }
.brand small { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 4px; }
.brand small svg { width: 12px; height: 12px; color: var(--ok); }
.search { position: relative; flex: 1 1 320px; max-width: 640px; margin: 0 auto; }
.search > svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search input { width: 100%; padding: 11px 44px 11px 40px; border-radius: 14px; border: 1px solid var(--line); background: #fff; outline: none; font-size: 15px; }
.search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 600 12px var(--body); color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; background: var(--glass-strong); }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 8px); border-radius: 16px; max-height: min(70vh, 620px); overflow: auto; padding: 6px; background: rgba(255, 255, 255, .96); }
.results h4 { margin: 8px 10px 4px; font: 700 11.5px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.res { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 11px; cursor: pointer; text-decoration: none; }
.res:hover, .res.on { background: var(--hover); }
.res .ti { width: 34px; height: 34px; }
.res .tx { min-width: 0; flex: 1; }
.res b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res small { display: block; color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res mark { background: #ffe59a; color: inherit; border-radius: 3px; padding: 0 1px; }
.res-empty { padding: 16px; color: var(--muted); text-align: center; }
.tnav { display: flex; gap: 4px; }
/* „Hol vagyok” sáv: vissza / előre + a szintek színnel, az aktuális kiemelve */
.where { flex-basis: 100%; display: flex; align-items: center; gap: 6px; padding-top: 9px; margin-top: 1px; border-top: 1px solid var(--line); min-width: 0; }
.nav-btn { width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--line); background: var(--glass-strong); display: grid; place-items: center; cursor: pointer; flex: none; transition: background .2s, transform .2s; }
.nav-btn:hover { background: #fff; transform: translateY(-1px); }
.nav-btn svg { width: 18px; height: 18px; }
.path { display: flex; align-items: center; gap: 2px; min-width: 0; flex: 1; margin-left: 6px; overflow-x: auto; scrollbar-width: thin; padding: 2px; }
.path .sep { display: grid; place-items: center; flex: none; }
.path .sep svg { width: 16px; height: 16px; opacity: .4; }
.step { --c: var(--lv-home); display: flex; align-items: center; gap: 8px; padding: 4px 11px 4px 4px; border-radius: 13px; text-decoration: none; white-space: nowrap; border: 1px solid transparent; flex: none; }
a.step:hover { background: var(--hover); }
.step .si { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 13%, transparent); color: var(--c); flex: none; }
.step .si svg { width: 16px; height: 16px; }
.step .st { display: flex; flex-direction: column; line-height: 1.12; }
.step small { font-size: 10.5px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: var(--c); }
.step b { font-size: 14px; font-weight: 600; max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
.step.cur { background: color-mix(in srgb, var(--c) 9%, #fff); border-color: color-mix(in srgb, var(--c) 40%, transparent); box-shadow: 0 3px 12px color-mix(in srgb, var(--c) 20%, transparent); }
.step.cur .si { background: var(--c); color: #fff; }
.lv-cell { --c: var(--lv-cell); } .lv-jig { --c: var(--lv-jig); } .lv-ad { --c: var(--lv-ad); } .lv-prod { --c: var(--lv-prod); } .lv-files { --c: var(--lv-files); } .lv-set { --c: var(--lv-set); }
body { --lvc: var(--accent); }
body[data-lv="jig"] { --lvc: var(--lv-jig); } body[data-lv="ad"] { --lvc: var(--lv-ad); } body[data-lv="prod"] { --lvc: var(--lv-prod); }
.lvtag { position: absolute; left: 10px; top: 10px; z-index: 2; display: flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 99px; font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: #fff; background: var(--c); box-shadow: 0 2px 8px rgba(0, 0, 0, .15); }
.lvtag svg, .pic .lvtag svg { width: 13px; height: 13px; stroke-width: 2; }
.missing { opacity: .6; }
.missing .nm b { text-decoration: line-through; }
.legacy { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 6px 8px; padding: 9px 12px; border-radius: 12px; background: rgba(178, 106, 0, .08); color: #7a4a00; font-size: 13.5px; }
.legacy svg { width: 16px; height: 16px; }
.picklist .row.sel { background: color-mix(in srgb, var(--accent) 8%, #fff); }
.picklist .ck { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); display: grid; place-items: center; color: #fff; }
.picklist .row.sel .ck { background: var(--accent); border-color: var(--accent); }
.picklist .ck svg { width: 14px; height: 14px; }
.picked { display: flex; gap: 6px; flex-wrap: wrap; }
.picked .chip { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 700px) { .step b { max-width: 130px; } .where { padding-top: 7px; } }

/* ---------- Oldal ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 22px 16px 60px; }
.page > * { animation: rise .45s var(--ease) both; }
.page > *:nth-child(2) { animation-delay: .04s; } .page > *:nth-child(3) { animation-delay: .08s; } .page > *:nth-child(4) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.crumbs { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-bottom: 8px; }
.crumbs a { text-decoration: none; padding: 2px 6px; border-radius: 7px; font-weight: 600; }
.crumbs a:hover { background: var(--hover); color: var(--text); }
.crumbs svg { width: 14px; height: 14px; opacity: .6; }
.head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
.head h1 { margin: 0; font: 600 28px/1.15 var(--display); }
.head p { margin: 4px 0 0; color: var(--muted); }
.head .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
h2.sec { font: 600 18px/1.2 var(--display); margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
h2.sec .n { font: 600 13px var(--body); color: var(--muted); background: var(--hover); padding: 2px 9px; border-radius: 99px; }
h2.sec .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- Szigetek ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.grid.big { grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
.card { position: relative; border-radius: 22px; overflow: hidden; text-decoration: none; display: flex; flex-direction: column; transition: transform .45s var(--ease), box-shadow .45s var(--ease), border-color .3s; cursor: pointer; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
.card:hover { transform: translateY(-4px); box-shadow: 0 18px 48px rgba(24, 30, 44, .16); border-color: rgba(200, 16, 46, .3); }
.card:active { transform: translateY(-1px) scale(.99); }
.pic { aspect-ratio: 16 / 10; background: linear-gradient(135deg, #f4f5f8, #e6e9ef); display: grid; place-items: center; color: #9aa3b2; position: relative; overflow: hidden; }
.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.card:hover .pic img { transform: scale(1.04); }
.pic svg { width: 38px; height: 38px; stroke-width: 1.4; }
.pic .busy { position: absolute; right: 10px; bottom: 10px; font-size: 11.5px; color: var(--muted); background: rgba(255, 255, 255, .85); padding: 3px 8px; border-radius: 99px; display: flex; gap: 5px; align-items: center; }
.pic .busy::before { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--accent-soft); border-top-color: var(--accent); animation: spin .9s linear infinite; }
.card .tx { padding: 12px 14px 14px; }
.card .tx b { display: block; font: 600 16px/1.25 var(--display); }
.card .tx small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.card .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 99px; background: var(--hover); color: var(--muted); display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.chip.red { background: var(--accent-soft); color: var(--accent); }
.chip button { border: 0; background: transparent; padding: 0; cursor: pointer; color: inherit; display: inline-grid; }
.chip svg { width: 13px; height: 13px; }
.card.cell .pic { aspect-ratio: auto; height: 150px; background: radial-gradient(circle at 30% 20%, #fff, #e9ecf2 70%); }
.card.cell .pic svg { width: 54px; height: 54px; color: var(--accent); stroke-width: 1.3; }
.card.cell .num { position: absolute; left: 16px; top: 12px; font: 700 46px/1 var(--display); color: rgba(200, 16, 46, .12); }
.card.add { border: 2px dashed rgba(16, 20, 28, .14); background: rgba(255, 255, 255, .35); box-shadow: none; align-items: center; justify-content: center; min-height: 190px; color: var(--muted); font-weight: 600; gap: 8px; }
.card.add svg { width: 28px; height: 28px; }
.card.add:hover { color: var(--accent); border-color: var(--accent); }
.recent { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.recent a { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 8px; border-radius: 14px; text-decoration: none; }
.recent .mini { width: 44px; height: 32px; border-radius: 8px; background: #eef0f4; display: grid; place-items: center; overflow: hidden; color: #9aa3b2; }
.recent .mini img { width: 100%; height: 100%; object-fit: cover; }
.recent b { font-weight: 600; font-size: 14px; display: block; }
.recent small { font-size: 12px; color: var(--muted); }

/* ---------- Jig / termék oldal ---------- */
.hero { display: grid; grid-template-columns: minmax(260px, 420px) 1fr; gap: 22px; align-items: stretch; margin-bottom: 8px; }
.hero .pic { border-radius: 22px; aspect-ratio: 16 / 11; box-shadow: var(--shadow); cursor: pointer; }
.hero .pic .hint { position: absolute; left: 10px; bottom: 10px; font-size: 12px; background: rgba(255, 255, 255, .88); padding: 4px 9px; border-radius: 99px; color: var(--muted); display: flex; gap: 5px; align-items: center; }
.hero .pic .hint svg { width: 13px; height: 13px; }
.hero .info { display: flex; flex-direction: column; gap: 10px; justify-content: center; }
.hero h1 { margin: 0; font: 600 30px/1.15 var(--display); word-break: break-word; }
.hero .kind { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #fff; background: var(--lvc); padding: 4px 11px 4px 8px; border-radius: 99px; }
.hero .kind svg { width: 14px; height: 14px; }
.hero .pic { outline: 3px solid color-mix(in srgb, var(--lvc) 35%, transparent); outline-offset: -3px; }
h2.sec .lvi { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
h2.sec .lvi svg { width: 15px; height: 15px; }
.hero .folder { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; word-break: break-all; }
.hero .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.box { border-radius: 20px; padding: 16px; }
.box h3 { margin: 0 0 12px; font: 600 16px var(--display); display: flex; align-items: center; gap: 8px; }
.box h3 .acts { margin-left: auto; }
.kv { display: grid; grid-template-columns: minmax(90px, .7fr) 1.3fr 32px; gap: 6px; align-items: center; margin-bottom: 6px; }
.kv .input { padding: 7px 10px; font-size: 14px; }
.kv .input.k { font-weight: 700; color: var(--muted); }
.notes { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.note { padding: 10px 12px; border-radius: 13px; background: rgba(255, 255, 255, .7); border: 1px solid var(--line); position: relative; }
.note time { font-size: 12px; color: var(--muted); font-weight: 600; display: block; margin-bottom: 3px; }
.note p { margin: 0; white-space: pre-wrap; word-break: break-word; }
.note .icon-btn { position: absolute; right: 6px; top: 6px; opacity: 0; }
.note:hover .icon-btn { opacity: 1; }
.empty { padding: 22px 14px; text-align: center; color: var(--muted); }
.empty svg { width: 30px; height: 30px; display: block; margin: 0 auto 8px; opacity: .55; }

/* ---------- Fájlok ---------- */
.files { border-radius: 20px; padding: 6px; position: relative; }
.files.drag { outline: 3px dashed var(--accent); outline-offset: -6px; background: rgba(200, 16, 46, .05); }
.files .drop-hint { display: none; position: absolute; inset: 0; place-items: center; font: 600 18px var(--display); color: var(--accent); pointer-events: none; }
.files.drag .drop-hint { display: grid; }
.fgroup h4 { margin: 10px 10px 4px; font: 700 11.5px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.row { display: grid; grid-template-columns: 34px 1fr auto 34px; align-items: center; gap: 10px; padding: 7px 8px 7px 10px; border-radius: 12px; cursor: pointer; user-select: none; transition: background .15s; }
.row:hover { background: var(--hover); }
.row .nm { min-width: 0; }
.row .nm b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { display: block; color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { text-align: right; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ti { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: rgba(16, 20, 28, .05); color: var(--muted); flex: none; }
.ti.dir { background: #fdf1d7; color: #b07900; }
.ti.pdf { background: var(--accent-soft); color: var(--accent); }
.ti.cad { background: #e2eefb; color: #1f62b8; }
.ti.img { background: #e3f4ea; color: var(--ok); }
.ti.jig { background: #efe7fb; color: #6a3fc0; }
.ti.prod { background: #e2eefb; color: #1f62b8; }
.ti.ad { background: #fdf0dc; color: #b26a00; }
.ti.cell { background: var(--accent-soft); color: var(--accent); }
.ti.note { background: #fff4d6; color: #a06d00; }
.bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.roots { display: flex; gap: 6px; flex-wrap: wrap; }
.roots button { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 13px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.roots button:hover { background: var(--hover); color: var(--text); }
.roots button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.fcrumbs { display: flex; align-items: center; flex-wrap: wrap; gap: 2px; font-size: 13.5px; color: var(--muted); margin: 0 0 6px 4px; }
.fcrumbs button { border: 0; background: transparent; cursor: pointer; padding: 2px 6px; border-radius: 7px; color: var(--muted); font-weight: 600; }
.fcrumbs button:hover { background: var(--hover); color: var(--text); }
.fcrumbs button:last-child { color: var(--text); }
.fcrumbs svg { width: 14px; height: 14px; opacity: .6; }

/* ---------- Ablakok (előnézet, párbeszéd, mappaválasztó) ---------- */
.modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(20, 24, 33, .28); backdrop-filter: blur(3px); animation: fade .2s both; }
.modal[hidden] { display: none; }
@keyframes fade { from { opacity: 0; } }

<script type="module">
/* =====================================================================
   0. Segédek
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);

const icons = () => { if (window.lucide) lucide.createIcons(); };
const el = (tag, props = {}, ...kids) => {

const ic = (name) => el('i', { 'data-lucide': name });
// replaceChildren tömbökkel és üres (null) elemekkel is
const put = (node, ...kids) => node.replaceChildren(...kids.flat(Infinity).filter((k) => k != null && k !== false));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const plain = (s) => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
const ext = (n) => { const i = n.lastIndexOf('.'); return i > 0 ? n.slice(i + 1).toLowerCase() : ''; };
const CAD = ['step', 'stp', 'stl'], IMG = ['png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp'];
function kind(e) { if (e.d) return 'dir'; const x = ext(e.n); return x === 'pdf' ? 'pdf' : CAD.includes(x) ? 'cad' : IMG.includes(x) ? 'img' : 'file'; }
const KIND_ICON = { dir: 'folder', pdf: 'file-text', cad: 'box', img: 'image', file: 'file' };
const fmtSize = (b) => b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(0)} KB` : b < 1073741824 ? `${(b / 1048576).toFixed(1).replace('.', ',')} MB` : `${(b / 1073741824).toFixed(2).replace('.', ',')} GB`;
const dFmt = new Intl.DateTimeFormat('hu-HU', { year: 'numeric', month: '2-digit', day: '2-digit' });
const dtFmt = new Intl.DateTimeFormat('hu-HU', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const fmtDate = (ms) => dFmt.format(new Date(ms)).replace(/\s/g, '');
const coll = new Intl.Collator('hu', { numeric: true, sensitivity: 'base' });
const byName = (a, b) => coll.compare(a.name || a.n, b.name || b.n);

/* =====================================================================
   1. Helyi szerver
   ===================================================================== */
async function api(path, body) {
  const res = await fetch(path, body === undefined
    ? { headers: { 'X-Helyi': '1' } }
    : { method: 'POST', headers: { 'X-Helyi': '1', 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(data.error || `Hiba (${res.status})`); e.status = res.status; throw e; }
  return data;
}
let TOKEN = '', ROOTS = [], APPDIR = '';
const rootName = (r) => ROOTS.find((x) => x.id === r)?.name || r;
const fileUrl = (r, p) => `/f?r=${encodeURIComponent(r)}&p=${encodeURIComponent(p)}&t=${TOKEN}`;
const where = (r, p) => [rootName(r), ...p.split('/').slice(0, -1)].join(' / ');

/* =====================================================================
   2. Adatok: cellák, jigek, adapterek, termékek (adatok.json a gépen)
   ===================================================================== */
const DEFAULT = () => ({
  version: 1,
  cells: [
    { id: 'c1', name: '1. cella', sub: 'Manipulátor 1' },
    { id: 'c2', name: '2. cella', sub: 'Manipulátor 2' },
    { id: 'c3', name: '3. cella', sub: 'Siegmund asztal' },
  ],
  jigs: [], adapters: [], products: [],
});
let D = DEFAULT(), REV = '0';
async function loadData() {
  const d = await api('/api/data');
  REV = String(d.rev);
  D = d.data || DEFAULT();
  for (const k of ['cells', 'jigs', 'adapters', 'products']) D[k] = Array.isArray(D[k]) ? D[k] : [];
  for (const it of allItems()) { it.fields ||= []; it.notes ||= []; it.files ||= []; }
  // p.ads: melyik adapteren van; p.jigs: régi, adapter nélküli kötés (az 1. változatból)
  for (const p of D.products) { p.ads ||= []; p.jigs ||= []; }
}
let saveChain = Promise.resolve();
function save() {
  const run = async () => {
    const res = await fetch('/api/data', { method: 'POST', headers: { 'X-Helyi': '1', 'X-Rev': REV, 'Content-Type': 'application/json' }, body: JSON.stringify(D) });
    const data = await res.json().catch(() => ({}));
    if (res.status === 409) { toast(data.error || 'Közben máshol módosult.'); await loadData(); route(); throw new Error('rev'); }
    if (!res.ok) { toast(data.error || 'Nem sikerült menteni.'); throw new Error('save'); }
    REV = String(data.rev);
  };
  saveChain = saveChain.then(run, run);
  return saveChain;
}
const cellOf = (id) => D.cells.find((c) => c.id === id);
const jigOf = (id) => D.jigs.find((j) => j.id === id);
const adOf = (id) => D.adapters.find((a) => a.id === id);
const prodOf = (id) => D.products.find((p) => p.id === id);
const allItems = () => [...D.jigs, ...D.adapters, ...D.products];
const jigsIn = (cellId) => D.jigs.filter((j) => j.cell === cellId).sort(byName);
const adsOn = (jigId) => D.adapters.filter((a) => a.jig === jigId).sort(byName);
const prodsOn = (adId) => D.products.filter((p) => p.ads.includes(adId)).sort(byName);
const prodsDirect = (jigId) => D.products.filter((p) => p.jigs.includes(jigId)).sort(byName);
const prodsOfJig = (jigId) => new Set([...adsOn(jigId).flatMap((a) => prodsOn(a.id)), ...prodsDirect(jigId)].map((p) => p.id));
// A három szint: felirat, ikon, címsor-rész, melyik gyökérmappában keressük
const T = {
  jig: { label: 'Jig', ico: 'grip', path: 'jig', root: 'manipulator', group: 'Jigek' },
  ad: { label: 'Adapter', ico: 'puzzle', path: 'adapter', root: 'manipulator', group: 'Adapterek' },
  prod: { label: 'Termék', ico: 'package', path: 'termek', root: 'products', group: 'Termékek' },
};
const itemType = (it) => (D.jigs.includes(it) ? 'jig' : D.adapters.includes(it) ? 'ad' : 'prod');
const itemHref = (it) => `#/${T[itemType(it)].path}/${it.id}`;
// Teljes Windows-útvonal (üzenetekhez)
const fullPath = (r, p) => { const x = ROOTS.find((y) => y.id === r); return x ? x.path + (p ? '\\' + p.replace(/\//g, '\\') : '') : p; };
const sameRef = (a, b) => a.r === b.r && a.p === b.p;
const adWhere = (a) => { const j = jigOf(a.jig); return j ? `${j.name} · ${cellOf(j.cell)?.name || ''}` : 'Nincs jighez kötve'; };
const imgUrl = (it) => it.img ? fileUrl(it.img.r, it.img.p) : it.thumb ? `/kep?id=${it.id}&t=${TOKEN}&v=${it.thumb}` : null;
function remember(it) {
  let r = []; try { r = JSON.parse(store.get('valk-recent') || '[]'); } catch { /* üres */ }
  r = [it.id, ...r.filter((x) => x !== it.id)].slice(0, 8); store.set('valk-recent', JSON.stringify(r));
}

/* =====================================================================
   3. Kereső (felül): cellák, jigek, adapterek, termékek, adatok, jegyzetek + fájlnevek
   ===================================================================== */
let sIdx = 0, sItems = [], sTimer = 0, sSeq = 0;
function hl(text, words) {
  const t = String(text), p = plain(t), out = [];
  let i = 0;
  const marks = [];
  for (const w of words) { let k = p.indexOf(w); while (k >= 0 && w) { marks.push([k, k + w.length]); k = p.indexOf(w, k + w.length); } }
  marks.sort((a, b) => a[0] - b[0]);
  for (const [a, b] of marks) { if (a < i) continue; out.push(t.slice(i, a), el('mark', { text: t.slice(a, b) })); i = b; }
  out.push(t.slice(i));
  return out;
}
function snippet(text, words) {
  const p = plain(text); const k = Math.max(0, p.indexOf(words[0]) - 30);
  return (k > 0 ? '…' : '') + String(text).slice(k, k + 110).replace(/\s+/g, ' ');
}
function localHits(words) {
  const hits = [];
  const test = (s) => words.every((w) => plain(s).includes(w));
  for (const c of D.cells) if (test(`${c.name} ${c.sub || ''}`)) hits.push({ g: 'Cellák', icon: 'cell', ico: 'layout-grid', title: c.name, sub: c.sub || '', href: `#/cella/${c.id}` });
  for (const it of allItems()) {
    const t = itemType(it);
    const ctx = t === 'jig' ? (cellOf(it.cell)?.name || '') : t === 'ad' ? adWhere(it)
      : [...it.ads.map((a) => adOf(a)?.name), ...it.jigs.map((j) => jigOf(j)?.name)].filter(Boolean).join(', ') || 'Nincs adapterhez kötve';
    const all = [it.name, ...it.fields.map((f) => `${f.k} ${f.v}`), ...it.notes.map((n) => n.text)].join(' ');
    if (!test(all)) continue;
    let sub = ctx;
    if (!test(it.name)) {
      const f = it.fields.find((x) => words.some((w) => plain(`${x.k} ${x.v}`).includes(w)));
      const n = it.notes.find((x) => words.some((w) => plain(x.text).includes(w)));
      sub = f ? `${f.k}: ${f.v}` : n ? `Jegyzet: ${snippet(n.text, words)}` : ctx;
    }
    hits.push({ g: T[t].group, icon: t, ico: T[t].ico, title: it.name, sub, href: itemHref(it), img: imgUrl(it) });
  }
  return hits;
}
// Melyik jighez / adapterhez / termékhez tartozik egy fájl? (A legmélyebb hozzárendelt mappa nyer.)
function ownerOf(r, p) {
  const direct = allItems().filter((it) => it.files.some((f) => f.r === r && f.p === p)).pop();
  if (direct) return direct;
  let best = null, depth = -1;
  for (const it of allItems()) {
    if (!it.folder || it.folder.r !== r) continue;
    const fp = it.folder.p;
    if (fp === '' || p === fp || p.startsWith(fp + '/')) { const d = fp ? fp.split('/').length : 0; if (d > depth) { depth = d; best = it; } }
  }
  return best;
}
async function doSearch() {
  const q = $('#q').value.trim(), box = $('#sres');
  if (!q) { box.hidden = true; return; }
  const words = plain(q).split(/\s+/).filter(Boolean);
  const seq = ++sSeq;
  const local = localHits(words);
  drawResults(local, null, words);
  try {
    const d = await api(`/api/search?q=${encodeURIComponent(q)}`);
    if (seq !== sSeq) return;
    drawResults(local, d.hits.filter((h) => !h.d).slice(0, 25), words, d.more);
  } catch { if (seq === sSeq) drawResults(local, [], words); }
}
function drawResults(local, files, words, more) {
  const box = $('#sres'); box.hidden = false;
  sItems = []; const kids = [];
  const groups = ['Cellák', 'Jigek', 'Adapterek', 'Termékek'];
  for (const g of groups) {
    const hs = local.filter((h) => h.g === g).slice(0, 8);
    if (!hs.length) continue;
    kids.push(el('h4', { text: g }));
    for (const h of hs) {
      const a = el('a', { class: 'res', href: h.href },
        el('span', { class: `ti ${h.icon}` }, h.img ? el('img', { src: h.img, alt: '', style: 'width:100%;height:100%;object-fit:cover;border-radius:10px' }) : ic(h.ico)),
        el('span', { class: 'tx' }, el('b', {}, hl(h.title, words)), el('small', {}, hl(h.sub, words))));
      a.addEventListener('click', closeSearch);
      kids.push(a); sItems.push(a);
    }
  }
  if (files === null) kids.push(el('h4', { text: 'Fájlok – keresés…' }));
  else if (files.length) {
    kids.push(el('h4', { text: `Fájlok${more ? ' (az első találatok)' : ''}` }));
    for (const f of files) {
      const k = kind(f), own = ownerOf(f.r, f.p);
      const a = el('a', { class: 'res', href: '#' },
        el('span', { class: `ti ${k}` }, ic(KIND_ICON[k])),
        el('span', { class: 'tx' }, el('b', {}, hl(f.n, words)), el('small', { text: own ? `${T[itemType(own)].label}: ${own.name} · ${where(f.r, f.p)}` : where(f.r, f.p) })));
      a.addEventListener('click', (ev) => {
        ev.preventDefault(); closeSearch();
        if (own && location.hash !== itemHref(own)) { pendingPv = [f.r, f.p, f, own]; location.hash = itemHref(own); } else openPreview(f.r, f.p, f, own);
      });
      kids.push(a); sItems.push(a);
    }
  }
  if (!sItems.length && files !== null) kids.push(el('div', { class: 'res-empty', text: 'Nincs találat.' }));
  box.replaceChildren(...kids);
  sIdx = 0; mark();
  icons();
}
function mark() { sItems.forEach((a, i) => a.classList.toggle('on', i === sIdx)); sItems[sIdx]?.scrollIntoView({ block: 'nearest' }); }
function closeSearch() { $('#sres').hidden = true; $('#q').blur(); }
$('#q').addEventListener('input', () => { clearTimeout(sTimer); sTimer = setTimeout(doSearch, 160); });
$('#q').addEventListener('focus', () => { if ($('#q').value.trim()) doSearch(); });
$('#q').addEventListener('keydown', (ev) => {
  if (ev.key === 'ArrowDown') { ev.preventDefault(); sIdx = Math.min(sItems.length - 1, sIdx + 1); mark(); }
  else if (ev.key === 'ArrowUp') { ev.preventDefault(); sIdx = Math.max(0, sIdx - 1); mark(); }
  else if (ev.key === 'Enter') { ev.preventDefault(); sItems[sIdx]?.click(); }
  else if (ev.key === 'Escape') { $('#q').value = ''; closeSearch(); }
});
document.addEventListener('click', (ev) => { if (!$('#sbox').contains(ev.target)) $('#sres').hidden = true; });
addEventListener('keydown', (ev) => {
  if (ev.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement?.tagName) && !$('.modal:not([hidden])')) { ev.preventDefault(); $('#q').focus(); }
});

/* =====================================================================
   4. Ablakok: menü, párbeszéd, mappaválasztó
   ===================================================================== */
function popMenu(anchor, items) {
  const m = $('#menu');
  m.replaceChildren(...items.map((it) => it === '-' ? el('hr') : el('button', { type: 'button', class: it.danger ? 'danger' : '', onclick: () => { m.hidden = true; it.act(); } }, ic(it.icon), it.label)));
  m.hidden = false; icons();
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
  m.style.top = (r.bottom + h + 8 > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
  setTimeout(() => document.addEventListener('click', function off(ev) { if (!m.contains(ev.target)) { m.hidden = true; document.removeEventListener('click', off); } }), 0);
}
function openModal(id, sheet) {
  const m = $('#' + id); m.replaceChildren(sheet); m.hidden = false; icons();
  m.onclick = (ev) => { if (ev.target === m) closeModal(id); };
  return m;
}
function closeModal(id) { const m = $('#' + id); m.hidden = true; m.replaceChildren(); m.onclose?.(); m.onclose = null; }
addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  for (const id of ['fp', 'dlg', 'pv']) if (!$('#' + id).hidden) { closeModal(id); break; }
});
function sheetHead(icon, cls, title, sub, onClose) {
  return el('div', { class: 'sh-head' }, el('span', { class: `ti ${cls}` }, ic(icon)),
    el('div', { class: 't' }, el('h2', { text: title }), sub ? el('small', { text: sub }) : null),
    el('button', { class: 'icon-btn', type: 'button', 'aria-label': 'Bezárás', onclick: onClose }, ic('x')));
}

// Mappaválasztó: egy mappát ad vissza ({ r, p }) vagy null-t.
function pickFolder(title, start) {
  return new Promise((resolve) => {
    let r = start?.r || ROOTS[0]?.id, p = start?.p || '';
    const list = el('div', { class: 'picklist' }), crumbs = el('div', { class: 'fcrumbs' }), rootsEl = el('div', { class: 'roots' });
    const done = (v) => { $('#fp').onclose = null; closeModal('fp'); resolve(v); };
    const draw = async () => {
      rootsEl.replaceChildren(...ROOTS.map((x) => el('button', { type: 'button', 'aria-pressed': String(x.id === r), onclick: () => { r = x.id; p = ''; draw(); } }, ic('hard-drive'), x.name)));

let THREE = null, Orbit = null, STLLoader = null;
async function lib3d() {
  if (!THREE) {
    THREE = await import('three');
    ({ OrbitControls: Orbit } = await import('./lib/OrbitControls.js'));
    ({ STLLoader } = await import('./lib/STLLoader.js'));
  }
}
function readStep(buf) {
  // Külön szálon (Web Worker) alakítja át, hogy az oldal ne fagyjon le közben.
  return new Promise((resolve, reject) => {
    const w = new Worker('lib/occt-import-js-worker.js');
    w.onmessage = (ev) => { w.terminate(); ev.data && ev.data.success ? resolve(ev.data) : reject(new Error('A STEP fájlt nem sikerült beolvasni.')); };
    w.onerror = (ev) => { w.terminate(); reject(new Error(ev.message || 'A STEP beolvasása nem sikerült.')); };
    w.postMessage({ format: 'step', buffer: new Uint8Array(buf), params: { linearUnit: 'millimeter', linearDeflectionType: 'bounding_box_ratio', linearDeflection: 0.001, angularDeflection: 0.5 } });
  });
}
async function loadModel(r, p, x) {
  const [buf] = await Promise.all([fetch(fileUrl(r, p)).then((res) => { if (!res.ok) throw new Error('A fájl nem olvasható.'); return res.arrayBuffer(); }), lib3d()]);
  const group = new THREE.Group();
  let parts = 0, tris = 0;
  const mat = (c) => new THREE.MeshStandardMaterial({ color: c, metalness: .25, roughness: .55, side: THREE.DoubleSide });
  if (x === 'stl') {
    const g = new STLLoader().parse(buf); g.computeVertexNormals();
    group.add(new THREE.Mesh(g, mat(0xb9c2cf))); parts = 1; tris = g.index ? g.index.count / 3 : g.attributes.position.count / 3;
  } else {
    const res = await readStep(buf);
    for (const m of res.meshes) {
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
      if (m.attributes.normal) g.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
      if (m.index) g.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
      if (!m.attributes.normal) g.computeVertexNormals();
      group.add(new THREE.Mesh(g, mat(m.color ? new THREE.Color(m.color[0], m.color[1], m.color[2]) : 0xb9c2cf)));
      parts++; tris += (m.index ? m.index.array.length : m.attributes.position.array.length / 3) / 3;
    }
    if (!parts) throw new Error('A fájlban nincs megjeleníthető test.');
  }
  // CAD-ben a Z a felfelé irány
  group.rotation.x = -Math.PI / 2;
  return { group, info: `${parts} test · ${Math.round(tris).toLocaleString('hu-HU')} háromszög` };
}
function stage(group) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a93a3, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(1, 1.6, 1.2); scene.add(sun);
  const fill = new THREE.DirectionalLight(0xffffff, .5); fill.position.set(-1.2, -.4, -1); scene.add(fill);
  scene.add(group);
  const box = new THREE.Box3().setFromObject(group), size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.length() / 2, 1e-6);
  const camera = new THREE.PerspectiveCamera(35, 1, radius / 100, radius * 100);
  const grid = new THREE.GridHelper(radius * 4, 20, 0xc4cad4, 0xdde1e7);
  grid.position.set(center.x, box.min.y, center.z); scene.add(grid);
  const frame = (controls) => {
    // a keskenyebb látószög (függőleges vagy vízszintes) szerint, hogy keskeny ablakban is beférjen
    const v = camera.fov * Math.PI / 180, h = 2 * Math.atan(Math.tan(v / 2) * camera.aspect);
    const dir = new THREE.Vector3(1, .75, 1.15).normalize();

    camera.lookAt(center); camera.updateProjectionMatrix();

  return { scene, camera, frame };
}
const BIG = 80 * 1048576;
async function show3d(body, r, p, x, e, owner, force) {

      el('span', { text: 'A 3D nézet beolvasása sokáig tarthat. ' }),

  try {

}
function makeViewer(body, group, info, owner) {

  loop();
  body.append(el('div', { class: 'hud' },
    el('button', { class: 'btn sm', type: 'button', onclick: () => frame(controls) }, ic('rotate-ccw'), 'Alapnézet'),
    owner ? el('button', { class: 'btn sm', type: 'button', onclick: async () => {
      renderer.render(scene, camera);
      const blob = await coverPng(canvas, 720, 450);
      await saveThumb(owner, blob); toast(`Ez lett a(z) „${owner.name}” képe.`);
    } }, ic('camera'), 'Ez legyen a kép') : null,
    el('span', { class: 'info', text: `${info} · húzás: forgatás · jobb gomb: mozgatás · görgő: nagyítás` })));

  return { dispose() {

function coverPng(src, w, h) {

/* =====================================================================
   7. Képek a szigetekre: kiválasztott kép, vagy magától a fő STEP-ből
   ===================================================================== */
async function saveThumb(it, blob) {
  const res = await fetch(`/api/kep?id=${it.id}`, { method: 'POST', headers: { 'X-Helyi': '1' }, body: blob });
  if (!res.ok) { toast('A képet nem sikerült menteni.'); return; }

}
async function setImage(it, ref) { it.img = ref; delete it.noThumb; await save(); refreshPics(it); toast('Beállítva képnek.'); }
function refreshPics(it) {
  const u = imgUrl(it);
  for (const pic of $$(`[data-pic="${it.id}"]`)) { pic.querySelector('.busy')?.remove(); if (u) { let im = pic.querySelector('img'); if (!im) { im = el('img', { alt: '' }); pic.append(im); } im.src = u; } }
}
const thumbQ = []; let thumbBusy = false, snapR = null;
function wantThumb(it) {

  if (it.noThumb && Date.now() - it.noThumb < 86400000) return;   // naponta egyszer próbálja újra
  thumbQ.push(it);

}
async function runThumbs() {

    try { await makeThumb(it); } catch { it.noThumb = Date.now(); save().catch(() => {}); refreshPics(it); }
  }

}
async function makeThumb(it) {

  if (!cads.length) {
    const im = files.filter((e) => IMG.includes(ext(e.n))).sort((a, b) => b.s - a.s)[0];
    if (im) { await setImage(it, { r: im.r, p: im.p }); return; }

// Egy elem fájljai: a kiválasztott fájlok (it.files), és ha van, a régi mappás kötés fájljai.
async function itemEntries(it) {
  const out = [], seen = new Set();
  const add = (e) => { const k = e.r + '|' + e.p; if (!seen.has(k)) { seen.add(k); out.push(e); } };
  const dirs = new Map();
  for (const f of it.files) { const d = f.p.split('/').slice(0, -1).join('/'), k = f.r + '|' + d; if (!dirs.has(k)) dirs.set(k, { r: f.r, d }); }
  const found = new Map();
  await Promise.all([...dirs.values()].map(async (g) => {
    try { for (const e of (await api(`/api/list?r=${encodeURIComponent(g.r)}&p=${encodeURIComponent(g.d)}`)).entries) found.set(g.r + '|' + e.p, { ...e, r: g.r }); } catch { /* a mappa sincs meg */ }
  }));
  for (const f of it.files) add(found.get(f.r + '|' + f.p) || { n: f.p.split('/').pop(), p: f.p, r: f.r, s: 0, m: 0, missing: true });
  let folderErr = null;
  if (it.folder) {
    try { for (const e of (await api(`/api/tree?r=${encodeURIComponent(it.folder.r)}&p=${encodeURIComponent(it.folder.p)}`)).entries) if (!e.d) add({ ...e, r: it.folder.r }); }
    catch (err) { folderErr = err; }
  }

}

  if (acts && !acts.childElementCount) {
    acts.append(
      el('button', { class: 'btn sm primary', type: 'button', onclick: () => linkFiles(it, refresh) }, ic('file-plus'), 'Fájl hozzáadása'),
      ...uploadButton(() => uploadTarget(it), (got) => linkUploaded(it, got, refresh), 'btn sm'),
      el('button', { class: 'btn sm', type: 'button', onclick: () => { const b = baseDir(it); if (b) openFile(b.r, b.p, 'folder'); else toast('Még nincs fájl.'); } }, ic('folder-open'), 'Fájlkezelő'));
    dropZone(box, () => uploadTarget(it), (got) => linkUploaded(it, got, refresh));
  }
  const { list, folderErr } = await itemEntries(it);
  $('#fcount').textContent = String(list.length);
  const hint = box.querySelector('.drop-hint');
  const legacy = it.folder ? el('div', { class: 'legacy' }, ic('folder'),
    el('span', { style: 'flex:1', text: folderErr ? `A régi mappa nem található: ${rootName(it.folder.r)} / ${it.folder.p}` : `Régi kötés: a „${rootName(it.folder.r)} / ${it.folder.p}” mappa minden fájlja látszik.` }),
    el('button', { class: 'btn sm', type: 'button', onclick: async () => {
      if (!confirm('Leválasztod a mappát? Csak a kiválasztott fájlok maradnak itt (a mappa és a fájlok a gépen megmaradnak).')) return;
      it.folder = null; await save(); route();
    } }, ic('unlink'), 'Mappa leválasztása')) : null;
  const groups = GROUPS.map(([k, label, icon]) => {
    const fs = list.filter((e) => kind(e) === k);
    return fs.length ? el('div', { class: 'fgroup' }, el('h4', {}, ic(icon), `${label} · ${fs.length}`), fs.map((e) => fileRow(e, e.r, refresh, it, true, ''))) : null;
  }).filter(Boolean);
  put(box, legacy, groups.length ? groups : el('div', { class: 'empty' }, ic('file-plus'), 'Még nincs fájl kiválasztva.',
    el('div', { style: 'margin-top:10px' }, el('button', { class: 'btn primary', type: 'button', onclick: () => linkFiles(it, refresh) }, ic('file-plus'), 'Fájl hozzáadása')),
    el('div', { style: 'margin-top:8px;font-size:13px', text: 'Vagy húzd ide a fájlokat a gépről (feltöltés).' })), hint);
  icons();
}

async function openMainModel(it) {
  try {
    const files = (await itemEntries(it)).list.filter((e) => !e.missing);
    const cad = files.filter((e) => CAD.includes(ext(e.n))).sort((a, b) => b.s - a.s)[0];
    const img = it.img ? files.find((e) => sameRef(e, it.img)) : null;
    const f = cad || img || files.find((e) => IMG.includes(ext(e.n))) || files.find((e) => kind(e) === 'pdf');
    if (!f) { toast('Még nincs STEP, kép vagy rajz. Fájl hozzáadása.'); return; }
    openPreview(f.r, f.p, f, it);
  } catch (err) { toast(err.message); }
}
async function chooseImage(it) {
  const imgs = (await itemEntries(it)).list.filter((e) => !e.missing && IMG.includes(ext(e.n)));
  if (!imgs.length) { toast('Nincs kép a fájlok között. Adj hozzá egyet, vagy nyisd meg a 3D-t: „Ez legyen a kép”.', 5000); return; }
  const grid = el('div', { class: 'grid', style: 'grid-template-columns:repeat(auto-fill,minmax(150px,1fr))' }, imgs.map((e, i) => el('a', { class: 'card glass', href: '#', style: `--i:${i}`, onclick: async (ev) => { ev.preventDefault(); closeModal('dlg'); await setImage(it, { r: e.r, p: e.p }); } },
    el('div', { class: 'pic' }, el('img', { src: fileUrl(e.r, e.p), alt: '', loading: 'lazy' })), el('div', { class: 'tx' }, el('small', { text: e.n })))));
  openModal('dlg', el('div', { class: 'sheet mid glass' }, sheetHead('image', 'img', 'Kép választása', it.name, () => closeModal('dlg')), el('div', { class: 'sh-body pad' }, grid)));
}
async function removeItem(it, t) {
  if (t === 'jig') {
    const n = adsOn(it.id).length;
    if (!confirm(`Eltávolítod a(z) „${it.name}” jiget a Központból?\n\nA fájlok a helyükön maradnak.${n ? `\nA rajta lévő ${n} adapter megmarad (a kezdőlapon a „Jig nélküli adapterek” közé kerül).` : ''}`)) return;
    D.jigs = D.jigs.filter((x) => x !== it);
    for (const a of D.adapters) if (a.jig === it.id) a.jig = null;
    for (const p of D.products) p.jigs = p.jigs.filter((x) => x !== it.id);
    await save(); location.hash = `#/cella/${it.cell}`;
  } else if (t === 'ad') {
    const n = prodsOn(it.id).length;
    if (!confirm(`Eltávolítod a(z) „${it.name}” adaptert a Központból?\n\nA fájlok a helyükön maradnak.${n ? `\nA rajta lévő ${n} termék megmarad (ha más adapteren nincs, a kezdőlapon az „Adapter nélküli termékek” közé kerül).` : ''}`)) return;
    D.adapters = D.adapters.filter((x) => x !== it);
    for (const p of D.products) p.ads = p.ads.filter((x) => x !== it.id);
    await save(); location.hash = it.jig && jigOf(it.jig) ? `#/jig/${it.jig}` : '#/';
  } else {
    if (!confirm(`Eltávolítod a(z) „${it.name}” terméket a Központból?\n\nA fájlok a helyükön maradnak, csak az adatok és a jegyzetek tűnnek el.`)) return;
    const back = it.ads[0] ? `#/adapter/${it.ads[0]}` : it.jigs[0] ? `#/jig/${it.jigs[0]}` : '#/';
    D.products = D.products.filter((x) => x !== it);
    await save(); location.hash = back;
  }
}

/* ---------- Új jig, új adapter, új termék ---------- */
function formSheet(title, icon, cls, fields, onOk, okLabel) {
  const err = el('div', { class: 'muted', style: 'color:var(--accent);min-height:1em' });
  const sheet = el('div', { class: 'sheet small glass' },
    sheetHead(icon, cls, title, null, () => closeModal('dlg')),
    el('form', { class: 'sh-body pad', onsubmit: async (ev) => { ev.preventDefault(); try { await onOk(); closeModal('dlg'); } catch (e) { err.textContent = e.message; } } },
      fields, err,
      el('div', { style: 'display:flex;gap:8px;justify-content:flex-end' }, el('button', { class: 'btn', type: 'button', onclick: () => closeModal('dlg') }, 'Mégse'), el('button', { class: 'btn primary', type: 'submit' }, ic('check'), okLabel))));
  openModal('dlg', sheet);
}
// Fájlok kiválasztása egy új elemhez (a név magától kitöltődik az első STEP / fájl nevéből)
function filesField(label, startRoot, state, nameInput, onPick) {
  state.files = [];
  const show = el('div', { class: 'picked' }, el('span', { class: 'muted', style: 'font-size:13.5px', text: 'Nincs kiválasztva (később is hozzáadhatod)' }));
  const btn = el('button', { class: 'btn sm', type: 'button', onclick: async () => {
    const refs = await pickFiles(label, null); if (!refs) return;
    for (const f of refs) if (!state.files.some((x) => sameRef(x, f))) state.files.push(f);
    put(show, state.files.map((f) => el('span', { class: 'chip' }, ic(KIND_ICON[kind({ n: f.p })]), f.p.split('/').pop())));
    const main = state.files.find((f) => CAD.includes(ext(f.p))) || state.files[0];
    if (main && !nameInput.value) nameInput.value = main.p.split('/').pop().replace(/\.[^.]+$/, '');
    onPick?.(state.files); icons();
  } }, ic('file-search'), 'Fájlok kiválasztása');
  return el('div', { class: 'field', style: 'display:flex;flex-direction:column;gap:6px' }, el('span', { style: 'font-size:13.5px;font-weight:600;color:var(--muted)', text: label }), btn, show);
}
function newJig(cell) {
  const state = {};
  const name = el('input', { class: 'input', required: true, placeholder: 'pl. Alap jig' });
  formSheet(`Új jig – ${cell.name}`, 'grip', 'jig', [
    el('label', { class: 'field' }, 'Név', name),
    filesField('A jig fájljai (STEP, rajz)', 'manipulator', state, name),
  ], async () => {
    const n = name.value.trim(); if (!n) throw new Error('Adj nevet a jignek.');
    const j = { id: uid(), cell: cell.id, name: n, folder: null, files: state.files, img: null, fields: [], notes: [], created: Date.now() };
    D.jigs.push(j); await save(); location.hash = `#/jig/${j.id}`;
  }, 'Létrehozás');
  setTimeout(() => name.focus(), 50);
}
function newAdapter(jig) {
  const state = {};
  const name = el('input', { class: 'input', required: true, placeholder: 'pl. 2950.7510 kád extra' });
  formSheet(`Új adapter – ${jig.name}`, 'puzzle', 'ad', [
    el('label', { class: 'field' }, 'Név', name),
    filesField('Az adapter fájljai (STEP, rajz)', 'manipulator', state, name),
  ], async () => {
    const n = name.value.trim(); if (!n) throw new Error('Adj nevet az adapternek.');
    const a = { id: uid(), jig: jig.id, name: n, folder: null, files: state.files, img: null, fields: [], notes: [], created: Date.now() };
    D.adapters.push(a); await save(); location.hash = `#/adapter/${a.id}`;
  }, 'Létrehozás');
  setTimeout(() => name.focus(), 50);
}
// Termék egy adapterre. Ha a termék eddig adapter nélkül volt ugyanezen a jigen, átkerül az adapterre.
function putOnAd(p, ad) {
  if (!p.ads.includes(ad.id)) p.ads.push(ad.id);
  p.jigs = p.jigs.filter((x) => x !== ad.jig);
}
function newProduct(ad) {
  const state = {};
  const name = el('input', { class: 'input', placeholder: 'pl. Konzol A12' });
  const others = D.products.filter((p) => !p.ads.includes(ad.id)).sort(byName);
  const sel = el('select', { class: 'input' }, el('option', { value: '', text: '— válassz —' }), others.map((p) => el('option', { value: p.id, text: p.name })));
  formSheet(`Termék – ${ad.name}`, 'package', 'prod', [
    el('label', { class: 'field' }, 'Név', name),
    filesField('A termék fájljai (STEP, rajz)', 'products', state, name, (refs) => {
      const ex = others.find((p) => p.files.some((x) => refs.some((f) => sameRef(x, f))));
      if (ex) { sel.value = ex.id; toast(`Ez a fájl már a(z) „${ex.name}” terméknél van – azt teszem az adapterre.`, 5000); }
    }),
    others.length ? el('div', { class: 'or', text: 'vagy egy meglévő termék' }) : null,
    others.length ? el('label', { class: 'field' }, 'Meglévő termék', sel) : null,
  ], async () => {
    if (sel.value) { putOnAd(prodOf(sel.value), ad); await save(); route(); return; }
    const n = name.value.trim(); if (!n) throw new Error('Adj nevet, vagy válassz meglévő terméket.');
    const p = { id: uid(), name: n, folder: null, files: state.files, img: null, ads: [ad.id], jigs: [], fields: [], notes: [], created: Date.now() };
    D.products.push(p); await save(); location.hash = `#/termek/${p.id}`;
  }, 'Hozzáadás');
  setTimeout(() => name.focus(), 50);
}
function addToAd(p) {
  const opts = D.cells.flatMap((c) => jigsIn(c.id).flatMap((j) => adsOn(j.id).filter((a) => !p.ads.includes(a.id)).map((a) => el('option', { value: a.id, text: `${c.name} – ${j.name} – ${a.name}` }))));
  if (!opts.length) { toast('Nincs (több) adapter. Előbb a jig oldalán: „Új adapter”.', 5000); return; }
  const sel = el('select', { class: 'input' }, opts);
  formSheet(p.ads.length ? `„${p.name}” másik adapterre is` : `„${p.name}” adapterre`, 'puzzle', 'ad', [el('label', { class: 'field' }, 'Adapter', sel), el('p', { class: 'muted', style: 'margin:0;font-size:13.5px', text: 'Ugyanaz a termék lesz ott is (nem másolat): az adatok, jegyzetek és fájlok közösek.' })],
    async () => { putOnAd(p, adOf(sel.value)); await save(); route(); }, 'Hozzáadás');
}

/* =====================================================================
   9. Minden fájl (mappák szerint)
   ===================================================================== */
async function renderFiles(params) {
  let r = params.get('r') || ROOTS[0]?.id, p = params.get('p') || '';
  if (!ROOTS.find((x) => x.id === r)) r = ROOTS[0]?.id;
  const go = (nr, np) => { location.hash = `#/fajlok?r=${encodeURIComponent(nr)}&p=${encodeURIComponent(np)}`; };
  const box = el('div', { class: 'files glass' });
  const parts = p ? p.split('/') : [];
  const target = () => ({ r, p });
  const refresh = () => route();
  setWhere([HOME, ['files', 'Fájlok', '#/fajlok']]);
  $('#app').replaceChildren(el('div', { class: 'page' },
    el('div', { class: 'head' }, el('div', {}, el('h1', { text: 'Fájlok' }), el('p', { text: 'Minden fájl, mappák szerint. Ide is húzhatsz fájlokat.' }))),
    el('div', { class: 'bar' },
      el('div', { class: 'roots' }, ROOTS.map((x) => el('button', { type: 'button', 'aria-pressed': String(x.id === r), title: x.ok ? x.path : `Nem található: ${x.path}`, onclick: () => go(x.id, '') }, ic(x.ok ? 'hard-drive' : 'circle-alert'), x.name))),
      el('span', { style: 'flex:1' }),
      ...uploadButton(target, refresh),
      el('button', { class: 'btn sm', type: 'button', onclick: async () => { const name = prompt('Új mappa neve:'); if (!name) return; try { const d = await api('/api/mkdir', { r, p, name }); toast(`Mappa kész: ${fullPath(r, d.p)}`, 6000); refresh(); } catch (err) { toast(err.message); } } }, ic('folder-plus'), 'Új mappa'),
      el('button', { class: 'btn sm', type: 'button', onclick: () => openFile(r, p, 'folder') }, ic('folder-open'), 'Fájlkezelő')),
    el('div', { class: 'fcrumbs' }, el('button', { type: 'button', text: rootName(r), onclick: () => go(r, '') }),
      ...parts.flatMap((part, i) => [ic('chevron-right'), el('button', { type: 'button', text: part, onclick: () => go(r, parts.slice(0, i + 1).join('/')) })])),
    box));
  dropZone(box, target, refresh);
  icons();
  if (!r) { box.prepend(el('div', { class: 'empty', text: 'Nincs beállítva mappa (Beállítások).' })); return; }
  try {
    const d = await api(`/api/list?r=${encodeURIComponent(r)}&p=${encodeURIComponent(p)}`);
    const list = d.entries.sort((a, b) => (b.d - a.d) || coll.compare(a.n, b.n));
    const hint = box.querySelector('.drop-hint');
    const rows = list.map((e) => {
      const row = fileRow(e, r, refresh, ownerOf(r, e.p), false);
      if (e.d) { row.addEventListener('click', () => go(r, e.p)); row.addEventListener('keydown', (ev) => { if (ev.key === 'Enter') go(r, e.p); }); }
      return row;
    });
    box.replaceChildren(...(rows.length ? rows : [el('div', { class: 'empty' }, ic('folder-open'), 'Üres mappa.')]), hint);
    // ha ez a mappa egy jighez / adapterhez / termékhez tartozik, mutassuk
    const own = ownerOf(r, p);
    if (own && (own.folder.p === p)) box.prepend(el('a', { class: 'res', href: itemHref(own), style: 'margin:4px' }, el('span', { class: `ti ${itemType(own)}` }, ic(T[itemType(own)].ico)), el('span', { class: 'tx' }, el('b', { text: own.name }), el('small', { text: `Ez a mappa ehhez tartozik (${T[itemType(own)].label.toLowerCase()})` }))));
    icons();
  } catch (err) { box.replaceChildren(el('div', { class: 'empty' }, ic('triangle-alert'), err.message)); icons(); }
}

/* =====================================================================
   10. Beállítások
   ===================================================================== */
function renderSettings() {
  const rows = ROOTS.map((x) => ({ id: x.id, nev: x.name, ut: x.path }));
  const list = el('div', {});
  const draw = () => {
    list.replaceChildren(...rows.map((m, i) => el('div', { class: 'kv', style: 'grid-template-columns:minmax(120px,.6fr) 1.6fr 32px' },
      el('input', { class: 'input k', value: m.nev, placeholder: 'Név', oninput: (ev) => { m.nev = ev.target.value; } }),
      el('input', { class: 'input', value: m.ut, placeholder: 'C:\\Users\\…\\Mappa', oninput: (ev) => { m.ut = ev.target.value; } }),
      el('button', { class: 'icon-btn', type: 'button', title: 'Levétel (a mappa megmarad a gépen)', onclick: () => { rows.splice(i, 1); draw(); } }, ic('x')))));
    icons();
  };
  draw();
  setWhere([HOME, ['set', 'Beállítások', '#/beallitasok']]);
  $('#app').replaceChildren(el('div', { class: 'page', style: 'max-width:820px' },
    el('div', { class: 'head' }, el('div', {}, el('h1', { text: 'Beállítások' }), el('p', { text: 'Csak ezen a gépen érvényes.' }))),
    el('div', { class: 'box glass' },
      el('h3', {}, ic('hard-drive'), 'Mappák'),
      el('p', { class: 'muted', style: 'margin:0 0 12px;font-size:13.5px', text: 'Ezekből a mappákból választhatsz fájlokat a jigekhez, adapterekhez és termékekhez. Az útvonalat a Fájlkezelő címsorából másold be.' }),
      list,
      el('div', { style: 'display:flex;gap:8px;margin-top:10px;flex-wrap:wrap' },
        el('button', { class: 'btn sm', type: 'button', title: 'Egy újabb mappát köt be a Központba (nem hoz létre mappát a gépen)', onclick: () => { rows.push({ id: '', nev: '', ut: '' }); draw(); } }, ic('plus'), 'Újabb gyökérmappa bekötése'),
        el('button', { class: 'btn sm primary', type: 'button', onclick: async () => {
          try { await api('/api/roots', { mappak: rows.filter((m) => m.ut.trim()) }); await init(true); toast('Elmentve.'); route(); } catch (err) { toast(err.message, 5000); }
        } }, ic('check'), 'Mentés'))),
    el('div', { class: 'box glass', style: 'margin-top:16px' },
      el('h3', {}, ic('database'), 'Adatok'),
      el('p', { class: 'muted', style: 'margin:0;font-size:13.5px' }, `A cellák, jigek, adapterek, termékek, adatok és jegyzetek itt vannak: ${APPDIR}\\adatok.json. Naponta mentés készül a mentes mappába (60 napig). A fájlok a saját helyükön maradnak.`),
      el('div', { style: 'margin-top:10px' }, el('button', { class: 'btn sm', type: 'button', onclick: () => { const b = new Blob([JSON.stringify(D, null, 2)], { type: 'application/json' }); const a = el('a', { href: URL.createObjectURL(b), download: `valk-adatok-${new Date().toISOString().slice(0, 10)}.json` }); a.click(); } }, ic('download'), 'Adatok letöltése (mentés)')))));
  icons();
}

/* =====================================================================
   11. Útvonalak
   ===================================================================== */
function route() {
  closeModal('dlg'); $('#menu').hidden = true;
  const h = location.hash || '#/';
  const [path, qs] = h.slice(1).split('?');
  const parts = path.split('/').filter(Boolean);
  window.scrollTo(0, 0);
  if (!parts.length) return renderHome();
  if (parts[0] === 'cella') return renderCell(parts[1]);
  if (parts[0] === 'jig') return renderItem(jigOf(parts[1]), 'jig');
  if (parts[0] === 'adapter') return renderItem(adOf(parts[1]), 'ad');
  if (parts[0] === 'termek') return renderItem(prodOf(parts[1]), 'prod');
  if (parts[0] === 'fajlok') return renderFiles(new URLSearchParams(qs || ''));
  if (parts[0] === 'beallitasok') return renderSettings();
  notFound();
}
let pendingPv = null;   // a keresőből választott fájl: az oldalváltás után nyílik meg
addEventListener('hashchange', () => { closeModal('pv'); route(); if (pendingPv) { const a = pendingPv; pendingPv = null; openPreview(...a); } });

async function init(quiet) {
  const d = await api('/api/init');
  TOKEN = d.token; ROOTS = d.roots; APPDIR = d.dir || '';
  if (d.kozpont) $('#kozpontLink').href = d.kozpont;
  if (!quiet) await loadData();
}
icons();
init().then(route).catch(() => {
  $('#app').replaceChildren(el('div', { class: 'empty' }, ic('plug-zap'), 'A helyi program nem válaszol. Indítsd el újra (Kozpont.bat vagy a Teendőim menüjéből).'));
  icons();
});
</script>
