<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1011">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>BREMAT Központ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<!--
  =====================================================================
  BREMAT Központ – a bremat-stuff kezdőlapja.
  Felül cím, bal oldalt lenyitható menü, középen két fül:
    1. Munkanapló – a heti bejegyzések (adat: /api/naplo)
    2. Valk lap   – a heti karbantartási lap állapota (adat: /api/km)
  A Projektek a menüből nyílnak (adat: /api/kozpont, csak kóddal).
  A Központ maga nem tárol semmit, csak összerakja a meglévő oldalak adatait.
  =====================================================================
-->
<style>
/* ---------- Színek (tokenek) ----------
   Semleges grafit alap; a két fülnek megmarad a saját színe:
   a napló kékeszöld, a Valk lap piros – mint a saját oldalukon. */
:root {
  --bg: #0f1011;
  --panel: #1a1b1d;
  --panel-2: #242528;
  --line: #36383c;
  --text: #eeeeec;
  --muted: #a9abb0;
  --naplo: #3fb6c9;  --naplo-text: #7fd6e3;
  --valk: #d50f25;   --valk-text: #ff6670;
  --ok: #34a862; --ok-text: #74dc9a; --warn: #e9a92b; --bad: #e5484d;
  --ink-on-color: #0f1011;
  --radius: 10px;
  --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-cond: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

/* ---------- Fejléc: menügomb + cím ---------- */
.top { position: sticky; top: 0; z-index: 20; background: #000; border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; min-height: 58px; }
.burger { width: 44px; height: 44px; border-radius: 8px; border: 1.5px solid var(--line); background: transparent; cursor: pointer; display: grid; place-items: center; flex: none; }
.burger:hover { border-color: var(--muted); }
.burger i, .burger i::before, .burger i::after { display: block; width: 18px; height: 2px; background: var(--text); border-radius: 2px; position: relative; content: ''; }
.burger i::before { position: absolute; top: -6px; } .burger i::after { position: absolute; top: 6px; }
.brand { font-family: var(--font-cond); font-size: 22px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; text-decoration: none; }
.brand span { color: var(--muted); font-weight: 600; }
.top .week { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }

/* ---------- Oldalsó menü (lenyitható) ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 40; opacity: 0; transition: opacity .2s; }
.scrim.open { opacity: 1; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: var(--panel); border-right: 1px solid var(--line); z-index: 41;
  transform: translateX(-100%); transition: transform .22s ease; display: flex; flex-direction: column; padding: 14px 12px; gap: 4px; overflow-y: auto; }
.drawer.open { transform: none; }
.drawer .head { display: flex; align-items: center; justify-content: space-between; padding: 4px 6px 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.drawer .head b { font-family: var(--font-cond); font-size: 20px; letter-spacing: .06em; text-transform: uppercase; }
.drawer .close { width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 22px; line-height: 1; }
.drawer .sec { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 4px; }
.navlink { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-weight: 600; }
.navlink:hover, .navlink[aria-current="page"] { background: var(--panel-2); }
.navlink .dot { width: 10px; height: 10px; border-radius: 3px; background: var(--muted); flex: none; }
.navlink .ext { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }

/* ---------- Tartalom ---------- */
main.wrap { padding-top: 22px; padding-bottom: 60px; }
h1 { font-family: var(--font-cond); font-size: 34px; line-height: 1.05; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 18px; }
h2 { font-family: var(--font-cond); font-size: 20px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); } .small { font-size: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.err { color: #ff9296; font-weight: 600; font-size: 14px; margin: 0; }
.banner { border: 1.5px solid var(--bad); background: rgba(229,72,77,.1); border-radius: var(--radius); padding: 12px 14px; }
.demo-bar { background: var(--warn); color: var(--ink-on-color); text-align: center; font-weight: 600; font-size: 14px; padding: 6px 12px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--panel-2); font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.naplo { background: var(--naplo); border-color: var(--naplo); color: #06171a; }
.btn.valk { background: var(--valk); border-color: var(--valk); color: #fff; }
.btn.ghost { background: transparent; }
/* Hosszú feliratú gomb: telefonon sorba törhet, nem lóg ki */
.btn.long { white-space: normal; text-align: center; padding-block: 8px; }

input[type=text], input[type=password], textarea { background: #101113; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 46px; width: 100%; }
textarea { min-height: 80px; resize: vertical; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- A két fül ---------- */
.tabs { display: flex; gap: 6px; border-bottom: 2px solid var(--line); margin-bottom: 18px; }
.tab { flex: 1 1 0; max-width: 260px; min-height: 52px; padding: 0 16px; background: transparent; border: 0; border-bottom: 4px solid transparent; margin-bottom: -2px;
  cursor: pointer; font-family: var(--font-cond); font-size: 20px; font-weight: 700; letter-spacing: .03em; color: var(--muted); display: flex; align-items: center; gap: 10px; justify-content: center; }
.tab .sw { width: 10px; height: 10px; border-radius: 3px; }
.tab[data-tab="naplo"] .sw { background: var(--naplo); } .tab[data-tab="valk"] .sw { background: var(--valk); }
.tab[aria-selected="true"] { color: var(--text); }
.tab[data-tab="naplo"][aria-selected="true"] { border-bottom-color: var(--naplo); }
.tab[data-tab="valk"][aria-selected="true"] { border-bottom-color: var(--valk); }

/* Munkanapló fül */
.day { border-top: 1px solid var(--line); padding: 10px 0; display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 14px; }
.day:last-child { border-bottom: 1px solid var(--line); }
.day .dname { font-weight: 700; } .day .dname small { display: block; color: var(--muted); font-weight: 500; }
.day.today .dname { color: var(--naplo-text); }
.day .none { color: var(--muted); font-size: 14px; }
.ent { padding: 2px 0 6px; } .ent + .ent { border-top: 1px dashed var(--line); padding-top: 8px; }
.ent .txt { white-space: pre-wrap; overflow-wrap: anywhere; }
.ent .meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; display: flex; gap: 4px 12px; flex-wrap: wrap; }
.hrs { color: var(--naplo-text); font-weight: 700; }
.tag { display: inline-block; padding: 1px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); font-weight: 600; font-size: 12.5px; }

/* Valk fül */
.status { border-left: 6px solid var(--line); }
.status.ok { border-left-color: var(--ok); } .status.todo { border-left-color: var(--warn); } .status.idle { border-left-color: var(--muted); }
.status .big { font-size: 22px; font-weight: 700; margin: 2px 0 4px; }
.status.ok .big { color: var(--ok-text); } .status.todo .big { color: #f6cb6a; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.fact { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.fact b { display: block; font-size: 24px; font-variant-numeric: tabular-nums; }
.fact span { color: var(--muted); font-size: 14px; }
.sheets { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.sheets li + li { border-top: 1px solid var(--line); }
.sheets a { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 11px 14px; text-decoration: none; }
.sheets a:hover { background: var(--panel-2); }
.sheets .wk { font-weight: 700; font-variant-numeric: tabular-nums; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--ok); color: var(--ink-on-color); } .badge.warn { background: var(--warn); color: var(--ink-on-color); }
.badge.bad { background: var(--bad); color: var(--ink-on-color); } .badge.n { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

/* Projektek */
.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; align-items: start; }
.pcard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.pcard > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard > summary b { font-family: var(--font-cond); font-size: 21px; display: flex; justify-content: space-between; gap: 10px; }
.pcard > summary b span { color: var(--muted); font-family: var(--font); font-size: 14px; font-weight: 600; }
.pcard > summary small { color: var(--muted); }
.pcard ul { list-style: none; margin: 0; padding: 0 8px 8px; border-top: 1px solid var(--line); }
.pcard li a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 8px; border-radius: 6px; text-decoration: none; }
.pcard li a:hover { background: var(--panel-2); }
.pcard li a small { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }

.gate { max-width: 420px; margin: 6vh auto 0; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ok); color: var(--ink-on-color); font-weight: 700; padding: 12px 18px; border-radius: 10px; z-index: 60; display: none; max-width: calc(100vw - 32px); }
#toast.bad { background: var(--bad); }

@media (max-width: 560px) {
  h1 { font-size: 28px; }
  .top .week { display: none; }
  .tab { font-size: 18px; padding: 0 8px; }
  .day { grid-template-columns: minmax(0, 1fr); }
  .sheets a { grid-template-columns: 60px minmax(0, 1fr); }
  .sheets .badges { grid-column: 1 / -1; justify-content: flex-start; }
}
</style>
</head>
<body>
<div id="demo" class="demo-bar" hidden>DEMÓ mód – mintaadatok, csak ebben a böngészőben. Az éleshez nyisd meg a címet ?demo nélkül.</div>

<!-- Fejléc: menügomb, cím, aktuális hét -->
<header class="top">
  <div class="wrap">
    <button class="burger" id="menuBtn" type="button" aria-label="Menü megnyitása" aria-expanded="false" aria-controls="drawer"><i></i></button>
    <a class="brand" href="#/">BREMAT <span>Központ</span></a>
    <span class="week" id="weekLabel"></span>
  </div>
</header>

<!-- A lenyitható menü. A gombok vagy a Központon belül váltanak (#/...),
     vagy átvisznek a teljes oldalra. -->
<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Főmenü" hidden>
  <div class="head"><b>Menü</b><button class="close" id="menuClose" type="button" aria-label="Menü bezárása">×</button></div>
  <a class="navlink" href="#/" data-view="home"><span class="dot"></span>Kezdőlap</a>
  <a class="navlink" href="#/projektek" data-view="projektek"><span class="dot"></span>Projektek</a>
  <div class="sec">Oldalak</div>
  <a class="navlink" href="/naplo/"><span class="dot" style="background:var(--naplo)"></span>Munkanapló<span class="ext">teljes</span></a>
  <a class="navlink" href="/valk/"><span class="dot" style="background:var(--valk)"></span>Valk heti lap<span class="ext">teljes</span></a>
  <a class="navlink" href="/valk/#/uj"><span class="dot" style="background:var(--valk)"></span>Új heti lap kitöltése</a>
  <a class="navlink" id="privLink" href="#" target="_blank" rel="noopener" hidden><span class="dot"></span>Saját oldalak<span class="ext">Claude ↗</span></a>
  <div class="sec">Egyéb</div>
  <a class="navlink" href="#/beallitasok" data-view="beallitasok"><span class="dot"></span>Beállítások</a>
</nav>

<main class="wrap" id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>

<script type="module">
/* =====================================================================
   0. Régi címek: a heti lap a /valk/ címre költözött. Ha valaki a régi
      könyvjelzővel jön (pl. /#/uj vagy /#/lap/...), átküldjük oda.
   ===================================================================== */
if (/^#\/(uj|lap\/)/.test(location.hash)) location.replace('/valk/' + location.search + location.hash);

const DEMO = new URLSearchParams(location.search).has('demo');
const ROBOT = 'Valk robot';

/* ---------- Segédfüggvények ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* nincs tárolás */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* nincs tárolás */ } },
};
function toast(msg, bad = false) {
  const t = $('#toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, bad ? 6000 : 3000);
}

/* ---------- Dátum (mindig budapesti idő szerint) ---------- */
const ymdFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => ymdFmt.format(new Date());
const toDate = (ymd) => new Date(ymd + 'T00:00:00Z');
const addDays = (ymd, n) => { const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = (ymd) => addDays(ymd, -((toDate(ymd).getUTCDay() + 6) % 7));
function isoWeek(ymd) {
  const d = toDate(ymd);
  d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const year = d.getUTCFullYear(); const jan4 = new Date(Date.UTC(year, 0, 4));
  return { year, week: 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7) };
}
const DAYS = ['Hétfő', 'Kedd', 'Szerda', 'Csütörtök', 'Péntek', 'Szombat', 'Vasárnap'];
const huShort = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const huLong = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
const fmtShort = (ymd) => huShort.format(toDate(ymd));
const fmtH = (h) => `${String(Math.round(h * 100) / 100).replace('.', ',')} óra`;

/* =====================================================================
   1. Adatréteg – kinek mit küldünk.
   Mindhárom szerverfüggvény ugyanúgy működik: POST kérés JSON-nal,
   benne a művelet neve (action) és a belépési kód.
   DEMÓ módban ugyanezek a függvények mintaadatot adnak vissza.
   ===================================================================== */
class AccessError extends Error {}
async function post(url, action, payload, code) {
  let res;
  try {
    res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, code, ...payload }), cache: 'no-store' });
  } catch { throw new Error('Nincs kapcsolat a szerverrel. Ellenőrizd az internetet.'); }
  let body = null; try { body = await res.json(); } catch { /* nem JSON */ }
  if (res.status === 401) throw new AccessError(body?.error || 'Hibás hozzáférési kód');
  if (!res.ok) throw new Error(body?.error || `Szerverhiba (${res.status})`);
  return body?.data;
}
// A kód: ugyanaz a tárolt kód, amit a heti lap és a napló is használ.
const kmCode = () => store.get('km-kod') || '';
const naploCode = () => store.get('naplo-kod') || store.get('km-kod') || '';

const live = {
  ping: (code) => post('/api/kozpont', 'ping', {}, code),
  projects: () => post('/api/kozpont', 'projects', {}, kmCode()),
  checks: () => post('/api/km', 'list', {}, kmCode()),
  idle: () => post('/api/km', 'idle_list', {}, kmCode()),
  week: (from, to) => post('/api/naplo', 'range', { from, to }, naploCode()),
  addEntry: (entry, name) => post('/api/naplo', 'create', { entry, name }, naploCode()),
};

function demoApi() {
  const m = mondayOf(today());
  const wk = (d) => isoWeek(d);
  const mkCheck = (d, who, a, s, appr, esc) => ({ id: 'demo-' + d, check_date: d, iso_year: wk(d).year, iso_week: wk(d).week, robot: ROBOT, inspector: who, action_count: a, skip_count: s, approved_by: appr ? 'Nagy Béla' : null, escalate: !!esc });
  const checks = [mkCheck(addDays(m, -7), 'Tóth Ádám', 1, 1, false, true), mkCheck(addDays(m, -14), 'Kovács Gábor', 2, 0, false), mkCheck(addDays(m, -21), 'Tóth Ádám', 0, 0, true), mkCheck(addDays(m, -35), 'Kovács Gábor', 1, 0, true)];
  let entries = [
    { id: 'a', date: m, text: 'Heti karbantartás a Valk roboton.', area: 'Valk robot', hours: 1.5, author: 'Alex' },
    { id: 'b', date: addDays(m, 1) <= today() ? addDays(m, 1) : m, text: 'Kész: 3100.0610 uj kialakitas (összesen 2 ó 10 p)', area: null, hours: null, author: 'Alex' },
  ];
  const delay = (v) => new Promise((r) => setTimeout(() => r(structuredClone(v)), 120));
  return {
    ping: () => delay(true),
    projects: () => delay({ private_index: '#', projects: [
      { key: 'a', name: 'Tokmány vagy lemez', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Lemez vagy tokmány', u: '#', d: '2026-11-04' }, { t: 'Vastag lemez 3D', u: '#', d: '2026-10-29', k: ['3D'] }] },
      { key: 'b', name: 'Univerzális adapter és befogó', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Univerzális adapter', u: '#', d: '2026-10-19' }] },
    ] }),
    checks: () => delay(checks),
    idle: () => delay([]),
    week: (from, to) => delay(entries.filter((e) => e.date >= from && e.date <= to)),
    addEntry: (e, name) => { const r = { id: String(Math.random()), date: e.date, text: e.text.trim(), area: null, hours: e.hours ? Number(String(e.hours).replace(',', '.')) : null, author: name }; entries.push(r); return delay(r); },
  };
}
const api = DEMO ? demoApi() : live;

/* =====================================================================
   2. Belépés – ha nincs kód ezen az eszközön, bekérjük.
   (A ?kod=... linket is elfogadja, és kiveszi a címsorból.)
   ===================================================================== */
(function codeFromUrl() {
  const u = new URL(location.href); const k = u.searchParams.get('kod');
  if (k) { store.set('km-kod', k.trim()); u.searchParams.delete('kod'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
})();

function renderGate(msg = '') {
  $('#menuBtn').hidden = true;
  $('#app').innerHTML = `
    <div class="gate panel stack">
      <h1>Belépés</h1>
      <p class="muted" style="margin:0">Írd be a hozzáférési kódot. Ezen az eszközön megjegyzi.</p>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <form id="gateForm" class="stack">
        <label class="field"><span>Hozzáférési kód</span><input id="gateCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
        <button class="btn valk" type="submit">Belépés</button>
      </form>
    </div>`;
  $('#gateCode').focus();
  $('#gateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const code = $('#gateCode').value.trim();
    try { await api.ping(code); store.set('km-kod', code); route(); }
    catch (err) { renderGate(err instanceof AccessError ? 'Hibás hozzáférési kód.' : err.message); }
  });
}
// Minden adatlekérés ezen megy át: ha a kód rossz, visszamegyünk a belépéshez.
async function guarded(fn) {
  try { return await fn(); } catch (e) {
    if (e instanceof AccessError) { store.del('km-kod'); renderGate('A kód nem érvényes. Írd be újra.'); }
    throw e;
  }
}

/* =====================================================================
   3. A menü nyitása / zárása
   ===================================================================== */
function setMenu(open) {
  const d = $('#drawer'), s = $('#scrim');
  $('#menuBtn').setAttribute('aria-expanded', String(open));
  if (open) {
    d.hidden = false; s.hidden = false;
    requestAnimationFrame(() => { d.classList.add('open'); s.classList.add('open'); });
    $('#menuClose').focus();
  } else {
    d.classList.remove('open'); s.classList.remove('open');
    setTimeout(() => { if (!d.classList.contains('open')) { d.hidden = true; s.hidden = true; } }, 230);
  }
}
$('#menuBtn').addEventListener('click', () => setMenu(true));
$('#menuClose').addEventListener('click', () => setMenu(false));
$('#scrim').addEventListener('click', () => setMenu(false));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
$$('#drawer a').forEach((a) => a.addEventListener('click', () => setMenu(false)));

/* =====================================================================
   4. Kezdőlap: cím + két fül
   ===================================================================== */
const TABS = { naplo: 'Munkanapló', valk: 'Valk lap' };
let tab = store.get('kozpont-ful') in TABS ? store.get('kozpont-ful') : 'naplo';

function renderHome() {
  const t = today(); const { year, week } = isoWeek(t);
  $('#app').innerHTML = `
    <h1>Jó munkát!</h1>
    <p class="sub">${esc(huLong.format(toDate(t)))} · ${year}. ${week}. hét</p>
    <div class="tabs" role="tablist">
      ${Object.entries(TABS).map(([k, label]) => `<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${k === tab}"><span class="sw"></span>${label}</button>`).join('')}
    </div>
    <section id="tabBody" role="tabpanel"><p class="muted">Betöltés…</p></section>`;
  $$('.tab').forEach((b) => b.addEventListener('click', () => { tab = b.dataset.tab; store.set('kozpont-ful', tab); renderHome(); }));
  (tab === 'naplo' ? renderNaplo : renderValk)().catch(showError);
}
function showError(e) {
  if (e instanceof AccessError) return;
  const box = $('#tabBody') || $('#app');
  box.innerHTML = `<div class="banner">Nem sikerült betölteni: ${esc(e.message)}</div>`;
}

/* ---------- 4/a. Munkanapló fül: a hét napjai + gyors beírás ---------- */
async function renderNaplo() {
  const t = today(), mon = mondayOf(t), sun = addDays(mon, 6);
  // A napló kódja lehet más, mint a Központé (NAPLO_ACCESS_CODE) – ilyenkor
  // nem léptetünk ki, csak jelezzük, hogy a teljes naplóban kell belépni.
  let rows;
  try { rows = await api.week(mon, sun); } catch (e) {
    if (!(e instanceof AccessError)) throw e;
    $('#tabBody').innerHTML = `<div class="panel stack"><p style="margin:0">A Munkanapló külön kóddal védett ezen az eszközön.</p><div><a class="btn naplo" href="/naplo/">Belépés a naplóba</a></div></div>`;
    return;
  }
  const name = store.get('naplo-nev') || '';
  const sum = rows.reduce((s, r) => s + (r.hours || 0), 0);
  // Csak a mai napig mutatjuk a napokat (a jövő üres lenne)
  const days = DAYS.map((n, i) => ({ n, d: addDays(mon, i) })).filter((x) => x.d <= t);
  $('#tabBody').innerHTML = `
    <div class="stack">
      <form id="quick" class="panel stack" novalidate>
        <label class="field"><span>Mit csináltál ma?</span><textarea id="qText" maxlength="4000" placeholder="pl. áramátadó csere, szűrőtisztítás…"></textarea></label>
        <div class="row">
          <label class="field" style="flex:0 1 120px"><span>Idő (óra)</span><input type="text" id="qHours" inputmode="decimal" maxlength="5" placeholder="pl. 1,5"></label>
          <label class="field" style="flex:1 1 180px" ${name ? 'hidden' : ''}><span>Neved</span><input type="text" id="qName" maxlength="120" value="${esc(name)}"></label>
          <button class="btn naplo" type="submit" id="qSave" style="align-self:flex-end">Mentés a mai napra</button>
        </div>
        <p class="err" id="qErr" hidden></p>
      </form>
      <div>
        <div class="row" style="justify-content:space-between;margin-bottom:8px">
          <h2 style="margin:0">Ez a hét</h2>
          <span class="muted small">${fmtShort(mon)} – ${fmtShort(sun)}${rows.length ? ` · ${rows.length} bejegyzés${sum ? ` · ${fmtH(sum)}` : ''}` : ''}</span>
        </div>
        ${days.reverse().map(({ n, d }) => {
          const list = rows.filter((r) => r.date === d);
          return `<div class="day${d === t ? ' today' : ''}">
            <div class="dname">${n}<small>${fmtShort(d)}${d === t ? ' · ma' : ''}</small></div>
            <div>${list.length ? list.map((r) => `
              <div class="ent"><div class="txt">${esc(r.text)}</div>
                <div class="meta">${r.area ? `<span class="tag">${esc(r.area)}</span>` : ''}${r.hours ? `<span class="hrs">${fmtH(r.hours)}</span>` : ''}<span>${esc(r.author)}</span></div></div>`).join('')
              : '<span class="none">Nincs bejegyzés</span>'}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="row"><a class="btn long" href="/naplo/">Teljes napló – szerkesztés, keresés, korábbi hetek</a></div>
    </div>`;
  $('#quick').addEventListener('submit', async (e) => {
    e.preventDefault();
    const er = $('#qErr'), text = $('#qText').value.trim(), hours = $('#qHours').value.trim(), nm = ($('#qName').value || name).trim();
    const fail = (m) => { er.hidden = false; er.textContent = m; };
    if (!text) return fail('Írd be, mit csináltál.');
    if (hours) { const h = Number(hours.replace(',', '.')); if (!Number.isFinite(h) || h <= 0 || h > 24) return fail('Az idő 0 és 24 óra között lehet (pl. 1,5).'); }
    if (!nm) return fail('Írd be a nevedet.');
    const b = $('#qSave'); b.disabled = true; b.textContent = 'Mentés…';
    try {
      await api.addEntry({ date: today(), text, hours }, nm);
      store.set('naplo-nev', nm); toast('Elmentve.'); renderNaplo().catch(showError);
    } catch (err) {
      fail(err instanceof AccessError ? 'A napló kódja nem érvényes ezen az eszközön – lépj be a teljes naplóban.' : `Nem sikerült menteni: ${err.message}`); b.disabled = false; b.textContent = 'Újrapróbálom';
    }
  });
}

/* ---------- 4/b. Valk fül: e heti állapot + legutóbbi lapok ---------- */
async function renderValk() {
  const [checks, idle] = await guarded(() => Promise.all([api.checks(), api.idle()]));
  const t = today(), { year, week } = isoWeek(t);
  const mine = checks.filter((r) => r.robot === ROBOT).sort((a, b) => b.check_date.localeCompare(a.check_date));
  const thisWeek = mine.find((r) => r.iso_year === year && r.iso_week === week);
  const idleNow = idle.find((x) => x.robot === ROBOT && x.iso_year === year && x.iso_week === week);
  const unapproved = mine.filter((r) => !r.approved_by).length;
  const openEsc = mine.filter((r) => r.escalate && !r.approved_by).length;

  // Az e heti kártya három állapota: kitöltve / nem üzemelt / még nincs
  const status = thisWeek
    ? `<div class="panel status ok"><span class="muted small">${year}. ${week}. hét</span>
         <div class="big">Kitöltve</div>
         <p style="margin:0 0 10px">${esc(thisWeek.inspector)} · ${fmtShort(thisWeek.check_date)}${thisWeek.approved_by ? ` · jóváhagyta: ${esc(thisWeek.approved_by)}` : ' · jóváhagyásra vár'}</p>
         <a class="btn" href="/valk/#/lap/${encodeURIComponent(thisWeek.id)}">Lap megnyitása</a></div>`
    : idleNow
      ? `<div class="panel status idle"><span class="muted small">${year}. ${week}. hét</span>
           <div class="big">Nem üzemelt</div><p style="margin:0">${esc(idleNow.reason || 'Ezen a héten nem volt ellenőrzés')} – ${esc(idleNow.marked_by)}</p></div>`
      : `<div class="panel status todo"><span class="muted small">${year}. ${week}. hét</span>
           <div class="big">Még nincs kitöltve</div>
           <p style="margin:0 0 10px">A heti lap hétfőn esedékes.</p>
           <a class="btn valk" href="/valk/#/uj">Kitöltés most</a></div>`;

  $('#tabBody').innerHTML = `
    <div class="stack">
      ${status}
      <div class="facts">
        <div class="fact"><b>${unapproved}</b><span>lap jóváhagyásra vár</span></div>
        <div class="fact"><b>${openEsc}</b><span>nyitott továbbjelzés</span></div>
        <div class="fact"><b>${mine.length}</b><span>beküldött lap összesen</span></div>
      </div>
      <div>
        <h2>Legutóbbi lapok</h2>
        ${mine.length ? `<ul class="sheets">${mine.slice(0, 6).map((r) => `
          <li><a href="/valk/#/lap/${encodeURIComponent(r.id)}">
            <span class="wk">${r.iso_week}. hét</span>
            <span>${esc(r.inspector)} <span class="muted small">· ${fmtShort(r.check_date)}</span></span>
            <span class="badges">
              ${r.action_count ? `<span class="badge warn">${r.action_count} beav.</span>` : ''}
              ${r.skip_count ? `<span class="badge bad">${r.skip_count} elmaradt</span>` : ''}
              ${r.approved_by ? '<span class="badge ok">Jóváhagyva</span>' : '<span class="badge n">Nincs jóváhagyva</span>'}
            </span></a></li>`).join('')}</ul>` : '<p class="muted">Még nincs beküldött lap.</p>'}
      </div>
      <div class="row"><a class="btn long" href="/valk/">Valk heti lap – áttekintés, ütemezés, archívum</a></div>
    </div>`;
}

/* =====================================================================
   5. Projektek – a szerverről, csak belépési kóddal
   ===================================================================== */
let projCache = null;
async function loadProjects() { if (!projCache) projCache = await guarded(() => api.projects()); return projCache; }

async function renderProjects() {
  $('#app').innerHTML = `<h1>Projektek</h1><p class="sub">A fő projektkörök. Koppints egyre, és lenyílik a hozzá tartozó oldalak listája.</p><div id="projBody"><p class="muted">Betöltés…</p></div>`;
  const { projects } = await loadProjects();
  $('#projBody').innerHTML = `<div class="proj">${projects.map((g) => `
    <details class="pcard">
      <summary><b>${esc(g.name)}<span>${g.items.length} oldal</span></b>${g.about ? `<small>${esc(g.about)}</small>` : ''}</summary>
      <ul>${g.items.map((it) => `<li><a href="${esc(it.u)}" target="_blank" rel="noopener"><span>${esc(it.t)}${(it.k || []).map((k) => ` <span class="tag">${esc(k)}</span>`).join('')}</span>${it.d ? `<small>${fmtShort(it.d)}</small>` : ''}</a></li>`).join('')}</ul>
    </details>`).join('')}</div>
    <p class="muted small" style="margin-top:16px">A projektoldalak a Claude-ban vannak, és csak a te belépéseddel nyílnak meg.</p>`;
}

/* =====================================================================
   6. Beállítások
   ===================================================================== */
function renderSettings() {
  $('#app').innerHTML = `
    <h1>Beállítások</h1><p class="sub">Ezek csak ezen az eszközön érvényesek.</p>
    <div class="stack" style="max-width:560px">
      <form id="nameForm" class="panel stack">
        <h2 style="margin:0">Név a naplóban</h2>
        <label class="field"><span>Ezzel a névvel kerülnek be a bejegyzéseid</span><input type="text" id="sName" maxlength="120" value="${esc(store.get('naplo-nev') || '')}"></label>
        <div><button class="btn naplo" type="submit">Mentés</button></div>
      </form>
      <div class="panel stack">
        <h2 style="margin:0">Belépés</h2>
        <p style="margin:0">Ezen az eszközön be vagy lépve. Kilépés után a Központ, a napló és a heti lap is újra kéri a kódot.</p>
        <div><button class="btn ghost" type="button" id="logout">Kilépés ezen az eszközön</button></div>
      </div>
      <div class="panel stack">
        <h2 style="margin:0">Tablet</h2>
        <p style="margin:0">A gépkezelő tabletjén a kezdőképernyő-ikon a Központra visz. Ha ott inkább egyből a heti lap nyíljon, a tableten nyisd meg a <b>/valk/</b> címet, és onnan add hozzá újra (Chrome ⋮ → Add to Home screen).</p>
      </div>
    </div>`;
  $('#nameForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#sName').value.trim(); if (v) store.set('naplo-nev', v); else store.del('naplo-nev'); toast('Elmentve.'); });
  $('#logout').addEventListener('click', () => { store.del('km-kod'); store.del('naplo-kod'); projCache = null; renderGate(); });
}

/* =====================================================================
   7. Útvonalak: a cím # utáni része dönti el, melyik nézet látszik.
   ===================================================================== */
const VIEWS = { '#/projektek': renderProjects, '#/beallitasok': renderSettings };
function route() {
  // Régi heti-lap cím, miközben a Központ már nyitva van (lásd 0. pont)
  if (/^#\/(uj|lap\/)/.test(location.hash)) return location.replace('/valk/' + location.search + location.hash);
  if (!DEMO && !kmCode()) return renderGate();
  $('#menuBtn').hidden = false;
  const view = VIEWS[location.hash] || renderHome;
  $$('#drawer [data-view]').forEach((a) => a.setAttribute('aria-current', a.getAttribute('href') === (VIEWS[location.hash] ? location.hash : '#/') ? 'page' : 'false'));
  window.scrollTo(0, 0);
  Promise.resolve().then(view).catch(showError);
  // A „Saját oldalak” link címe is a szerverről jön (nincs beégetve a nyilvános oldalba)
  loadProjects().then((p) => { if (p.private_index) { const a = $('#privLink'); a.href = p.private_index; a.hidden = false; } }).catch(() => {});
}

const w = isoWeek(today()); $('#weekLabel').textContent = `${w.year}. ${w.week}. hét`;
$('#demo').hidden = !DEMO;
window.addEventListener('hashchange', route);
route();
</script>
</body>
