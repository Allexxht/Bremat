<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>BREMAT Központ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Archivo+Black&family=IBM+Plex+Mono:wght@500;600&display=swap">
<!-- Ikonok: Lucide (nyílt forrású ikonkészlet) -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<!--
  =====================================================================
  BREMAT Központ – a bremat-stuff kezdőlapja.
  Kinézet: a „BREMAT Központ” design system (2026. november 18.) – üzemi,
  tiszta, jól olvasható. Fejléc: bal oldalt a logó, jobb oldalt a hét és a
  menü (jobbról nyílik). Alatta a nyitó animáció, a köszönés és a szigetek
  (Munkanapló, Valk heti lap, Ötletek, Projektek), értesítés-jelvénnyel.
  Háttér: tömör, halvány pontráccsal. Alapból világos, a Beállításokban
  sötétre váltható.
  A Központ nem tárol semmit: a meglévő szerverfüggvényeket kérdezi
  (/api/naplo, /api/km, /api/kozpont).
  =====================================================================
-->
<style>
/* ---------- Színek (tokenek) – a „BREMAT Központ” design system szerint:
   üzemi, tiszta, jól olvasható. Alapból világos, a Beállításokban sötétre váltható. ---------- */
:root {
  --ground: #f2f0eb;
  --surface: #ffffff;
  --sunken: #e8e5de;
  --line: #d9d5cc;
  --line-control: #86837b;
  --text: #16181c;
  --muted: #585b61;
  --brand: #c8102e;   --on-brand: #ffffff;   --brand-soft: #f9e3e6;
  --naplo: #0a7385;   --naplo-soft: #dcf0f3;
  --valk: var(--brand); --valk-soft: var(--brand-soft);
  --idea: #925708;    --idea-soft: #f6ead4;
  --proj: #3a5793;    --proj-soft: #e2e8f4;
  --on-tone: #ffffff;
  --ok: #1d7a43;      --ok-soft: #dff0e5;
  --bad: var(--brand);
  --signal: #f2c200;  --on-signal: #16181c;
  --focus: #16181c;
  --scrim: rgba(17, 18, 20, .35);
  --shadow: 0 1px 0 rgba(22, 24, 28, .04), 0 10px 24px -16px rgba(22, 24, 28, .28);
  --shadow-overlay: 0 24px 60px -20px rgba(22, 24, 28, .4);
  --display: 'Archivo', 'Segoe UI', system-ui, sans-serif;
  --body: 'Archivo', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --logo: 'Archivo Black', 'Arial Black', sans-serif;
  --r-sm: 4px; --r-md: 8px; --r-lg: 12px;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --ground: #111214; --surface: #1a1b1e; --sunken: #26272b;
  --line: #33353a; --line-control: #74777f;
  --text: #eceae6; --muted: #a4a7ae;
  --brand: #ff5a6b; --on-brand: #1c0407; --brand-soft: #3a161b;
  --naplo: #52c6d8; --naplo-soft: #102f35;
  --idea: #f2b84b;  --idea-soft: #372a10;
  --proj: #93b2ee;  --proj-soft: #1c2840;
  --on-tone: #111214;
  --ok: #5fd18d; --ok-soft: #123222;
  --focus: #f2c200;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 12px 28px -14px rgba(0, 0, 0, .8);
  --shadow-overlay: 0 24px 60px -16px rgba(0, 0, 0, .9);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background-color: var(--ground); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  /* halvány pontrács – mint egy műszaki rajzlap */
  background-image: radial-gradient(var(--line) 1px, transparent 1.2px); background-size: 24px 24px; background-attachment: fixed; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
b, .num { font-variant-numeric: tabular-nums; }

/* ---------- Felület (a régi „üveg” helyett tömör kártya, kerettel) ---------- */
.glass { background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); }

/* ---------- Fejléc: bal oldalt a logó, jobb oldalt a hét és a menügomb ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  height: calc(60px + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) max(8px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 0; border-bottom: 1px solid var(--line); box-shadow: none;
}
.title { margin: 0; font-size: inherit; line-height: 1; }
.title a { display: flex; align-items: baseline; gap: 8px; text-decoration: none; }
.title b { font-family: var(--logo); font-weight: 400; font-size: 22px; letter-spacing: .01em; }
.title span { font-family: var(--body); font-weight: 600; font-size: 15px; color: var(--muted); }
.topbar .end { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.topbar .week { font: 500 14px/20px var(--mono); color: var(--muted); padding: 0 8px; white-space: nowrap; }

.icon-btn { width: 44px; height: 44px; border-radius: var(--r-md); border: 1px solid transparent; display: grid; place-items: center; background: transparent; color: var(--text); cursor: pointer;
  transition: background .15s; }
.icon-btn:hover { background: var(--sunken); }
.icon-btn:active { transform: translateY(1px); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }

/* ---------- Menü-fiók: jobbról nyílik (telefonon hüvelykujjal elérhető) ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s var(--ease); }
.drawer {
  position: fixed; z-index: 31;
  top: calc(8px + env(safe-area-inset-top, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  right: max(8px, env(safe-area-inset-right, 0px)); width: min(300px, calc(100vw - 16px));
  border-radius: var(--r-lg); padding: 12px; box-shadow: var(--shadow-overlay);
  display: flex; flex-direction: column; gap: 4px; overflow-y: auto;
  transform: translateX(calc(100% + 24px)); visibility: hidden;
  transition: transform .3s var(--ease), visibility 0s linear .3s;
}
body.menu-open .scrim { opacity: 1; pointer-events: auto; }
body.menu-open .drawer { transform: none; visibility: visible; transition: transform .3s var(--ease), visibility 0s; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 8px 12px; }
.drawer-head b { font-family: var(--display); font-weight: 700; font-size: 17px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border-radius: var(--r-md); text-decoration: none; font-weight: 600; transition: background .15s; }
.nav a svg { width: 20px; height: 20px; stroke-width: 2; color: var(--muted); flex: none; }
.nav a:hover { background: var(--sunken); }
.nav a[aria-current="page"] { background: var(--sunken); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 2px; background: var(--brand); }
.nav a[aria-current="page"] svg { color: var(--brand); }
.drawer-foot { margin-top: auto; padding: 12px 12px 4px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- Tartalom ---------- */
main {
  position: relative; z-index: 1;
  padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.page { width: min(960px, 100%); display: flex; flex-direction: column; gap: 16px; }
.greet { animation: rise .4s var(--ease) both; margin-bottom: 8px; }
.greet h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; letter-spacing: -.02em; text-wrap: balance; }
.greet p { margin: 4px 0 0; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }

/* ---------- Nyitó animáció: konténer + kamion (videó), utána a kígyós BREMAT logó ---------- */
.hero { position: relative; width: min(100%, 760px); aspect-ratio: 3 / 1; margin: -8px auto -4px; cursor: pointer; }
.hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 1; transition: opacity .5s var(--ease); }
.hero svg { position: absolute; inset: 8% 9%; width: 82%; height: 84%; overflow: visible; color: var(--text); pointer-events: none; }
.hero .letter { transform-box: fill-box; transform-origin: 50% 70%; }
.hero .logo { transform-box: view-box; transform-origin: 0 0; }
.hero.static { cursor: pointer; }

/* ---------- Szigetek ---------- */
.islands { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: 16px; }
.island {
  --tone: var(--naplo); --tone-soft: var(--naplo-soft); --tone-ink: var(--on-tone);
  position: relative; display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: var(--r-lg); text-decoration: none;
  animation: rise .45s var(--ease) both; animation-delay: calc(var(--i) * 60ms + 60ms);
  transition: transform .2s var(--ease), border-color .2s;
}
.island::after { content: ""; position: absolute; left: 24px; right: 24px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--tone); }
.island.valk { --tone: var(--valk); --tone-soft: var(--valk-soft); --tone-ink: var(--on-brand); }
.island.idea { --tone: var(--idea); --tone-soft: var(--idea-soft); }
.island.proj { --tone: var(--proj); --tone-soft: var(--proj-soft); }
.island:hover { transform: translateY(-2px); border-color: var(--tone); }
.island:active { transform: translateY(0); }
.island .head { display: flex; align-items: center; gap: 12px; }
.island .ico { width: 44px; height: 44px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); flex: none; }
.island .ico svg { width: 22px; height: 22px; stroke-width: 2; }
.island h2 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.25; }
.island .sub { color: var(--muted); font-size: 14px; font-weight: 500; }
.island .go { margin-left: auto; color: var(--muted); transition: transform .2s var(--ease), color .2s; }
.island .go svg { width: 20px; height: 20px; }
.island:hover .go { transform: translateX(3px); color: var(--tone); }
.island .stat { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.island .stat b { font: 800 40px/40px var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.island .stat span { font-size: 14px; font-weight: 500; color: var(--muted); }
.island ul { list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; font-size: 14px; font-weight: 500; line-height: 20px; }
.island li { display: flex; align-items: flex-start; gap: 8px; }
.island li svg { width: 16px; height: 16px; color: var(--muted); flex: none; stroke-width: 2; margin-top: 2px; }
.island li.alert svg { color: var(--tone); }
.island li.good svg { color: var(--ok); }
.island li b { font-weight: 700; }
.island .dim { color: var(--muted); }
.island .foot { font-size: 13px; font-weight: 500; color: var(--muted); }
.island .foot:empty { display: none; }
.skeleton { height: 14px; border-radius: var(--r-sm); background: var(--sunken); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .45; } }

.progress { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; color: var(--muted); }
.progress .track { flex: 1; height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.progress .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--tone); transition: width 1s var(--ease); }
.progress b { color: var(--text); font-weight: 700; }

.badge { position: absolute; top: -8px; right: -8px; z-index: 2; min-width: 28px; height: 28px; padding: 0 8px; border-radius: 999px;
  display: grid; place-items: center; font: 700 14px/1 var(--body); font-variant-numeric: tabular-nums;
  background: var(--tone); color: var(--tone-ink); box-shadow: 0 0 0 3px var(--ground);
  animation: pop .35s var(--ease) both; }
@keyframes pop { from { transform: scale(0); } }

/* ---------- Projektek, beállítások, belépés ---------- */
.card { border-radius: var(--r-lg); padding: 24px; animation: rise .4s var(--ease) both; }
.card h2 { margin: 0 0 8px; font-family: var(--display); font-weight: 700; font-size: 19px; }
.muted { color: var(--muted); }
div.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; align-items: start; }
.pcard { border-radius: var(--r-lg); overflow: hidden; animation: rise .4s var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
.pcard > summary { list-style: none; cursor: pointer; padding: 16px; display: flex; gap: 12px; align-items: center; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard .ico { width: 40px; height: 40px; border-radius: var(--r-md); display: grid; place-items: center; background: var(--proj-soft); color: var(--proj); flex: none; }
.pcard .ico svg { width: 20px; height: 20px; }
.pcard b { font-family: var(--display); font-weight: 700; font-size: 17px; display: block; }
.pcard small { color: var(--muted); font-size: 13px; }
.pcard .chev { margin-left: auto; color: var(--muted); transition: transform .2s var(--ease); flex: none; }
.pcard[open] .chev { transform: rotate(90deg); }
.pcard ul { list-style: none; margin: 0; padding: 4px 8px 8px; border-top: 1px solid var(--line); }
.pcard li a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 8px; border-radius: var(--r-md); text-decoration: none; font-weight: 500; }
.pcard li a:hover { background: var(--sunken); }
.pcard li small { white-space: nowrap; font-family: var(--mono); }
.chip { display: inline-block; padding: 0 6px; margin-left: 4px; border-radius: var(--r-sm); font-size: 11.5px; font-weight: 700; background: var(--sunken); color: var(--muted); }
.search { width: 100%; min-height: 48px; padding: 0 16px 0 44px; border-radius: var(--r-md); border: 1px solid var(--line-control); background: var(--surface); font-size: 16px; }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 4px; }
.field span { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.field input { min-height: 44px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line-control); background: var(--surface); font-size: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: var(--r-md); border: 1px solid var(--line-control);
  background: var(--surface); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; transition: background .15s; }
.btn:hover { background: var(--sunken); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { filter: brightness(.92); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 600; min-height: 44px; }
.switch input { width: 20px; height: 20px; accent-color: var(--brand); }
.err { color: var(--bad); font-weight: 600; margin: 0; }
.gate { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: none;
  padding: 12px 16px; border-radius: var(--r-md); background: var(--text); color: var(--surface); font-weight: 600; box-shadow: var(--shadow-overlay); }
.demo-bar { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: 12px; background: var(--signal); color: var(--on-signal); font-weight: 700; font-size: 13px; padding: 6px 12px; border-radius: var(--r-sm);
  background-image: repeating-linear-gradient(-45deg, transparent 0 10px, rgba(0, 0, 0, .08) 10px 20px); }

/* ---------- Ötletek ---------- */
.idea-new { display: flex; flex-direction: column; gap: 12px; }
.idea-new textarea, .idea-row textarea { width: 100%; min-height: 88px; padding: 10px 12px; border-radius: var(--r-md); border: 1px solid var(--line-control); background: var(--surface); resize: vertical; line-height: 1.45; font-size: 16px; }
.idea-row textarea { min-height: 64px; }
.idea-new .row { justify-content: space-between; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { min-height: 38px; padding: 0 12px; border-radius: var(--r-md); border: 1px solid var(--line-control); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.filters button small { color: var(--muted); font-family: var(--mono); font-size: 13px; }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
.filters button[aria-pressed="true"] small { color: inherit; opacity: .75; }
.ideas { display: flex; flex-direction: column; gap: 8px; }
.idea-row { border-radius: var(--r-lg); padding: 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; animation: rise .35s var(--ease) both; animation-delay: calc(var(--i) * 30ms); }
.idea-row .tick { width: 28px; height: 28px; margin-top: 1px; border-radius: var(--r-sm); border: 2px solid var(--line-control); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--on-tone); padding: 0; }
.idea-row .tick svg { width: 18px; height: 18px; stroke-width: 3; opacity: 0; }
.idea-row.kesz .tick { background: var(--ok); border-color: var(--ok); }
.idea-row.kesz .tick svg { opacity: 1; }
.idea-row.elvetve .tick { border-style: dashed; cursor: default; }
.idea-row .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 600; }
.idea-row.kesz .txt { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.idea-row.elvetve .txt { text-decoration: line-through; color: var(--muted); }
.idea-row .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.idea-row .why { grid-column: 2; font-size: 14px; padding: 8px 12px; border-radius: var(--r-md); background: var(--sunken); white-space: pre-wrap; overflow-wrap: anywhere; }
.idea-row .why b { color: var(--text); }
.idea-row .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.idea-row .acts button { min-height: 36px; padding: 0 10px; border-radius: var(--r-md); border: 1px solid transparent; background: transparent; font-weight: 600; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.idea-row .acts button:hover { background: var(--sunken); }
.idea-row .acts button svg { width: 16px; height: 16px; }
.idea-row .acts .danger { color: var(--bad); }
.idea-row .edit { grid-column: 2; display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: var(--r-sm); font-size: 12px; font-weight: 700; background: var(--sunken); color: var(--muted); }
.pill.folyamatban { background: var(--idea-soft); color: var(--idea); }
.pill.kesz { background: var(--ok-soft); color: var(--ok); }
.pill.elvetve { background: var(--brand-soft); color: var(--bad); }
.idea-row.folyamatban { border-color: var(--idea); }
.kbd-hint { font-size: 12.5px; color: var(--muted); }
@media (max-width: 480px) { .kbd-hint { display: none; } }

@media (prefers-reduced-motion: reduce) {
  .island, .badge, .greet, .card, .pcard, .skeleton, .idea-row { animation: none; }
  .drawer, .scrim, .island, .island .go, .progress .track i, .pcard .chev { transition: none; }
}
@media (max-width: 370px) { .title span { display: none; } }
</style>
</head>
<body>
<div id="demo" class="demo-bar" hidden>DEMÓ – mintaadatok</div>

<header class="topbar glass">
  <h1 class="title"><a href="#/"><b>BREMAT</b> <span>Központ</span></a></h1>
  <div class="end">
    <span class="week" id="topWeek"></span>
    <button class="icon-btn" id="menuBtn" type="button" aria-label="Menü megnyitása" aria-expanded="false" aria-controls="drawer"><i data-lucide="menu"></i></button>
  </div>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer glass" id="drawer" aria-label="Főmenü">
  <div class="drawer-head">
    <b>Menü</b>
    <button class="icon-btn" id="menuClose" type="button" aria-label="Menü bezárása"><i data-lucide="x"></i></button>

<script type="module">
/* =====================================================================

};

{

/* =====================================================================

   POST kérés JSON-nal, benne a művelet (action) és a belépési kód.

class AccessError extends Error {}
async function post(url, action, payload, code) {
  let res;
  try { res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, code, ...payload }), cache: 'no-store' }); }
  catch { throw new Error('Nincs kapcsolat a szerverrel.'); }
  let body = null; try { body = await res.json(); } catch { /* nem JSON */ }
  if (res.status === 401) throw new AccessError(body?.error || 'Hibás hozzáférési kód');
  if (!res.ok) throw new Error(body?.error || `Szerverhiba (${res.status})`);
  return body?.data;
}
const kmCode = () => store.get('km-kod') || '';
const naploCode = () => store.get('naplo-kod') || store.get('km-kod') || '';
const live = {

  idle: () => post('/api/km', 'idle_list', {}, kmCode()),
  week: (from, to) => post('/api/naplo', 'range', { from, to }, naploCode()),
  todo: () => post('/api/naplo', 'todo_status', {}, naploCode()),
  ideas: () => post('/api/kozpont', 'idea_list', {}, kmCode()),
  ideaAdd: (text) => post('/api/kozpont', 'idea_add', { text }, kmCode()),
  ideaUpdate: (id, patch) => post('/api/kozpont', 'idea_update', { id, ...patch }, kmCode()),

};

/* ---------- Dátum (budapesti idő) ---------- */
const ymdFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => ymdFmt.format(new Date());
const toDate = (ymd) => new Date(ymd + 'T00:00:00Z');
const addDays = (ymd, n) => { const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = (ymd) => addDays(ymd, -((toDate(ymd).getUTCDay() + 6) % 7));
function isoWeek(ymd) {
  const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const year = d.getUTCFullYear(), jan4 = new Date(Date.UTC(year, 0, 4));
  return { year, week: 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7) };
}
const huLong = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'long', day: 'numeric', weekday: 'long' });
const huShort = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const hhmm = (iso) => new Date(iso).toLocaleTimeString('hu-HU', { timeZone: 'Europe/Budapest', hour: '2-digit', minute: '2-digit' });
function fmtDur(ms) { const m = Math.floor(ms / 60000); if (m < 1) return '<1 p'; const h = Math.floor(m / 60); return h ? `${h} ó ${m % 60} p` : `${m} p`; }

function demoApi() {
  const m = mondayOf(today()), w = isoWeek(today());
  const mk = (d, who, a, s, appr, escl) => ({ id: 'demo-' + d, check_date: d, ...(({ year, week }) => ({ iso_year: year, iso_week: week }))(isoWeek(d)), robot: ROBOT, inspector: who, action_count: a, skip_count: s, approved_by: appr ? 'Nagy Béla' : null, escalate: !!escl });
  const d = (v) => new Promise((r) => setTimeout(() => r(structuredClone(v)), 250));
  const ago = (days) => new Date(Date.now() - days * 86400000).toISOString();
  const idea = (id, text, status, days, reason = null) => ({ id, text, status, reason, created_at: ago(days), updated_at: ago(days), done_at: status === 'kesz' || status === 'elvetve' ? ago(days / 2) : null });
  let ideas = [
    idea('i1', 'Gyorscserélő adapter a 2-es cellához', 'folyamatban', 2),
    idea('i2', 'QR-kód a jigekre, ami a Valk fájlokra visz', 'nyitott', 1),
    idea('i3', 'Heti lap emlékeztető péntek délelőtt', 'nyitott', 6),
    idea('i4', 'Közös mappa a hegesztési programoknak', 'kesz', 12, 'A Valk fájlok alatt megvan.'),
    idea('i5', 'Tablet a cellák mellé', 'elvetve', 20, 'Túl drága, és a por miatt nem bírná.'),
  ];
  return {
    ideas: () => d(ideas),
    ideaAdd: (text) => { const t = String(text || '').trim(); if (!t) return Promise.reject(new Error('Írd be az ötletet')); const r = { ...idea('d' + Date.now(), t, 'nyitott', 0) }; ideas = [r, ...ideas]; return d(r); },
    ideaUpdate: (id, patch) => {
      const cur = ideas.find((x) => x.id === id); if (!cur) return Promise.reject(new Error('Ismeretlen ötlet'));
      const ts = new Date().toISOString();
      if (patch.text !== undefined) cur.text = String(patch.text).trim() || cur.text;
      if (patch.status !== undefined) { cur.done_at = patch.status === 'kesz' || patch.status === 'elvetve' ? (cur.status === patch.status ? cur.done_at : ts) : null; cur.status = patch.status; }
      if (patch.reason !== undefined) cur.reason = String(patch.reason ?? '').trim() || null;
      cur.updated_at = ts; return d(cur);
    },
    ideaDelete: (id) => { ideas = ideas.filter((x) => x.id !== id); return d(true); },
    ping: () => d(true),
    projects: () => d({ private_index: '#', projects: [
      { key: 'tokmany', name: 'Tokmány vagy lemez', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Lemez vagy tokmány', u: '#', d: '2026-11-04' }, { t: 'Vastag lemez 3D', u: '#', d: '2026-10-29', k: ['3D'] }] },

    checks: () => d([mk(addDays(m, -7), 'Tóth Ádám', 1, 1, false, true), mk(addDays(m, -14), 'Kovács Gábor', 2, 0, false), mk(addDays(m, -21), 'Tóth Ádám', 0, 0, true)]),
    idle: () => d([]),
    week: () => d([1, 2, 3, 4, 5].map((i) => ({ id: String(i), date: m, text: i < 6 ? `Kész: minta ${i}` : 'x' }))),
    todo: () => d({ open: 5, starred: 3, doing: [{ text: '3100.0610 új kialakítás', spent_ms: 3600000, started_at: Date.now() - 720000 }], updated_at: new Date(Date.now() - 300000).toISOString() }),
  };
}
const api = DEMO ? demoApi() : live;

function fillIsland(el, d) {
  el.querySelector('ul').innerHTML = d.items.map((it) =>
    `<li class="${it.alert ? 'alert' : it.good ? 'good' : ''}"><i data-lucide="${it.icon}"></i><span>${it.html}</span></li>`).join('');
  const n = d.items.filter((it) => it.alert).reduce((s, it) => s + (it.n ?? 1), 0);
  const b = el.querySelector('.badge'); b.hidden = n === 0; b.textContent = n > 9 ? '9+' : n; b.setAttribute('aria-label', `${n} értesítés`);
  const bar = el.querySelector('.progress');
  if (d.progress) {
    const { done, left } = d.progress; bar.hidden = false;
    bar.querySelector('span').innerHTML = `<b>${done}</b> kész · <b>${left}</b> hátra`;
    requestAnimationFrame(() => { bar.querySelector('i').style.width = Math.round(done / Math.max(1, done + left) * 100) + '%'; });
  }
  const stat = el.querySelector('.stat');
  if (d.stat) { stat.hidden = false; stat.querySelector('b').textContent = d.stat.n; stat.querySelector('span').textContent = d.stat.t; }
  el.querySelector('.foot').textContent = d.foot || '';
  icons();
}

// --- Nyitó animáció ---
// A napi első megnyitáskor (utána legfeljebb 2,5 óránként) lemegy a videó: a konténer felépül,
// felkerül a kamionra, a kamion elhúz – és mögötte a kígyós vonal kirajzolja a BREMAT logót.
// Máskor csak a kész logó látszik. Koppintásra átugorható.
const INTRO_SRC = '/kozpont/intro.webm', LOGO_AT = 8.5;   // a videóban ekkor indul el a kamion
const LOGO_FROM = { x: 0.5, y: 0.47, w: 0.34 };   // kicsiben középen, a plató mögött bújik elő, onnan nő fel a helyére
const LOGO_FS = 236, LOGO_Y = 238, LOGO_X0 = 64;
const LOGO_PATHS = {   // a betűk vázvonala a betű „tinta-dobozában” (0–1): ezen fut a kígyó
  B: 'M.2,1 L.2,0 L.62,0 Q.94,0 .94,.25 Q.94,.48 .62,.48 L.2,.48 L.66,.48 Q1,.5 1,.75 Q1,1 .66,1 L.2,1',
  R: 'M.2,1 L.2,0 L.62,0 Q.95,0 .95,.27 Q.95,.52 .62,.52 L.2,.52 L.55,.52 L.95,1',
  E: 'M.95,0 L.17,0 L.17,1 L.95,1 M.17,.5 L.85,.5',
  M: 'M.12,1 L.12,0 L.5,.78 L.88,0 L.88,1',
  A: 'M.03,1 L.5,0 L.97,1 M.25,.7 L.75,.7',
  T: 'M0,.12 L1,.12 M.5,.12 L.5,1',
};
function buildLogo(svg) {
  const NS = 'http://www.w3.org/2000/svg', FONT = 'Archivo Black, Arial Black, sans-serif';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  svg.setAttribute('viewBox', '0 -20 1280 430');
  const defs = el('defs', {}, svg);
  const grad = el('linearGradient', { id: 'lgGlint', x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  [[0, 0], [0.42, 0], [0.5, 0.85], [0.58, 0], [1, 0]].forEach(([o, a]) => el('stop', { offset: o, 'stop-color': '#fff', 'stop-opacity': a }, grad));
  const logo = el('g', { class: 'logo' }, svg);
  const meas = el('text', { x: LOGO_X0, y: LOGO_Y, 'font-family': FONT, 'font-size': LOGO_FS, opacity: 0 }, svg);
  meas.textContent = 'BREMAT';
  const c = document.createElement('canvas').getContext('2d'); c.font = `${LOGO_FS}px "Archivo Black"`;
  const cap = c.measureText('B').actualBoundingBoxAscent;
  let inkL = Infinity, inkR = -Infinity;
  const reveals = [...'BREMAT'].map((ch, i) => {
    const x = meas.getStartPositionOfChar(i).x, ink = c.measureText(ch);
    const lx = x - ink.actualBoundingBoxLeft, lw = ink.actualBoundingBoxRight + ink.actualBoundingBoxLeft;
    inkL = Math.min(inkL, lx); inkR = Math.max(inkR, lx + lw);
    const d = LOGO_PATHS[ch].replace(/(-?[\d.]+),(-?[\d.]+)/g, (_, u, v) => `${(lx + u * lw).toFixed(1)},${(LOGO_Y - cap + v * cap).toFixed(1)}`);
    const mask = el('mask', { id: 'lgM' + i, maskUnits: 'userSpaceOnUse', x: -100, y: -100, width: 1500, height: 600 }, defs);
    const reveal = el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': lw * 0.62, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, mask);
    el('text', { x, y: LOGO_Y, 'font-family': FONT, 'font-size': LOGO_FS, fill: 'currentColor', mask: `url(#lgM${i})` }, logo).textContent = ch;
    return reveal;
  });
  const bb = meas.getBBox();
  meas.remove();
  const clip = el('clipPath', { id: 'lgClip' }, defs);
  el('text', { x: LOGO_X0, y: LOGO_Y, 'font-family': FONT, 'font-size': LOGO_FS }, clip).textContent = 'BREMAT';
  const glint = el('rect', { x: -420, y: 40, width: 420, height: 320, fill: 'url(#lgGlint)', opacity: 0 }, el('g', { 'clip-path': 'url(#lgClip)' }, logo));
  // a keret az eredeti logó arányai szerint (h = betűmagasság): a felső vonal épp a betűk fölött,
  // a jobb oldal végig lemegy, az alsó vonal ferdén a bal alsó sarokba, onnan a bal oldal vissza fel
  const h = cap, top = LOGO_Y - cap - 0.17 * h, n = (v) => v.toFixed(1);
  const FRAME = `M${n(inkL)},${n(top)} L${n(inkR + 0.09 * h)},${n(top)} L${n(inkR + 0.12 * h)},${n(LOGO_Y + 0.19 * h)} L${n(inkL + 0.58 * h)},${n(LOGO_Y + 0.77 * h)} Z`;
  const frame = el('path', { d: FRAME, fill: 'none', stroke: 'currentColor', 'stroke-width': n(0.115 * h), 'stroke-linejoin': 'miter', pathLength: 1, 'stroke-dasharray': '1 2', 'stroke-dashoffset': 1 }, svg);
  return () => {   // a lejátszás; visszaadja az animációkat (finish() = azonnal kész állapot)
    const A = (n, kf, delay, dur, easing = 'cubic-bezier(.65,0,.35,1)') => n.animate(kf, { delay: delay * 1000, duration: dur * 1000, easing, fill: 'both' });
    const per = 0.42, gap = 0.15, end = (reveals.length - 1) * gap + per, out = 'cubic-bezier(.2,.9,.2,1)';
    // kezdetben kicsi, a plató mögött (a kamion takarja); ahogy előbukkant, felnő a helyére
    const r = svg.parentNode.getBoundingClientRect(), pt = svg.createSVGPoint();
    pt.x = r.left + LOGO_FROM.x * r.width; pt.y = r.top + LOGO_FROM.y * r.height;
    const m = svg.getScreenCTM(), p = m ? pt.matrixTransform(m.inverse()) : { x: 640, y: 200 };
    const k = m ? (LOGO_FROM.w * r.width) / (bb.width * m.a) : 0.45;
    const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
    const small = `translate(${(p.x - k * cx).toFixed(1)}px, ${(p.y - k * cy).toFixed(1)}px) scale(${k.toFixed(3)})`;
    const list = [
      ...reveals.map((r, i) => A(r, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], i * gap, per)),
      A(logo, [{ transform: small }, { transform: 'translate(0px, 0px) scale(1)' }], end + 0.15, 1.0, 'cubic-bezier(.45,0,.15,1)'),
      A(frame, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], end + 0.95, 0.95, 'cubic-bezier(.7,0,.25,1)'),
      A(glint, [{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(1800px)', opacity: 1 }], end + 1.85, 0.9, 'cubic-bezier(.5,0,.3,1)'),
    ];
    return list;
  };
}

function introDue() {
  const last = Number(store.get('kozpont-intro')) || 0, now = Date.now();
  const day = (ms) => ymdFmt.format(new Date(ms));
  return !last || day(last) !== day(now) || now - last > 2.5 * 3600e3;
}
// A Safari nem tud átlátszó WebM-et (fekete háttér lenne) – ott a videó kimarad, csak a logó rajzolódik ki.
const alphaVideo = () => !/^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent) && !!document.createElement('video').canPlayType('video/webm; codecs="vp9"');
async function intro(hero, force = false) {
  if (!hero) return;
  await document.fonts.load(`${LOGO_FS}px "Archivo Black"`).catch(() => {});
  if (!hero.isConnected) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('aria-hidden', 'true');
  hero.appendChild(svg);
  const play = buildLogo(svg);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // kész állapot: a logó áll, és egy koppintás újraindítja az introt
  let done = false, anims = null, raf = 0, video = null;
  const finish = () => {
    if (done) return; done = true;
    hero.removeEventListener('click', skip);
    hero.classList.add('static');
    hero.addEventListener('click', () => { hero.replaceChildren(); hero.classList.remove('static'); intro(hero, true); }, { once: true });
  };
  if (!force && (calm || !introDue())) { play().forEach((a) => a.finish()); return finish(); }
  store.set('kozpont-intro', String(Date.now()));
  // a logó a kamion indulásakor kezd kirajzolódni; ha végigért, jön a kész állapot
  const startLogo = () => {
    if (anims) return;
    anims = play();
    Promise.all(anims.map((a) => a.finished)).then(finish, () => {});
  };
  // lejátszás közben egy koppintás átugorja a végére
  function skip() { cancelAnimationFrame(raf); if (video) { video.pause(); video.style.opacity = 0; } startLogo(); anims.forEach((a) => a.finish()); finish(); }
  hero.addEventListener('click', skip);
  if (!alphaVideo()) return startLogo();   // videó nélkül (Safari): csak a logó rajzolódik ki
  video = document.createElement('video');
  Object.assign(video, { muted: true, playsInline: true, preload: 'auto', src: INTRO_SRC });
  video.setAttribute('aria-hidden', 'true');
  hero.appendChild(video);   // a videó a logó fölött: a kamion eltakarja, mögötte bukkan elő
  const watch = () => { if (!hero.isConnected) return video.pause(); if (video.currentTime >= LOGO_AT) return startLogo(); raf = requestAnimationFrame(watch); };
  video.addEventListener('error', startLogo, { once: true });
  video.addEventListener('ended', startLogo, { once: true });
  video.play().then(() => { raf = requestAnimationFrame(watch); }, startLogo);
}

// --- Munkanapló sziget: a heti „Kész:” bejegyzések + a Teendőim állapota ---
async function loadNaplo() {
  const el = $('#isNaplo'); const t = today(), mon = mondayOf(t);
  let rows, st;
  try { [rows, st] = await Promise.all([api.week(mon, addDays(mon, 6)), api.todo()]); }
  catch (e) {
    fillIsland(el, { items: [{ icon: e instanceof AccessError ? 'lock' : 'wifi-off', html: e instanceof AccessError ? 'A napló külön kóddal védett – koppints a belépéshez.' : esc(e.message) }] });
    return;
  }
  const done = rows.filter((r) => /^Kész:/.test(r.text)).length;
  const items = [];
  if (st) {
    items.push({ icon: 'list-todo', html: `Hátralévő feladatok: <b>${st.open}</b>` });
    (st.doing || []).slice(0, 2).forEach((x) => items.push({ icon: 'timer', html: `Folyamatban: ${esc(x.text)} <span class="dim" data-run="${x.started_at || ''}" data-spent="${x.spent_ms}">· ${fmtDur(x.spent_ms + (x.started_at ? Date.now() - x.started_at : 0))}</span>` }));
    if ((st.doing || []).length > 2) items.push({ icon: 'timer', html: `<span class="dim">+${st.doing.length - 2} további fut</span>` });
    if (st.starred) items.push({ icon: 'star', html: `Fontos és még nincs kész: <b>${st.starred}</b>`, alert: true, n: st.starred });
  } else {
    items.push({ icon: 'info', html: '<span class="dim">A Teendőim még nem küldött állapotot. (Teendőim → menü → Munkanapló)</span>' });
  }
  fillIsland(el, { items, stat: { n: done, t: 'kész feladat ezen a héten' }, progress: st ? { done, left: st.open + (st.doing || []).length } : null, foot: st ? `Teendőim: frissítve ${hhmm(st.updated_at)}` : '' });
  // A futó teendő ideje percenként frissül
  clearInterval(tickTimer);
  tickTimer = setInterval(() => $$('[data-run]').forEach((s) => { if (s.dataset.run) s.textContent = '· ' + fmtDur(Number(s.dataset.spent) + Date.now() - Number(s.dataset.run)); }), 30000);
}

// --- Valk sziget: e heti lap, jóváhagyásra vár, nyitott továbbjelzés ---
async function loadValk() {
  const el = $('#isValk');
  const [checks, idle] = await guarded(() => Promise.all([api.checks(), api.idle()]));
  const { year, week } = isoWeek(today());
  const mine = checks.filter((r) => r.robot === ROBOT);
  const thisWeek = mine.find((r) => r.iso_year === year && r.iso_week === week);
  const idleNow = idle.find((x) => x.robot === ROBOT && x.iso_year === year && x.iso_week === week);
  const unapproved = mine.filter((r) => !r.approved_by).length;
  const openEsc = mine.filter((r) => r.escalate && !r.approved_by).length;
  const items = [];
  if (thisWeek) items.push({ icon: 'circle-check-big', html: `A ${week}. heti lap kitöltve – ${esc(thisWeek.inspector)}, ${huShort.format(toDate(thisWeek.check_date))}`, good: true });
  else if (idleNow) items.push({ icon: 'pause-circle', html: `A ${week}. héten nem üzemelt` });
  else items.push({ icon: 'circle-alert', html: `A <b>${week}.</b> heti lap még nincs kitöltve`, alert: true });
  items.push(unapproved ? { icon: 'stamp', html: `<b>${unapproved}</b> lap jóváhagyásra vár`, alert: true, n: unapproved } : { icon: 'stamp', html: 'Minden lap jóváhagyva', good: true });
  if (openEsc) items.push({ icon: 'triangle-alert', html: `<b>${openEsc}</b> nyitott továbbjelzés`, alert: true, n: openEsc });
  fillIsland(el, { items, stat: { n: `${week}.`, t: thisWeek ? 'hét · kitöltve' : idleNow ? 'hét · nem üzemelt' : 'hét · még nincs kitöltve' }, foot: `${mine.length} beküldött lap összesen` });
  if (!thisWeek && !idleNow) el.href = '/valk/#/uj';   // ha még nincs kész, egyből a kitöltésre visz
}

// --- Ötletek sziget: ami folyamatban van, a legújabb nyitottak, és hány valósult meg ---
async function loadIdeasIsland() {
  const el = $('#isIdeas');
  let rows;
  try { rows = await api.ideas(); }
  catch (e) { fillIsland(el, { items: [{ icon: 'wifi-off', html: esc(e.message) }] }); return; }
  const by = (st) => rows.filter((r) => r.status === st);
  const doing = by('folyamatban'), open = by('nyitott'), done = by('kesz').length, dropped = by('elvetve').length;
  const items = [];
  doing.slice(0, 2).forEach((r) => items.push({ icon: 'timer', html: `Folyamatban: ${esc(short(r.text))}` }));
  open.slice(0, doing.length ? 2 : 3).forEach((r) => items.push({ icon: 'lightbulb', html: esc(short(r.text)) }));
  const more = doing.length + open.length - items.length;
  if (more > 0) items.push({ icon: 'more-horizontal', html: `<span class="dim">+${more} további ötlet</span>` });
  if (!rows.length) items.push({ icon: 'pencil-line', html: '<span class="dim">Még nincs ötlet. Koppints ide, és írd le az elsőt.</span>' });
  fillIsland(el, { items, stat: rows.length ? { n: open.length + doing.length, t: doing.length ? `nyitott ötlet · ${doing.length} folyamatban` : 'nyitott ötlet' } : null, progress: rows.length ? { done, left: doing.length + open.length } : null, foot: rows.length ? `Megvalósult: ${done} · Nem lett belőle: ${dropped}` : '' });
  const s = el.querySelector('.progress span'); if (s && rows.length) s.innerHTML = `<b>${done}</b> megvalósult · <b>${doing.length + open.length}</b> nyitott`;
}
const short = (t, n = 70) => { const s = String(t).split('\n')[0]; return s.length > n ? s.slice(0, n - 1) + '…' : s; };

// --- Projektek sziget: projektenként hány oldal, és a legutóbb frissült ---
async function loadProjIsland() {
  const el = $('#isProj');
  let p;
  try { p = await loadProjects(); }
  catch (e) { fillIsland(el, { items: [{ icon: 'wifi-off', html: esc(e.message) }] }); return; }
  const all = p.projects.flatMap((g) => g.items.map((it) => ({ ...it, g: g.name })));
  const items = p.projects.slice(0, 3).map((g) => ({ icon: PICONS[g.key] || 'folder', html: `${esc(g.name)} <span class="dim">· ${g.items.length} oldal</span>` }));
  if (p.projects.length > 3) items.push({ icon: 'more-horizontal', html: `<span class="dim">+${p.projects.length - 3} további projekt</span>` });
  const last = all.filter((x) => x.d).sort((a, b) => b.d.localeCompare(a.d))[0];

  fillIsland(el, { items, stat: { n: all.length, t: `oldal · ${p.projects.length} projektben` } });
}

/* =====================================================================
   5b. Ötletek: felírni, kipipálni, „nem lesz belőle” + miért
   ===================================================================== */
const ISTATE = {
  nyitott: { t: 'Nyitott', icon: 'circle' },
  folyamatban: { t: 'Folyamatban', icon: 'timer' },
  kesz: { t: 'Megvalósult', icon: 'circle-check-big' },
  elvetve: { t: 'Nem lett belőle', icon: 'circle-x' },
};
const IORDER = { folyamatban: 0, nyitott: 1, kesz: 2, elvetve: 3 };
let ideaFilter = 'mind';
async function renderIdeas() {
  $('#app').innerHTML = `<div class="page" style="max-width:820px">
    <div class="greet"><h1>Ötletek</h1><p>Írd fel, ami eszedbe jut. Pipáld ki, ha megvalósult; ha nem lesz belőle, írd mellé, miért.</p></div>
    <form class="card glass idea-new" id="ideaForm">
      <textarea id="iText" maxlength="2000" placeholder="Új ötlet… (pl. gyorscserélő adapter a 2-es cellához)" aria-label="Új ötlet"></textarea>
      <div class="row"><span class="kbd-hint">Ctrl + Enter: hozzáadás</span><button class="btn primary" type="submit"><i data-lucide="plus"></i>Hozzáadás</button></div>
    </form>
    <div class="filters" id="iFilters" role="toolbar" aria-label="Szűrés"></div>
    <div class="ideas" id="iList"><div class="card glass"><div class="skeleton" style="width:60%"></div></div></div></div>`;
  icons();
  let rows = await guarded(() => api.ideas());
  let editing = null;   // { id, mode: 'edit' | 'reject' }
  const fmt = (iso) => huShort.format(new Date(iso));
  const draw = () => {
    const count = (st) => rows.filter((r) => r.status === st).length;
    const F = [['mind', 'Mind', rows.length], ['nyitott', 'Nyitott', count('nyitott')], ['folyamatban', 'Folyamatban', count('folyamatban')], ['kesz', 'Megvalósult', count('kesz')], ['elvetve', 'Nem lett belőle', count('elvetve')]];
    $('#iFilters').innerHTML = F.map(([k, t, n]) => `<button type="button" data-f="${k}" aria-pressed="${ideaFilter === k}">${t} <small>${n}</small></button>`).join('');
    const list = rows.filter((r) => ideaFilter === 'mind' || r.status === ideaFilter)
      .sort((a, b) => (IORDER[a.status] - IORDER[b.status]) || (b.created_at || '').localeCompare(a.created_at || ''));
    $('#iList').innerHTML = list.length ? list.map((r, i) => {
      const st = ISTATE[r.status] || ISTATE.nyitott, ed = editing?.id === r.id ? editing.mode : null;
      const when = r.done_at ? `${r.status === 'kesz' ? 'megvalósult' : 'lezárva'} ${fmt(r.done_at)}` : '';
      const why = r.reason ? `<div class="why"><b>${r.status === 'elvetve' ? 'Miért nem:' : 'Megjegyzés:'}</b> ${esc(r.reason)}</div>` : '';
      const acts = r.status === 'elvetve'
        ? `<button type="button" data-a="reopen"><i data-lucide="undo-2"></i>Mégis lehet</button><button type="button" data-a="edit"><i data-lucide="pencil"></i>Szerkesztés</button>`
        : `${r.status === 'kesz' ? '' : r.status === 'folyamatban'
            ? '<button type="button" data-a="pause"><i data-lucide="pause"></i>Vissza nyitottba</button>'
            : '<button type="button" data-a="doing"><i data-lucide="play"></i>Elkezdtem</button>'}
          ${r.status === 'kesz' ? '' : '<button type="button" data-a="reject"><i data-lucide="circle-x"></i>Nem lesz belőle</button>'}
          <button type="button" data-a="edit"><i data-lucide="pencil"></i>Szerkesztés</button>`;
      const editBox = ed === 'reject'
        ? `<form class="edit" data-form="reject"><textarea name="reason" maxlength="1000" placeholder="Miért nem lesz belőle? (pl. túl drága, nincs rá hely…)">${esc(r.reason || '')}</textarea>
            <div class="row"><button class="btn primary" type="submit"><i data-lucide="check"></i>Mentés</button><button class="btn" type="button" data-a="cancel">Mégse</button></div></form>`
        : ed === 'edit'
        ? `<form class="edit" data-form="edit"><textarea name="text" maxlength="2000" required>${esc(r.text)}</textarea>
            <textarea name="reason" maxlength="1000" placeholder="${r.status === 'elvetve' ? 'Miért nem lett belőle?' : 'Megjegyzés (nem kötelező): hogyan alakult, mi kell hozzá…'}">${esc(r.reason || '')}</textarea>
            <div class="row"><button class="btn primary" type="submit"><i data-lucide="check"></i>Mentés</button><button class="btn" type="button" data-a="cancel">Mégse</button>
              <button class="btn" type="button" data-a="del" style="margin-left:auto;color:var(--bad)"><i data-lucide="trash-2"></i>Törlés</button></div></form>`
        : '';
      return `<div class="idea-row glass ${r.status}" data-id="${esc(r.id)}" style="--i:${Math.min(i, 12)}">
        <button class="tick" type="button" data-a="tick" ${r.status === 'elvetve' ? 'disabled' : ''} aria-label="${r.status === 'kesz' ? 'Mégsem valósult meg' : 'Megvalósult'}" title="${r.status === 'kesz' ? 'Visszavonás' : 'Kipipálás: megvalósult'}"><i data-lucide="check"></i></button>
        <div class="txt">${esc(r.text)}</div>
        <div class="meta"><span class="pill ${r.status}"><i data-lucide="${st.icon}" style="width:13px;height:13px"></i>${st.t}</span><span>felírva ${fmt(r.created_at)}</span>${when ? `<span>· ${when}</span>` : ''}</div>
        ${ed ? '' : why}${ed ? editBox : `<div class="acts">${acts}</div>`}
      </div>`;
    }).join('') : `<div class="card glass"><p class="muted" style="margin:0">${rows.length ? 'Ebben a szűrőben nincs ötlet.' : 'Még nincs ötlet. Írd be fent az elsőt.'}</p></div>`;
    icons();
    const ta = $('#iList textarea'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  };
  const save = async (id, patch, msg) => {
    try { const r = await guarded(() => api.ideaUpdate(id, patch)); rows = rows.map((x) => (x.id === id ? r : x)); editing = null; draw(); if (msg) toast(msg); }
    catch (e) { if (!(e instanceof AccessError)) toast(e.message); }
  };
  $('#iFilters').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) { ideaFilter = b.dataset.f; draw(); } });
  $('#iList').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const id = b.closest('[data-id]').dataset.id, r = rows.find((x) => x.id === id), a = b.dataset.a;
    if (a === 'tick') return save(id, { status: r.status === 'kesz' ? 'nyitott' : 'kesz' }, r.status === 'kesz' ? 'Visszatéve a nyitottak közé.' : 'Szép! Megvalósult.');
    if (a === 'doing') return save(id, { status: 'folyamatban' });
    if (a === 'pause') return save(id, { status: 'nyitott' });
    if (a === 'reopen') return save(id, { status: 'nyitott', reason: '' }, 'Visszatéve a nyitottak közé.');
    if (a === 'reject' || a === 'edit') { editing = { id, mode: a }; return draw(); }
    if (a === 'cancel') { editing = null; return draw(); }
    if (a === 'del') {
      if (!confirm('Biztosan törlöd ezt az ötletet?\n\n' + short(r.text, 120))) return;
      try { await guarded(() => api.ideaDelete(id)); rows = rows.filter((x) => x.id !== id); editing = null; draw(); toast('Törölve.'); }
      catch (err) { if (!(err instanceof AccessError)) toast(err.message); }
    }
  });
  $('#iList').addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target, id = f.closest('[data-id]').dataset.id;
    const reason = f.reason.value.trim();
    if (f.dataset.form === 'reject') return save(id, { status: 'elvetve', reason }, 'Rendben, félretéve.');
    const text = f.text.value.trim(); if (!text) return toast('Az ötlet nem lehet üres.');
    save(id, { text, reason }, 'Elmentve.');
  });
  $('#iList').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.form) e.target.form.requestSubmit(); });
  $('#iText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#ideaForm').requestSubmit(); });
  $('#ideaForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const t = $('#iText').value.trim(); if (!t) return $('#iText').focus();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try { const r = await guarded(() => api.ideaAdd(t)); rows = [r, ...rows.filter((x) => x.id !== r.id)]; $('#iText').value = ''; if (ideaFilter !== 'mind' && ideaFilter !== 'nyitott') ideaFilter = 'mind'; draw(); toast('Felírva.'); }
    catch (err) { if (!(err instanceof AccessError)) toast(err.message); }
    finally { btn.disabled = false; $('#iText').focus(); }
  });
  draw();
  $('#iText').focus();
}

      <button class="btn" type="button" id="logout"><i data-lucide="log-out"></i>Kilépés ezen az eszközön</button></div>
  </div>`;
  icons();
  $('#darkBg').addEventListener('change', (e) => { store.set('kozpont-tema', e.target.checked ? 'sotet' : 'vilagos'); applyTheme(); });
  $('#helyiOn').addEventListener('change', (e) => { if (e.target.checked) store.set('kozpont-helyi', '1'); else store.del('kozpont-helyi'); });
  $('#nameForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#sName').value.trim(); if (v) store.set('naplo-nev', v); else store.del('naplo-nev'); toast('Elmentve.'); });
  $('#logout').addEventListener('click', () => { store.del('km-kod'); store.del('naplo-kod'); projCache = null; renderGate(); });
}

/* =====================================================================
   8. Útvonalak: a cím # utáni része dönti el, melyik nézet látszik
   ===================================================================== */
const VIEWS = { '#/otletek': renderIdeas, '#/projektek': renderProjects, '#/beallitasok': renderSettings };
function route() {
  if (OLD.test(location.hash)) return location.replace('/valk/' + location.search + location.hash);
  if (!DEMO && !kmCode()) return renderGate();
  $('#menuBtn').hidden = false;
  const key = VIEWS[location.hash] ? location.hash : '#/';
  $$('.nav a[data-view]').forEach((a) => a.toggleAttribute('aria-current', a.dataset.view === key));
  $$('.nav a[aria-current]').forEach((a) => a.setAttribute('aria-current', 'page'));
  clearInterval(tickTimer); window.scrollTo(0, 0);
  Promise.resolve().then(VIEWS[key] || renderHome).catch((e) => { if (!(e instanceof AccessError)) console.error(e); });
}
$('#demo').hidden = !DEMO;
{ const { year, week } = isoWeek(today()); $('#topWeek').textContent = `${year} · ${week}. hét`; }
icons();
addEventListener('hashchange', route);
route();
</script>
