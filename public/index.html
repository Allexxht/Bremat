<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14171a">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Valk robot – heti karbantartás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* ================================================================
   Színek – minden szín token. Sötét, ipari: acélszürke + narancs.
   ================================================================ */
:root {
  --bg: #14171a;
  --panel: #1d2126;
  --panel-2: #262b31;
  --line: #3a4048;
  --text: #eef0f2;
  --muted: #b1b8c0;
  --hot: #ff7a1a;          /* narancs kitöltés */
  --hot-ink: #1a1206;      /* szöveg narancson */
  --hot-text: #ffa05c;     /* narancs szöveg / fókusz */
  --ok: #34a862;
  --ok-text: #74dc9a;
  --warn: #e9a92b;
  --warn-text: #f6cb6a;
  --bad: #e5484d;
  --bad-text: #ff9296;
  --ink-on-color: #0f1210;
  --radius: 10px;
  --font: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-cond: 'Barlow Condensed', 'Barlow', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45; }
a { color: var(--hot-text); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--hot-text); outline-offset: 2px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 16px; }

/* Fejléc */
.top { background: #0e1012; border-bottom: 3px solid var(--hot); position: sticky; top: 0; z-index: 20; }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; flex-wrap: wrap; padding-top: 6px; padding-bottom: 6px; }
.brand { display: flex; flex-direction: column; line-height: 1.1; text-decoration: none; color: var(--text); margin-right: auto; }
.brand b { font-family: var(--font-cond); font-size: 22px; letter-spacing: .06em; text-transform: uppercase; }
.brand b span { color: var(--hot); }
.brand small { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 8px; }

/* Gombok */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--panel-2); color: var(--text); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--hot); border-color: var(--hot); color: var(--hot-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { min-height: 56px; font-size: 18px; padding: 0 26px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.ghost { background: transparent; }

/* Kártyák, panelek */
main { padding: 20px 0 120px; }
h1 { font-family: var(--font-cond); font-size: 30px; line-height: 1.1; margin: 4px 0 16px; letter-spacing: .01em; }
h2 { font-family: var(--font-cond); font-size: 21px; margin: 28px 0 12px; text-transform: uppercase; letter-spacing: .04em; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-left-width: 6px; border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
.card .lbl { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.card .val { font-size: 20px; font-weight: 700; }
.card.ok { border-left-color: var(--ok); } .card.ok .val { color: var(--ok-text); }
.card.warn { border-left-color: var(--warn); } .card.warn .val { color: var(--warn-text); }
.card.bad { border-left-color: var(--bad); } .card.bad .val { color: var(--bad-text); }
.card.neutral { border-left-color: var(--line); }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.banner { border-radius: var(--radius); padding: 12px 14px; margin: 0 0 14px; border: 1.5px solid; }
.banner.info { border-color: var(--hot); background: rgba(255,122,26,.08); }
.banner.warn { border-color: var(--warn); background: rgba(233,169,43,.08); }
.banner.bad { border-color: var(--bad); background: rgba(229,72,77,.1); }
.demo-bar { background: var(--warn); color: var(--ink-on-color); text-align: center; font-weight: 600; font-size: 14px; padding: 6px 12px; }

/* Jelvények */
.badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.badge.ok { background: var(--ok); color: var(--ink-on-color); }
.badge.warn { background: var(--warn); color: var(--ink-on-color); }
.badge.bad { background: var(--bad); color: var(--ink-on-color); }
.badge.neutral { background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }

/* Táblázat */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; background: #0e1012; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; padding: 10px; white-space: nowrap; }
td { padding: 10px; border-top: 1px solid var(--line); vertical-align: top; }
tr.missing td { background: rgba(229,72,77,.07); }
tr.link { cursor: pointer; }
tr.link:hover td { background: var(--panel-2); }

/* Szűrők */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span, .field > label { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
input[type=text], input[type=date], input[type=number], input[type=search], input[type=password], select, textarea {
  background: #101316; border: 1.5px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 46px; width: 100%;
}
textarea { min-height: 84px; resize: vertical; }
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.err { color: var(--bad-text); font-weight: 600; font-size: 14px; }
.has-err input, .has-err textarea, .has-err select { border-color: var(--bad); }

/* Űrlap – tételek */
.item { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 4px 12px; }
.item + .item { margin-top: 10px; }
.item, .field, .panel { scroll-margin-top: 90px; scroll-margin-bottom: 100px; }
.item.st-ok { border-color: var(--ok); }
.item.st-action { border-color: var(--warn); }
.item.has-err { border-color: var(--bad); }
.item .no { width: 40px; height: 40px; border-radius: 8px; background: #0e1012; color: var(--hot-text); font-family: var(--font-cond); font-size: 22px; display: flex; align-items: center; justify-content: center; }
.item h3 { margin: 6px 0 4px; font-size: 18px; }
.item ul { margin: 0 0 8px; padding-left: 18px; color: var(--muted); font-size: 14.5px; }
.item ul li { margin: 1px 0; }
.item .body { grid-column: 2; }
.item .ifbad { margin: 0 0 10px; font-size: 14px; color: var(--muted); }
.item .ifbad b { color: var(--warn-text); }
.item .src { margin: 8px 0 0; font-size: 12px; color: var(--muted); opacity: .8; }
.howto { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; font-size: 14.5px; margin-bottom: 6px; }
.howto p { margin: 0; } .howto p + p { margin-top: 6px; }
.howto .t-ok { color: var(--ok-text); } .howto .t-action { color: var(--warn-text); }
.group { margin: 22px 0 10px; padding-left: 12px; border-left: 4px solid var(--hot); }
.group h3 { margin: 0; font-family: var(--font-cond); font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
.group p { margin: 2px 0 0; color: var(--muted); font-size: 14.5px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.seg button { min-height: 52px; border-radius: 8px; border: 2px solid var(--line); background: #101316; font-weight: 700; font-size: 16px; cursor: pointer; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed=true].s-ok { background: var(--ok); border-color: var(--ok); color: var(--ink-on-color); }
.seg button[aria-pressed=true].s-action { background: var(--warn); border-color: var(--warn); color: var(--ink-on-color); }
.seg button[aria-pressed=true].s-yes { background: var(--warn); border-color: var(--warn); color: var(--ink-on-color); }
.seg button[aria-pressed=true].s-no { background: var(--ok); border-color: var(--ok); color: var(--ink-on-color); }
.note { margin-top: 10px; }
.extra { margin-top: 10px; padding: 10px 12px; background: #101316; border: 1px dashed var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; gap: 10px; align-items: center; min-height: 44px; cursor: pointer; font-weight: 600; }
.check input { width: 24px; height: 24px; accent-color: var(--hot); }

.safety { border: 1.5px solid var(--hot); border-radius: var(--radius); padding: 12px 14px; background: rgba(255,122,26,.07); font-size: 14.5px; margin-bottom: 14px; }
.safety b { color: var(--hot-text); }

/* Alsó sáv beküldéshez */
.submitbar { position: fixed; left: 0; right: 0; bottom: 0; background: #0e1012; border-top: 2px solid var(--line); z-index: 30; }
.submitbar .wrap { display: flex; align-items: center; gap: 12px; min-height: 76px; }
.progress { flex: 1; display: flex; flex-direction: column; gap: 6px; }
.progress .bar { height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; }
.progress .bar i { display: block; height: 100%; background: var(--hot); width: 0; transition: width .2s; }
@media (prefers-reduced-motion: reduce) { .progress .bar i { transition: none; } }

/* Lap megtekintése */
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; }
.kv div span { display: block; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kv div b { font-size: 17px; }
.pre { white-space: pre-wrap; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* Belépés */
.gate { max-width: 420px; margin: 8vh auto 0; }

/* Párbeszédablak és toast */
dialog { background: var(--panel); color: var(--text); border: 1.5px solid var(--line); border-radius: 12px; padding: 20px; max-width: min(480px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(0,0,0,.6); }
dialog h3 { margin: 0 0 10px; font-family: var(--font-cond); font-size: 22px; }
#toast { position: fixed; left: 50%; bottom: 96px; transform: translateX(-50%); background: var(--ok); color: var(--ink-on-color); font-weight: 700; padding: 12px 18px; border-radius: 10px; z-index: 50; display: none; max-width: calc(100vw - 32px); }
#toast.bad { background: var(--bad); }

@media (max-width: 560px) {
  .top { position: static; }
  h1 { font-size: 25px; }
  .item { grid-template-columns: minmax(0,1fr); }
  .item .no { width: 34px; height: 34px; font-size: 19px; }
  .item .body { grid-column: 1; }
  .submitbar .wrap { min-height: 70px; }
  .btn.big { font-size: 17px; padding: 0 18px; }
  .hide-sm { display: none; }
}

/* Nyomtatás: fehér lap, fekete szöveg */
@media print {
  :root { --bg:#fff; --panel:#fff; --panel-2:#fff; --line:#000; --text:#000; --muted:#333; --hot-text:#000; color-scheme: light; }
  .top, .submitbar, .no-print, .demo-bar, #toast { display: none !important; }
  main { padding: 0; }
  th { background: #fff; color: #000; border-bottom: 1.5px solid #000; }
  .badge { border: 1px solid #000; background: #fff !important; color: #000 !important; }
  .table-wrap { border: none; overflow: visible; }
  td, th { border-top: 1px solid #000; }
  tr { break-inside: avoid; }
}
</style>
</head>
<body>
<div id="demo" class="demo-bar" hidden>DEMÓ mód – mintaadatok, csak ebben a böngészőben tárolva. Az éles lapokhoz nyisd meg a címet ?demo nélkül.</div>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#/"><b>BREMAT <span>·</span> Valk robot</b><small>Heti karbantartási lap</small></a>
    <nav class="nav" id="nav" hidden>
      <a class="btn ghost" href="#/">Áttekintés</a>
      <a class="btn primary" href="#/uj">Új heti lap</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script type="module">
/* ================================================================
   CONFIG
   Az adatok a Netlify site saját tárolójában vannak (Netlify Blobs),
   a /api/km függvényen keresztül. A hozzáférési kód a Netlify
   KM_ACCESS_CODE környezeti változójában van, nem itt.
   DEMÓ mód: a cím végére ?demo – mintaadatok, csak ebben a böngészőben.
   ================================================================ */
const CONFIG = {
  API_URL: '/api/km',
  ROBOTS: ['Valk robot'],          // több robotnál: ['Valk robot 1', 'Valk robot 2']
  START_DATE: '2026-10-05',        // ettől a héttől számít „hiányzó” egy kitöltetlen hét
  COOLING_WATER_MONTHS: 6,         // hűtővíz-csere gyakorisága (Valk 6.6)
  // Helyi értékek – ha ki vannak töltve, a lap kiírja őket a tételnél.
  GAS_FLOW_LPM: '',                // előírt gázáramlás, pl. '14'
  AIR_PRESSURE_BAR: '',            // a levegőegység megszokott nyomása, pl. '6'
  COOLANT: '',                     // a hűtő folyadéka (SMC kézikönyv / kanna szerint)
};

/* ================================================================
   A heti tételek – a lap 2. változata (2026. szeptember 30.)
   Forrás: Valk kézikönyv 6.6 (heti) és 6.5 (napi A–C), Panasonic
   robotkar (R), vezérlő (V) kézikönyv. Sorrend: ahogy a cellánál
   haladni érdemes – előbb leállított cellánál, utána bekapcsolva.
   Ha a tételek változnak: FORM_VERSION + 1, a régi címek a
   LEGACY_TITLES-be (a régi lapok így is olvashatók maradnak), és a
   szerveren (lib/km-core.mjs) is FORM_VERSION + 1.
   ================================================================ */
const FORM_VERSION = 2;
const opt = (v, pre, post = '') => (v ? `${pre}${v}${post}` : '');
const GROUPS = {
  A: { title: 'A · Leállított cellánál', intro: 'A robot áll, Teach mód, vészleállító benyomva. Ahol a tétel kéri, főkapcsoló le.' },
  B: { title: 'B · Bekapcsolás után', intro: 'Bekapcsolás: I/O vezérlő → szűrődoboz → robotvezérlő. Bekapcsolás előtt nézd meg, hogy senki nincs a robot munkaterében.' },
};
const ITEMS = [
  { no: 1, key: 'area', group: 'A', title: 'Munkaterület és szerszámok', src: 'Valk 6.6/7 · napi A5–A6',
    steps: ['Szedd össze a huzalvégeket, a fröccsöt és a leesett alkatrészeket az állomásokból és a robot körül.',
      'Ürítsd ki a hulladékgyűjtőket.',
      'A szerszámok tiszták, épek, és a helyükön vannak.'],
    bad: 'Hiányzó vagy sérült szerszám: pótold, vagy írd be.' },
  { no: 2, key: 'arm', group: 'A', title: 'Robotkar', src: 'Valk 6.6/1 · Panasonic R 8.1.1',
    steps: ['Töröld le a port és a fröccsöt ronggyal. <b>Sűrített levegő és víz tilos</b> – bejut a robotba.',
      'Nézd végig a tengelyeket: a kifolyt zsírt töröld le. Az UA tengely túlnyomás-szelepénél kevés zsír normális.',
      'A kábelek körüli gumilapok nem repedtek, nincs laza csavar.'],
    bad: 'Ha a zsírszivárgás visszatér, repedt a gumilap, vagy laza rész van, aminek nem tudod az okát: jelezd (Panasonic szerviz).' },
  { no: 3, key: 'torch', group: 'A', title: 'Pisztoly és ütközésvédő', src: 'Valk 6.6/1, 6.6/5 · napi B5',
    steps: ['Cseréld ki az áramátadót (current conductor) – a Valk szerint hetente, akkor is, ha még jónak látszik. Csere után húzd meg.',
      'Tisztítsd ki a gázfúvókát; ha deformált, vagy nem jön le róla a fröccs, cseréld.',
      'Az O-gyűrűk épek (nem repedtek, nem laposak), a gázcső ép és nincs eltömődve.',
      'A pisztolyon nincs égés- vagy melegedésnyom.',
      'Az ütközésvédő (safety holder) ép, a pisztoly szilárdan, lötyögés nélkül ül benne, a levegőcsatlakozása ép.'],
    bad: 'Kopott vagy sérült alkatrész: csere. Lötyögő vagy sérült ütközésvédővel ne indítsd a robotot – jelezd.' },
  { no: 4, key: 'hose', group: 'A', title: 'Kábelköteg és spirál', src: 'Valk 6.6/4 · napi B4',
    steps: ['A köteg száraz: a hűtővíz-csatlakozásoknál nincs szivárgás.',
      'Nincs éles megtörés, a burkolat ép, nincs égés- vagy melegedésnyom.',
      'A huzal egyenletesen, akadás nélkül fut a spirálban (coil).'],
    bad: 'Nedves, megtört vagy égett köteg: csere, a hibás köteg javításra a Valk-hoz megy. Ha a huzal akad vagy ugrál: spirálcsere.' },
  { no: 5, key: 'feeder', group: 'A', title: 'Huzaladagoló', src: 'Valk 6.6/6 · Panasonic R 8.7.1 · napi B2–B3',
    steps: ['Szedd ki a huzalforgácsot a görgők környékéről, a rozsdamentes cső és a központi cső bemenetéből – ecsettel vagy porszívóval, <b>sűrített levegő tilos</b>.',
      'A görgők hornya nem kopott, nem repedt; a görgők és a csövek a használt huzalátmérőhöz valók.',
      'PFA: van elég olaj – ha kevés, töltsd utána (WWPFAOIL).'],
    bad: 'Kopott vagy repedt görgő: csere. Rossz görgő vagy cső a huzalhoz: sok forgács, eltömődő spirál, instabil ív lesz belőle.' },
  { no: 6, key: 'cleaner', group: 'A', title: 'Pisztolytisztító (Thielmann)', src: 'Valk 6.6/15 · napi B8',
    steps: ['Védőszemüvegben takarítsd ki a forgácsot és a fröccsöt a tisztítóból.',
      'A kaparókés ép, nem kopott.',
      'Van elég fröccsgátló folyadék.'],
    bad: 'Kopott kés: csere. Kevés folyadék: utántöltés.' },
  { no: 7, key: 'jigs', group: 'A', title: 'Készülékek (jigek)', src: 'Valk 6.6/11 · napi A4',
    steps: ['Szedd le a fröccsöt a befogókról, az ütközőkről és a pozicionáló lapokról.',
      'Minden szorító rendesen zár és tart; nincs laza, törött vagy hiányzó elem.'],
    bad: 'Amit nem tudsz megjavítani, jelezd a karbantartásnak – rosszul befogott munkadarabbal nem szabad hegeszteni.' },
  { no: 8, key: 'controller', group: 'A', title: 'Vezérlő és hegesztőkábelek', src: 'Valk 6.6/1–2 · Panasonic V 7.2 · napi A2',
    steps: ['Kapcsold le a robotvezérlő főkapcsolóját, és várj, amíg lehűl.',
      'Tisztítsd ki a vezérlő oldalpaneljein lévő légszűrőket; az eltömődött vagy sérült szűrőt cseréld.',
      'A vezérlőszekrényeket kívülről töröld le (sűrített levegő tilos).',
      'A földkábel és a hegesztő áramkábelek csatlakozása szoros; nincs sérülés, égés- vagy melegedésnyom.'],
    bad: 'Laza, égett vagy sérült kábel: karbantartás – tűzveszély. Ha a „Temperature error” (W1210, W1220) a szűrő tisztítása után is visszajön: Panasonic.' },
  { no: 9, key: 'fence', group: 'A', title: 'Kerítés, ajtók, fényvédelem, fénysorompók', src: 'Valk 6.6/8–10, 6.6/14 · napi A3',
    steps: ['A kerítéselemek és a szervizajtó épek, stabilak, nincs rés vagy laza rögzítés. Töröld le őket.',
      'A hegesztési fényvédő függöny vagy lemez ép: nincs rajta szakadás, égett lyuk, rés.',

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch { /* nincs tárolás */ } },
};
const ymdFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => ymdFmt.format(new Date());
const toDate = (ymd) => new Date(ymd + 'T00:00:00Z');
const fromDate = (d) => d.toISOString().slice(0, 10);
const addDays = (ymd, n) => { const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + n); return fromDate(d); };
const addMonths = (ymd, n) => { const d = toDate(ymd); const day = d.getUTCDate(); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); const last = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate(); d.setUTCDate(Math.min(day, last)); return fromDate(d); };
const mondayOf = (ymd) => { const d = toDate(ymd); return addDays(ymd, -((d.getUTCDay() + 6) % 7)); };
function isoWeek(ymd) {
  const d = toDate(ymd);
  d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const year = d.getUTCFullYear();
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const week = 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7);
  return { year, week };
}
const huDate = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', year: 'numeric', month: '2-digit', day: '2-digit' });
const huShort = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const huDateTime = new Intl.DateTimeFormat('hu-HU', { timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
const fmtDate = (ymd) => ymd ? huDate.format(toDate(ymd)) : '—';
const fmtShort = (ymd) => huShort.format(toDate(ymd));
const fmtDT = (ts) => ts ? huDateTime.format(new Date(ts)) : '—';
const weekKey = (y, w) => `${y}/${String(w).padStart(2, '0')}`;
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);

function toast(msg, bad = false) {

}

/* ================================================================
   Adatréteg: szerver (/api/km, éles) vagy DEMÓ (böngészőben tárolva).
   Mindkettő ugyanazt tudja: ping, list, get, submit, approve.
   ================================================================ */
const DEMO = new URLSearchParams(location.search).has('demo');

class AccessError extends Error {}

function createApiAdapter() {
  async function call(action, payload) {
    let res;
    try {
      res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ action, ...payload }),
        cache: 'no-store',
      });
    } catch {
      throw new Error('Nincs kapcsolat a szerverrel. Ellenőrizd az internetet, és próbáld újra.');
    }
    let body = null;
    try { body = await res.json(); } catch { /* nem JSON válasz */ }
    if (res.status === 401) throw new AccessError('Hibás hozzáférési kód');
    if (!res.ok) throw new Error(body?.error || `Szerverhiba (${res.status}). Próbáld újra később.`);
    return body?.data;
  }
  return {
    ping: (code) => call('ping', { code }),
    list: (code) => call('list', { code }),
    get: (code, id) => call('get', { code, id }),
    submit: (code, check) => call('submit', { code, check }),
    approve: (code, id, name) => call('approve', { code, id, name }),
  };
}

function createDemoAdapter() {
  const KEY = 'km-demo-v2';
  let mem = null;
  const load = () => {
    if (mem) return mem;
    const raw = store.get(KEY);
    mem = raw ? JSON.parse(raw) : seed();
    save();
    return mem;
  };
  const save = () => { store.set(KEY, JSON.stringify(mem)); };
  function seed() {
    const mon = mondayOf(today());
    const names = ['Kovács Gábor', 'Tóth Ádám'];
    const out = [];
    [-6, -5, -3, -2, -1].forEach((off, i) => {
      const d = addDays(mon, off * 7);
      const items = ITEMS.map((it) => ({ no: it.no, status: 'ok', note: null }));
      let extra = {};
      const act = (key, note) => { const n = ITEM_BY_KEY[key].no; items[n - 1] = { no: n, status: 'action', note }; };
      if (off === -6) act('cool', 'Hűtőfolyadék utántöltve (kb. 1 l)');
      if (off === -2) { act('torch', 'Gázfúvóka deformált volt – csere; 2 O-gyűrű csere'); act('cleaner', 'Kaparókés kopott – csere'); extra = { remarks: 'A gázfúvóka belső fala erősen fröccsös volt.', parts_used: '1 db gázfúvóka, 2 db O-gyűrű, 1 db kaparókés' }; }
      if (off === -1) { act('gas', 'Szivárgás a gáztömlő csatlakozásánál, bilincs utánhúzva'); extra = { remarks: 'A gáztömlő a csatlakozásnál repedezett, cserélni kell.', escalate: true, escalate_to: 'Karbantartás (Szabó)' }; }
      out.push(mk({
        check_date: d, robot: CONFIG.ROBOTS[0], inspector: names[i % 2], items,
        cooling_water_changed: off === -6 ? addMonths(d, -5) : null,
        gas_flow_lpm: 14 + (i % 3), escalate: false, ...extra,
      }, off < -2 ? { by: 'Nagy Béla', at: addDays(d, 1) + 'T09:12:00Z' } : null));
    });
    return out;
  }
  function mk(c, appr) {
    const { year, week } = isoWeek(c.check_date);
    return {
      id: crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2),
      form_version: FORM_VERSION, created_at: new Date().toISOString(), check_date: c.check_date, iso_year: year, iso_week: week,
      robot: c.robot, inspector: c.inspector, items: c.items,
      action_count: c.items.filter((x) => x.status === 'action').length,
      cooling_water_changed: c.cooling_water_changed || null, gas_flow_lpm: c.gas_flow_lpm ?? null,
      remarks: c.remarks || null, parts_used: c.parts_used || null, escalate: !!c.escalate,
      escalate_to: c.escalate ? c.escalate_to : null,
      approved_by: appr ? appr.by : null, approved_at: appr ? appr.at : null,
    };
  }
  const delay = (v) => new Promise((r) => setTimeout(() => r(structuredClone(v)), 120));
  return {
    ping: () => delay(true),
    list: () => delay([...load()].sort((a, b) => b.check_date.localeCompare(a.check_date) || b.created_at.localeCompare(a.created_at))),
    get: (_c, id) => { const r = load().find((x) => x.id === id); if (!r) return Promise.reject(new Error('Nincs ilyen lap')); return delay(r); },
    submit: (_c, c) => {
      const rec = mk({ ...c, gas_flow_lpm: c.gas_flow_lpm === '' || c.gas_flow_lpm == null ? null : Number(c.gas_flow_lpm), cooling_water_changed: c.cooling_water_changed ? c.check_date : null }, null);
      load().push(rec); save(); return delay(rec.id);
    },
    approve: (_c, id, name) => {
      const r = load().find((x) => x.id === id);
      if (!r) return Promise.reject(new Error('Nincs ilyen lap'));
      if (r.approved_by) return Promise.reject(new Error('Ezt a lapot már jóváhagyták'));
      r.approved_by = name.trim(); r.approved_at = new Date().toISOString(); save(); return delay(r);
    },
  };
}

  catch (e) {

}

function coolingState(list, robot) {
  const last = list.filter((r) => r.robot === robot && r.cooling_water_changed).map((r) => r.cooling_water_changed).sort().pop();
  if (!last) return { cls: 'neutral', val: 'Nincs rögzítve', sub: 'Ha cseréltetek, a heti lapon jelöld a 3. tételnél.' };
  const due = addMonths(last, CONFIG.COOLING_WATER_MONTHS);
  const left = daysBetween(today(), due);
  if (left < 0) return { cls: 'bad', val: `Lejárt ${-left} napja`, sub: `Utolsó csere: ${fmtDate(last)} · esedékes volt: ${fmtDate(due)}`, last, due };
  if (left <= 30) return { cls: 'warn', val: `${left} nap múlva esedékes`, sub: `Utolsó csere: ${fmtDate(last)} · esedékes: ${fmtDate(due)}`, last, due };
  return { cls: 'ok', val: `Rendben – ${fmtDate(due)}`, sub: `Utolsó csere: ${fmtDate(last)}`, last, due };
}

function buildWeeks(list, robot) {
  const t = today();
  const cur = isoWeek(t);
  const recs = list.filter((r) => r.robot === robot);
  const firstRec = recs.map((r) => r.check_date).sort()[0];
  // A figyelés a START_DATE hetétől indul (vagy a legelső laptól, ha az korábbi),
  // de az aktuális hét mindig szerepel – akkor is, ha a mai nap a START_DATE előtt van.
  let start = mondayOf(CONFIG.START_DATE);
  if (firstRec && firstRec < start) start = mondayOf(firstRec);
  if (start > mondayOf(t)) start = mondayOf(t);
  const byWeek = new Map();
  recs.forEach((r) => { const k = weekKey(r.iso_year, r.iso_week); (byWeek.get(k) || byWeek.set(k, []).get(k)).push(r); });
  const weeks = [];
  for (let m = mondayOf(t); m >= start; m = addDays(m, -7)) {
    const { year, week } = isoWeek(m);
    const k = weekKey(year, week);
    const rows = byWeek.get(k) || [];
    const isCur = year === cur.year && week === cur.week;
    weeks.push({ key: k, year, week, monday: m, rows, status: rows.length ? 'done' : isCur ? 'due' : 'missing' });
  }
  return weeks;
}

  $$('tr.link', app).forEach((tr) => {
    const go = () => { location.hash = tr.dataset.href; };
    tr.addEventListener('click', go);
    tr.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  });
  $('#robotSel')?.addEventListener('change', (e) => { view.robot = e.target.value; renderOverview(); });
  $('#yearSel').addEventListener('change', (e) => { view.year = Number(e.target.value); renderOverview(); });
  let qt; $('#q').addEventListener('input', (e) => { clearTimeout(qt); qt = setTimeout(() => { view.q = e.target.value; const pos = e.target.selectionStart; renderOverview().then(() => { const i = $('#q'); i.focus(); i.setSelectionRange(pos, pos); }); }, 250); });
  $('#csv').addEventListener('click', () => downloadCsv(recs.filter(matches)));
}

function downloadCsv(rows) {
  const head = ['Év', 'Hét', 'Dátum', 'Robot', 'Ellenőrizte', 'Beavatkozások száma', 'Hűtővíz csere', 'Gázáramlás (l/min)', 'Továbbjelzés', 'Kinek', 'Megjegyzés', 'Felhasznált alkatrész', 'Jóváhagyta', 'Jóváhagyva', 'Beküldve', 'Lap változat',
    ...ITEMS.flatMap((it) => [`${it.no}. ${it.title}`, `${it.no}. mit csinált`]), 'Régebbi lapváltozat tételei'];
  const stTxt = (x) => (x.status === 'action' ? 'Beavatkozás' : x.status === 'ok' ? 'Rendben' : '');
  // A tételoszlopok a mostani lapváltozathoz tartoznak. Egy régebbi változatú lap
  // tételei (mások voltak) az utolsó oszlopba kerülnek, címmel együtt.
  const itemCols = (r) => {
    const v = r.form_version || 1;
    const find = (no) => (r.items || []).find((y) => y.no === no) || {};
    if (v === FORM_VERSION) return [...ITEMS.flatMap((it) => { const x = find(it.no); return [stTxt(x), x.note || '']; }), ''];
    const old = titlesFor(r).map((t, i) => { const x = find(i + 1); return `${i + 1}. ${t}: ${stTxt(x)}${x.note ? ` – ${x.note}` : ''}`; }).join(' | ');
    return [...ITEMS.flatMap(() => ['', '']), old];
  };
  const cell = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const lines = [head, ...rows.map((r) => [r.iso_year, r.iso_week, r.check_date, r.robot, r.inspector, r.action_count, r.cooling_water_changed || '', r.gas_flow_lpm ?? '', r.escalate ? 'Igen' : 'Nem', r.escalate_to || '', r.remarks || '', r.parts_used || '', r.approved_by || '', r.approved_at ? fmtDT(r.approved_at) : '', fmtDT(r.created_at), r.form_version || 1, ...itemCols(r)])]
    .map((l) => l.map(cell).join(';')).join('\r\n');
  const blob = new Blob(['﻿' + lines], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `valk-karbantartas-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

}
function loadDraft() {
  // Egy régebbi lapváltozat piszkozata nem tölthető vissza: a tételek mást jelentenének.
  try { const d = JSON.parse(store.get(DRAFT_KEY)); if (d && d.form_version === FORM_VERSION && Array.isArray(d.items) && d.items.length === ITEMS.length) return d; } catch { /* nincs */ }

}

            ${it.key === 'gas' ? `<div class="extra"><label class="field"><span>Mért gázáramlás a pisztolynál (l/min) – nem kötelező</span><input type="number" id="f_gas" inputmode="decimal" min="0" max="100" step="0.1" value="${esc(d.gas_flow_lpm)}"></label></div>` : ''}

      <div class="field" id="escBox" data-f="escalate"><span>Továbbjelzés szükséges?</span>
        <div class="seg" role="group" aria-label="Továbbjelzés szükséges?">
          <button type="button" class="s-yes" data-esc="true" aria-pressed="false">Igen</button>
          <button type="button" class="s-no" data-esc="false" aria-pressed="false">Nem</button>

    </div>

    <div class="submitbar no-print"><div class="wrap">
      <div class="progress"><span id="progTxt" class="small"></span><div class="bar"><i id="progBar"></i></div></div>

    </div></div>`;

  // --- állapot → felület
  const paintItem = (i) => {
    const it = d.items[i]; const sec = $(`#item-${i + 1}`);
    sec.classList.toggle('st-ok', it.status === 'ok');
    sec.classList.toggle('st-action', it.status === 'action');
    $$('.seg button', sec).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.st === it.status)));
    const note = $('.note', sec); note.hidden = it.status !== 'action';
    const ta = $('textarea', note); if (ta.value !== it.note) ta.value = it.note || '';
  };
  const paintEsc = () => {
    $$('#escBox .seg button').forEach((b) => b.setAttribute('aria-pressed', String(String(d.escalate) === b.dataset.esc)));
    $('#escTo').hidden = d.escalate !== true;
  };
  const paintProgress = () => {
    const n = d.items.filter((x) => x.status).length;
    $('#progTxt').textContent = `${n} / ${ITEMS.length} tétel kitöltve`;
    $('#progBar').style.width = `${(n / ITEMS.length) * 100}%`;
  };
  const paintDup = () => {
    const s = sameWeek();
    $('#weekInfo').textContent = weekInfo();
    $('#dupWarn').innerHTML = s.length ? `<div class="banner warn">Erre a hétre (${weekInfo()}) már van kitöltött lap: ${s.map((r) => `<a href="#/lap/${esc(r.id)}">${esc(r.inspector)}, ${fmtDate(r.check_date)}</a>`).join(', ')}. Csak akkor tölts ki újat, ha tényleg kell.</div>` : '';
  };
  const clearErr = (el) => { if (!el) return; el.classList.remove('has-err'); const e = $('.err', el); if (e) { e.hidden = true; e.textContent = ''; } };
  const setErr = (el, msg) => { el.classList.add('has-err'); const e = $('.err', el); if (e) { e.hidden = false; e.textContent = msg; } };

  d.items.forEach((_, i) => paintItem(i));
  paintEsc(); paintProgress(); paintDup();
  if (d.cooling_water_changed) $('#f_cool').checked = true;

  // --- események
  $('#items').addEventListener('click', (e) => {
    const b = e.target.closest('.seg button'); if (!b) return;
    const sec = b.closest('.item'); const i = Number(sec.dataset.i);

  // --- ellenőrzés + beküldés
  function validate() {
    const errs = [];
    const f = (sel) => $(sel).closest('.field');
    if (!d.check_date) { setErr(f('#f_date'), 'Add meg a dátumot.'); errs.push(f('#f_date')); }
    else if (d.check_date > addDays(today(), 1)) { setErr(f('#f_date'), 'A dátum nem lehet jövőbeli.'); errs.push(f('#f_date')); }
    if (!d.inspector.trim()) { setErr(f('#f_inspector'), 'Írd be a neved.'); errs.push(f('#f_inspector')); }
    d.items.forEach((it, i) => {
      const sec = $(`#item-${i + 1}`);
      if (!it.status) { setErr(sec, 'Jelöld: Rendben vagy Beavatkozás kellett.'); errs.push(sec); }
      else if (it.status === 'action' && !it.note.trim()) { setErr(sec, 'Írd be, mit csináltál.'); errs.push(sec); }
    });
    if (d.gas_flow_lpm !== '' && (isNaN(Number(d.gas_flow_lpm)) || Number(d.gas_flow_lpm) < 0 || Number(d.gas_flow_lpm) > 100)) { const g = $(`#item-${ITEM_BY_KEY.gas.no}`); setErr(g, 'A gázáramlás 0 és 100 l/min közötti szám legyen.'); errs.push(g); }
    if (d.escalate === null) { setErr($('#escBox'), 'Jelöld: Igen vagy Nem.'); errs.push($('#escBox')); }
    else if (d.escalate && !d.escalate_to.trim()) { setErr($('#escTo'), 'Írd be, kinek kell továbbjelezni.'); errs.push($('#escTo')); }
    return errs;
  }

  $('#submitBtn').addEventListener('click', () => {
    const errs = validate();
    if (errs.length) {
      errs[0].scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
      toast(`${errs.length} helyen hiányzik valami – pirossal jelölve.`, true);
      return;
    }
    const nAct = d.items.filter((x) => x.status === 'action').length;
    const dlg = $('#dlg');
    dlg.innerHTML = `
      <h3>Beküldöd a lapot?</h3>
      <p><b>${weekInfo()}</b> · ${esc(d.robot)} · ${esc(d.inspector.trim())}</p>
      <p>${ITEMS.length - nAct} tétel rendben, <b>${nAct}</b> beavatkozással.${d.cooling_water_changed ? ' Hűtővíz-csere rögzítve.' : ''}${d.escalate ? ` Továbbjelzés: <b>${esc(d.escalate_to.trim())}</b>.` : ''}</p>
      <p class="small muted">Beküldés után a lap nem módosítható.</p>
      <p class="err" id="dlgErr" hidden></p>
      <div class="actions"><button class="btn" type="button" id="dlgNo">Vissza</button><button class="btn primary" type="button" id="dlgYes">Beküldés</button></div>`;
    dlg.showModal();
    $('#dlgNo').onclick = () => dlg.close();
    $('#dlgYes').onclick = async () => {
      const yes = $('#dlgYes'); yes.disabled = true; yes.textContent = 'Mentés…';
      const payload = {
        form_version: FORM_VERSION, check_date: d.check_date, robot: d.robot, inspector: d.inspector.trim(),
        items: d.items.map((x) => ({ no: x.no, status: x.status, note: x.status === 'action' ? x.note.trim() : null })),
        cooling_water_changed: !!d.cooling_water_changed,
        gas_flow_lpm: d.gas_flow_lpm === '' ? null : Number(d.gas_flow_lpm),
        remarks: d.remarks.trim(), parts_used: d.parts_used.trim(),
        escalate: d.escalate, escalate_to: d.escalate ? d.escalate_to.trim() : null,
      };
      try {
        const id = await call(() => api.submit(getCode(), payload));
        store.del(DRAFT_KEY);
        dlg.close();
        toast('A lap elmentve.');
        location.hash = `#/lap/${id}`;
      } catch (e) {
        if (e instanceof AccessError) { dlg.close(); return; }
        const er = $('#dlgErr'); er.hidden = false;
        er.textContent = `Nem sikerült menteni: ${e.message} A kitöltött lap megmarad ezen az eszközön.`;
        yes.disabled = false; yes.textContent = 'Újrapróbálom';
      }
    };
  });
}

      <div><span>Továbbjelzés</span><b>${r.escalate ? `Igen – ${esc(r.escalate_to)}` : 'Nem'}</b></div>
    </div>
    <div class="panel" style="margin-top:10px"><span class="muted small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600">Észlelt hiba / megjegyzés</span><p class="pre" style="margin:6px 0 0">${esc(r.remarks) || '—'}</p></div>
    <div class="panel" style="margin-top:10px"><span class="muted small" style="text-transform:uppercase;letter-spacing:.06em;font-weight:600">Alkatrész vagy anyag felhasználva</span><p class="pre" style="margin:6px 0 0">${esc(r.parts_used) || '—'}</p></div>

    <h2>Műszakvezetői jóváhagyás</h2>
    <div class="panel" id="appr">
      ${r.approved_by
        ? `<div class="kv"><div><span>Jóváhagyta</span><b>${esc(r.approved_by)}</b></div><div><span>Időpont</span><b>${fmtDT(r.approved_at)}</b></div></div>`
        : `<form id="apprForm" class="grid-2 no-print" style="align-items:end">
             <label class="field"><span>Műszakvezető neve</span><input type="text" id="apprName" maxlength="120" autocomplete="off" required></label>
             <button class="btn primary" type="submit">Jóváhagyom</button>
           </form>
           <p class="err" id="apprErr" hidden></p>
           <p class="small muted" style="margin:8px 0 0">A jóváhagyás egyszer írható be, utána nem módosítható.</p>`}
    </div>

    <div class="actions no-print">
      <a class="btn" href="#/">Vissza az áttekintéshez</a>
      <button class="btn" type="button" id="printBtn">Nyomtatás / PDF</button>
    </div>`;

  $('#printBtn').addEventListener('click', () => window.print());
  $('#apprForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = $('#apprName').value.trim();
    if (!name) return;
    const b = e.submitter; if (b) b.disabled = true;
    try {
      await call(() => api.approve(getCode(), r.id, name));
      toast('Jóváhagyva.');
      renderDetail(r.id);
    } catch (err) {
      if (err instanceof AccessError) return;
      const er = $('#apprErr'); er.hidden = false; er.textContent = err.message;
      if (b) b.disabled = false;
    }
  });
}

/* ================================================================
   Útvonalak
   ================================================================ */
function route() {
  if (!DEMO && !getCode()) return renderGate();
  const h = location.hash || '#/';
  window.scrollTo(0, 0);
  const m = h.match(/^#\/lap\/([0-9a-zA-Z-]+)$/);
  const run = m ? () => renderDetail(m[1]) : h === '#/uj' ? renderForm : renderOverview;
  Promise.resolve().then(run).catch((e) => {
    if (e instanceof AccessError) return;
    console.error(e);
    $('#app').innerHTML = `<div class="banner bad">Váratlan hiba történt: ${esc(e.message)}</div><a class="btn" href="#/">Vissza az áttekintéshez</a>`;
  });
}

$('#demo').hidden = !DEMO;
codeFromUrl();
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
