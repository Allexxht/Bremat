<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef2">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>BREMAT Központ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
<!-- Ikonok: Lucide (nyílt forrású ikonkészlet) -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<!--
  =====================================================================
  BREMAT Központ – a bremat-stuff kezdőlapja.
  Felül középen a cím, bal oldalt lenyitható menü, a cím alatt két
  „sziget”: Munkanapló és Valk heti lap, értesítés-jelvénnyel.
  Háttér: animált, hajlított „selyemszalagok” (canvas). Alapból világos,
  a Beállításokban sötétre váltható.
  A Központ nem tárol semmit: a meglévő szerverfüggvényeket kérdezi
  (/api/naplo, /api/km, /api/kozpont).
  =====================================================================
-->
<style>
/* ---------- Színek (tokenek): világos alap, sötét változat ---------- */
:root {
  --bg: #eceef2;
  --glass: rgba(255, 255, 255, .62);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-line: rgba(255, 255, 255, .85);
  --line: rgba(16, 20, 28, .1);
  --shadow: 0 12px 40px rgba(24, 30, 44, .12);
  --text: #12151b;
  --muted: #586070;
  --hover: rgba(16, 20, 28, .055);
  --active: rgba(16, 20, 28, .085);
  --accent: #c8102e;
  --scrim: rgba(20, 24, 33, .22);
  --naplo: #0e8ea3;  --naplo-soft: rgba(14, 142, 163, .13);
  --valk: #c8102e;   --valk-soft: rgba(200, 16, 46, .1);
  --ok: #1e9a4e; --warn: #c27c00; --bad: #c8102e;
  --badge-ink: #ffffff;
  --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b0c0e;
  --glass: rgba(22, 24, 28, .55);
  --glass-strong: rgba(20, 22, 26, .86);
  --glass-line: rgba(255, 255, 255, .12);
  --line: rgba(255, 255, 255, .1);
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  --text: #eef1f6; --muted: #9aa3b2;
  --hover: rgba(255, 255, 255, .06); --active: rgba(255, 255, 255, .1);
  --accent: #ff5468; --scrim: rgba(0, 0, 0, .4);
  --naplo: #4cc7da; --naplo-soft: rgba(76, 199, 218, .14);
  --valk: #ff5468;  --valk-soft: rgba(255, 84, 104, .14);
  --ok: #4ad37f; --warn: #f2b84b; --bad: #ff5468;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }

/* ---------- Háttér: a szalagokat a canvas rajzolja (lásd 1. pont a scriptben) ---------- */
#silk { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }

/* ---------- Üveg ---------- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-line);
  box-shadow: var(--shadow);
}

/* ---------- Fejléc: bal oldalt menügomb, középen a cím ---------- */
.topbar {
  position: fixed; z-index: 20;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  height: 64px; border-radius: 20px;
  display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 0 10px;
  animation: dropIn .7s var(--ease) both;
}
.title { grid-column: 2; text-align: center; margin: 0; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .02em; }
.title a { text-decoration: none; }
.title span { color: var(--muted); font-weight: 500; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-14px); } }

.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid transparent; display: grid; place-items: center; background: transparent; color: var(--text); cursor: pointer;
  transition: background .25s var(--ease), transform .2s var(--ease), border-color .25s; }
.icon-btn:hover { background: var(--hover); border-color: var(--glass-line); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Lenyitható menü ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
.drawer {
  position: fixed; z-index: 31;
  top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100vw - 24px));
  border-radius: 24px; padding: 14px; background: var(--glass-strong);
  display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
  transform: translateX(calc(-100% - 24px)); visibility: hidden;
  transition: transform .45s var(--ease), visibility 0s linear .45s;
}
body.menu-open .scrim { opacity: 1; pointer-events: auto; }
body.menu-open .drawer { transform: none; visibility: visible; transition: transform .45s var(--ease), visibility 0s; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px 10px; }
.drawer-head b { font-family: var(--display); font-weight: 600; font-size: 17px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 4px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 14px; text-decoration: none; font-weight: 600;
  transition: background .25s var(--ease); opacity: 0; transform: translateX(-10px); }
.nav a svg { width: 20px; height: 20px; stroke-width: 1.8; color: var(--muted); flex: none; transition: color .25s; }
.nav a .ext { margin-left: auto; width: 15px; height: 15px; }
.nav a:hover { background: var(--hover); }
.nav a:hover svg, .nav a[aria-current="page"] svg { color: var(--accent); }
.nav a[aria-current="page"] { background: var(--active); }
body.menu-open .nav a { opacity: 1; transform: none; transition: opacity .4s var(--ease) calc(var(--i) * 40ms + 120ms), transform .4s var(--ease) calc(var(--i) * 40ms + 120ms), background .25s var(--ease); }
.drawer-foot { margin-top: auto; padding: 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- Tartalom ---------- */
main {
  position: relative; z-index: 1;
  padding-top: calc(112px + env(safe-area-inset-top, 0px)); padding-bottom: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.page { width: min(860px, 100%); display: flex; flex-direction: column; gap: 16px; }
.greet { text-align: center; animation: rise .7s var(--ease) both; }
.greet h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4vw, 32px); text-wrap: balance; }
.greet p { margin: 2px 0 0; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* Szigetek */
.islands { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; }
.island {
  --tone: var(--naplo); --tone-soft: var(--naplo-soft);
  position: relative; display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 26px; text-decoration: none;
  animation: rise .8s var(--ease) both; animation-delay: calc(var(--i) * 90ms + 150ms);
  transition: transform .35s var(--ease), border-color .35s var(--ease);
}
.island.valk { --tone: var(--valk); --tone-soft: var(--valk-soft); }
.island::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(120% 70% at 0% 0%, var(--tone-soft), transparent 60%); transition: opacity .35s var(--ease); }
.island:hover { transform: translateY(-4px); border-color: color-mix(in srgb, var(--tone) 45%, var(--glass-line)); }
.island:active { transform: translateY(-1px) scale(.99); }
.island .head { position: relative; display: flex; align-items: center; gap: 14px; }
.island .ico { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; background: var(--tone-soft); color: var(--tone); flex: none; }
.island .ico svg { width: 24px; height: 24px; stroke-width: 1.8; }
.island h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 19px; line-height: 1.2; }
.island .sub { color: var(--muted); font-size: 14px; }
.island .go { margin-left: auto; color: var(--muted); transition: transform .35s var(--ease), color .35s; }
.island .go svg { width: 20px; height: 20px; }
.island:hover .go { transform: translateX(4px); color: var(--tone); }
.island ul { position: relative; list-style: none; margin: 0; padding: 12px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; font-size: 14.5px; }
.island li { display: flex; align-items: flex-start; gap: 10px; }
.island li svg { width: 16px; height: 16px; color: var(--muted); flex: none; stroke-width: 2; margin-top: 3px; }
.island li.alert svg { color: var(--tone); }
.island li.good svg { color: var(--ok); }
.island li b { font-variant-numeric: tabular-nums; }
.island .dim { color: var(--muted); }
.island .foot { position: relative; font-size: 12.5px; color: var(--muted); }
.skeleton { height: 14px; border-radius: 7px; background: var(--hover); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .45; } }

.progress { position: relative; display: flex; align-items: center; gap: 12px; font-size: 13.5px; color: var(--muted); }
.progress .track { flex: 1; height: 8px; border-radius: 99px; background: var(--hover); overflow: hidden; }
.progress .track i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, color-mix(in srgb, var(--tone) 50%, transparent), var(--tone)); transition: width 1.2s var(--ease); }
.progress b { color: var(--text); font-variant-numeric: tabular-nums; }

.badge { position: absolute; top: -8px; right: -6px; z-index: 2; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px;
  display: grid; place-items: center; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums;
  background: var(--tone); color: var(--badge-ink); box-shadow: 0 0 0 3px var(--bg), 0 6px 16px color-mix(in srgb, var(--tone) 45%, transparent);
  animation: pop .5s var(--ease) both; }
.badge::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid var(--tone); animation: ping 2.4s var(--ease) 1s infinite; }
@keyframes pop { from { transform: scale(0); } }
@keyframes ping { 0% { transform: scale(1); opacity: .7; } 70%, 100% { transform: scale(1.8); opacity: 0; } }

/* Projektek, beállítások, belépés */
.card { border-radius: 24px; padding: 20px; animation: rise .6s var(--ease) both; }
.card h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 18px; }
.muted { color: var(--muted); }
.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; align-items: start; }
.pcard { border-radius: 22px; animation: rise .6s var(--ease) both; animation-delay: calc(var(--i) * 60ms); }
.pcard > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--hover); color: var(--text); flex: none; }
.pcard .ico svg { width: 20px; height: 20px; }
.pcard b { font-family: var(--display); font-weight: 600; display: block; }
.pcard small { color: var(--muted); }
.pcard .chev { margin-left: auto; color: var(--muted); transition: transform .3s var(--ease); flex: none; }
.pcard[open] .chev { transform: rotate(90deg); }
.pcard ul { list-style: none; margin: 0; padding: 4px 10px 10px; border-top: 1px solid var(--line); }
.pcard li a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 8px; border-radius: 10px; text-decoration: none; }
.pcard li a:hover { background: var(--hover); }
.pcard li small { white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 0 7px; margin-left: 4px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--hover); color: var(--muted); }
.search { width: 100%; min-height: 48px; padding: 0 16px 0 44px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-strong); }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input { min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--glass-strong); font-weight: 600; cursor: pointer; text-decoration: none; transition: transform .2s var(--ease), border-color .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--text) 30%, transparent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn svg { width: 18px; height: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 600; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.err { color: var(--bad); font-weight: 600; margin: 0; }
.gate { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: none;
  padding: 12px 18px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; box-shadow: var(--shadow); }
.demo-bar { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: 12px; background: #e9a92b; color: #1b1200; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 999px; }

@media (prefers-reduced-motion: reduce) {
  .topbar, .island, .badge, .badge::after, .greet, .card, .pcard, .skeleton { animation: none; }
  .drawer, .scrim, .nav a, body.menu-open .nav a, .island, .island .go, .progress .track i { transition: none; }
}
@media (max-width: 480px) { .title { font-size: 17px; } }
</style>
</head>
<body>
<canvas id="silk" aria-hidden="true"></canvas>
<div id="demo" class="demo-bar" hidden>DEMÓ – mintaadatok</div>

<header class="topbar glass">
  <button class="icon-btn" id="menuBtn" type="button" aria-label="Menü megnyitása" aria-expanded="false" aria-controls="drawer"><i data-lucide="menu"></i></button>
  <h1 class="title"><a href="#/">BREMAT <span>Központ</span></a></h1>
</header>

<div class="scrim" id="scrim"></div>
<aside class="drawer glass" id="drawer" aria-label="Főmenü">
  <div class="drawer-head">
    <b>Menü</b>
    <button class="icon-btn" id="menuClose" type="button" aria-label="Menü bezárása"><i data-lucide="x"></i></button>
  </div>
  <nav class="nav">
    <a href="#/" data-view="#/" style="--i:0"><i data-lucide="house"></i>Kezdőlap</a>
    <a href="#/projektek" data-view="#/projektek" style="--i:1"><i data-lucide="folder-kanban"></i>Projektek</a>
    <span class="label">Oldalak</span>
    <a href="/naplo/" style="--i:2"><i data-lucide="notebook-pen"></i>Munkanapló</a>
    <a href="/valk/" style="--i:3"><i data-lucide="clipboard-check"></i>Valk heti lap</a>
    <a href="/valk/#/uj" style="--i:4"><i data-lucide="clipboard-pen"></i>Új heti lap kitöltése</a>
    <a id="privLink" href="#" target="_blank" rel="noopener" style="--i:5" hidden><i data-lucide="lock"></i>Saját oldalak<i class="ext" data-lucide="arrow-up-right"></i></a>
    <span class="label">Egyéb</span>
    <a href="#/beallitasok" data-view="#/beallitasok" style="--i:6"><i data-lucide="settings"></i>Beállítások</a>
  </nav>
  <div class="drawer-foot">BREMAT · belső eszközök</div>
</aside>

<main id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>

<script type="module">
/* =====================================================================
   0. Régi címek: a heti lap a /valk/ címre költözött (régi könyvjelzők).
   ===================================================================== */
const OLD = /^#\/(uj|lap\/)/;
if (OLD.test(location.hash)) location.replace('/valk/' + location.search + location.hash);

const DEMO = new URLSearchParams(location.search).has('demo');
const ROBOT = 'Valk robot';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* nincs tárolás */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* nincs tárolás */ } },
};
const icons = () => { if (window.lucide) lucide.createIcons(); };
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(() => { t.style.display = 'none'; }, 2600); }

// Téma: alapból világos; a Beállításokban sötétre váltható (eszközönként megjegyzi)
const applyTheme = () => {
  const dark = store.get('kozpont-tema') === 'sotet' || new URLSearchParams(location.search).get('tema') === 'sotet';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name="theme-color"]').content = dark ? '#0b0c0e' : '#eceef2';
};
applyTheme();

/* =====================================================================
   1. A háttér: hajlított „selyemszalagok” – a videókártya rajzolja (WebGL).
   Egy kis program (shader) minden képpontra kiszámolja: melyik szalagon
   van, és az hol jár a hajlatában. A szalag felső széle alatt árnyék, az
   alsó szélén vékony fényes él – ettől néz ki egymásra boruló anyagnak.
   Teljes felbontás, 60 kép/mp, élsimítással; rejtett lapnál áll.
   ===================================================================== */
const silk = (() => {
  const cv = $('#silk');
  const gl = cv.getContext('webgl', { antialias: false, premultipliedAlpha: false, alpha: false, powerPreference: 'low-power' });
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!gl) { cv.style.display = 'none'; return { redraw() {} }; }   // nincs WebGL: marad a sima háttérszín

  const VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  const FS = `
    #extension GL_OES_standard_derivatives : enable
    precision highp float;
    uniform vec2 res; uniform float time; uniform float dark;

    // A „magasság”: ebből lesznek a szalagok. Ferdén futó, lassan hullámzó felület.
    float field(vec2 q) {
      float t = time * 0.06;
      vec2 r = vec2(q.x * 0.913 + q.y * 0.407, -q.x * 0.407 + q.y * 0.913);   // kb. 24 fokkal elforgatva
      float y = r.y;
      y += 0.22 * sin(r.x * 1.35 + t * 1.3);
      y += 0.11 * sin(r.x * 2.70 - t * 0.9 + r.y * 1.1);
      y += 0.05 * sin(r.x * 4.90 + t * 1.7 - r.y * 0.6);
      return y * 4.2;                         // ennyi szalag fér egy képernyőnyi magasságba
    }
    // Egy szalag színe: halvány árnyalat szalagonként, a szélek felé finom fény-árnyék
    vec3 tint(float i) {
      float k = mod(i, 5.0);
      vec3 L = k < 1.0 ? vec3(.965,.972,.985) : k < 2.0 ? vec3(.935,.968,.975) : k < 3.0 ? vec3(.975,.950,.958)
             : k < 4.0 ? vec3(.948,.958,.980) : vec3(.978,.968,.952);
      vec3 D = k < 1.0 ? vec3(.105,.112,.125) : k < 2.0 ? vec3(.075,.118,.135) : k < 3.0 ? vec3(.135,.080,.090)
             : k < 4.0 ? vec3(.085,.100,.135) : vec3(.120,.100,.085);
      return mix(L, D, dark);
    }
    vec3 shade(float b) {
      float i = floor(b), f = fract(b);               // f: 0 = a szalag alsó (fényes) széle, 1 = a teteje
      vec3 c = tint(i);
      float body = 0.90 + 0.10 * sin(f * 3.14159);    // a szalag közepe kicsit domborúbb
      float shadow = pow(smoothstep(0.55, 1.0, f), 2.2); // a fölötte lévő szalag árnyéka
      float rim = exp(-f * 28.0);                     // vékony fényes él
      vec3 col = c * body;
      col *= 1.0 - shadow * mix(0.15, 0.55, dark);
      col += rim * mix(0.10, 0.05, dark);
      return col;
    }
    void main() {
      vec2 q = (gl_FragCoord.xy - 0.5 * res) / res.y;
      float b = field(q);
      float w = fwidth(b);                            // egy képpont mennyi „szalagnyi” – ennyivel simítunk
      vec3 col = 0.25 * (shade(b - 0.75 * w) + shade(b - 0.25 * w) + shade(b + 0.25 * w) + shade(b + 0.75 * w));
      // nagyon halvány szemcse, hogy a színátmenetek ne csíkozódjanak
      float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }`;
  gl.getExtension('OES_standard_derivatives');
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn('Háttér: a shader nem fordult le'); cv.style.display = 'none'; return { redraw() {} }; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);   // egy nagy háromszög, ami lefedi a képet
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(prog, 'res'), uTime = gl.getUniformLocation(prog, 'time'), uDark = gl.getUniformLocation(prog, 'dark');

  let raf = 0; const t0 = performance.now();
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);   // éles kijelzőn is éles, de max. 2×
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  function draw(sec) {
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uTime, sec);
    gl.uniform1f(uDark, document.documentElement.dataset.theme === 'dark' ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  function frame(now) { draw((now - t0) / 1000); raf = requestAnimationFrame(frame); }
  function start() { cancelAnimationFrame(raf); if (calm) draw(20); else raf = requestAnimationFrame(frame); }
  resize(); start();
  addEventListener('resize', () => { resize(); if (calm) draw(20); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
  return { redraw: () => { if (calm) draw(20); } };
})();

/* =====================================================================
   2. Adatréteg – mindhárom szerverfüggvény ugyanúgy működik:
   POST kérés JSON-nal, benne a művelet (action) és a belépési kód.
   ===================================================================== */
class AccessError extends Error {}
async function post(url, action, payload, code) {
  let res;
  try { res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, code, ...payload }), cache: 'no-store' }); }
  catch { throw new Error('Nincs kapcsolat a szerverrel.'); }
  let body = null; try { body = await res.json(); } catch { /* nem JSON */ }
  if (res.status === 401) throw new AccessError(body?.error || 'Hibás hozzáférési kód');
  if (!res.ok) throw new Error(body?.error || `Szerverhiba (${res.status})`);
  return body?.data;
}
const kmCode = () => store.get('km-kod') || '';
const naploCode = () => store.get('naplo-kod') || store.get('km-kod') || '';
const live = {
  ping: (code) => post('/api/kozpont', 'ping', {}, code),
  projects: () => post('/api/kozpont', 'projects', {}, kmCode()),
  checks: () => post('/api/km', 'list', {}, kmCode()),
  idle: () => post('/api/km', 'idle_list', {}, kmCode()),
  week: (from, to) => post('/api/naplo', 'range', { from, to }, naploCode()),
  todo: () => post('/api/naplo', 'todo_status', {}, naploCode()),
};

/* ---------- Dátum (budapesti idő) ---------- */
const ymdFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => ymdFmt.format(new Date());
const toDate = (ymd) => new Date(ymd + 'T00:00:00Z');
const addDays = (ymd, n) => { const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = (ymd) => addDays(ymd, -((toDate(ymd).getUTCDay() + 6) % 7));
function isoWeek(ymd) {
  const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const year = d.getUTCFullYear(), jan4 = new Date(Date.UTC(year, 0, 4));
  return { year, week: 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7) };
}
const huLong = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'long', day: 'numeric', weekday: 'long' });
const huShort = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const hhmm = (iso) => new Date(iso).toLocaleTimeString('hu-HU', { timeZone: 'Europe/Budapest', hour: '2-digit', minute: '2-digit' });
function fmtDur(ms) { const m = Math.floor(ms / 60000); if (m < 1) return '<1 p'; const h = Math.floor(m / 60); return h ? `${h} ó ${m % 60} p` : `${m} p`; }

function demoApi() {
  const m = mondayOf(today()), w = isoWeek(today());
  const mk = (d, who, a, s, appr, escl) => ({ id: 'demo-' + d, check_date: d, ...(({ year, week }) => ({ iso_year: year, iso_week: week }))(isoWeek(d)), robot: ROBOT, inspector: who, action_count: a, skip_count: s, approved_by: appr ? 'Nagy Béla' : null, escalate: !!escl });
  const d = (v) => new Promise((r) => setTimeout(() => r(structuredClone(v)), 250));
  return {
    ping: () => d(true),
    projects: () => d({ private_index: '#', projects: [
      { key: 'tokmany', name: 'Tokmány vagy lemez', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Lemez vagy tokmány', u: '#', d: '2026-11-04' }, { t: 'Vastag lemez 3D', u: '#', d: '2026-10-29', k: ['3D'] }] },
      { key: 'adapter', name: 'Univerzális adapter és befogó', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Univerzális adapter', u: '#', d: '2026-10-19' }] } ] }),
    checks: () => d([mk(addDays(m, -7), 'Tóth Ádám', 1, 1, false, true), mk(addDays(m, -14), 'Kovács Gábor', 2, 0, false), mk(addDays(m, -21), 'Tóth Ádám', 0, 0, true)]),
    idle: () => d([]),
    week: () => d([1, 2, 3, 4, 5].map((i) => ({ id: String(i), date: m, text: i < 6 ? `Kész: minta ${i}` : 'x' }))),
    todo: () => d({ open: 5, starred: 3, doing: [{ text: '3100.0610 új kialakítás', spent_ms: 3600000, started_at: Date.now() - 720000 }], updated_at: new Date(Date.now() - 300000).toISOString() }),
  };
}
const api = DEMO ? demoApi() : live;

/* =====================================================================
   3. Belépés
   ===================================================================== */
(function codeFromUrl() {
  const u = new URL(location.href); const k = u.searchParams.get('kod');
  if (k) { store.set('km-kod', k.trim()); u.searchParams.delete('kod'); history.replaceState(null, '', u.pathname + u.search + u.hash); }
})();
function renderGate(msg = '') {
  $('#menuBtn').hidden = true;
  $('#app').innerHTML = `
    <form class="gate card glass" id="gateForm">
      <h2>Belépés</h2>
      <p class="muted" style="margin:0">Írd be a hozzáférési kódot. Ezen az eszközön megjegyzi.</p>
      ${msg ? `<p class="err">${esc(msg)}</p>` : ''}
      <label class="field"><span>Hozzáférési kód</span><input id="gateCode" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label>
      <button class="btn primary" type="submit"><i data-lucide="log-in"></i>Belépés</button>
    </form>`;
  icons(); $('#gateCode').focus();
  $('#gateForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const code = $('#gateCode').value.trim();
    try { await api.ping(code); store.set('km-kod', code); route(); }
    catch (err) { renderGate(err instanceof AccessError ? 'Hibás hozzáférési kód.' : err.message); }
  });
}
async function guarded(fn) {
  try { return await fn(); } catch (e) {
    if (e instanceof AccessError) { store.del('km-kod'); renderGate('A kód nem érvényes. Írd be újra.'); }
    throw e;
  }
}

function setMenu(open) {

  $('#menuBtn').setAttribute('aria-expanded', String(open));
  if (open) $('#menuClose').focus();
}
$('#menuBtn').addEventListener('click', () => setMenu(true));
$('#menuClose').addEventListener('click', () => setMenu(false));

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });

/* =====================================================================
   5. Kezdőlap: a két sziget
   Jelvény = a figyelmet kérő tételek összege (alert: true, n: darab).
   ===================================================================== */
function islandShell(id, cls, icon, title, sub, href, i) {
  return `<a class="island ${cls} glass" id="${id}" href="${href}" style="--i:${i}">
    <span class="badge" hidden></span>
    <div class="head"><span class="ico"><i data-lucide="${icon}"></i></span>
      <div><h2>${title}</h2><span class="sub">${sub}</span></div>
      <span class="go"><i data-lucide="arrow-right"></i></span></div>
    <div class="progress" hidden><div class="track"><i></i></div><span></span></div>
    <ul><li><div class="skeleton" style="width:80%"></div></li><li><div class="skeleton" style="width:60%"></div></li></ul>
    <span class="foot"></span>
  </a>`;
}
function fillIsland(el, d) {
  el.querySelector('ul').innerHTML = d.items.map((it) =>
    `<li class="${it.alert ? 'alert' : it.good ? 'good' : ''}"><i data-lucide="${it.icon}"></i><span>${it.html}</span></li>`).join('');
  const n = d.items.filter((it) => it.alert).reduce((s, it) => s + (it.n ?? 1), 0);
  const b = el.querySelector('.badge'); b.hidden = n === 0; b.textContent = n > 9 ? '9+' : n; b.setAttribute('aria-label', `${n} értesítés`);
  const bar = el.querySelector('.progress');
  if (d.progress) {
    const { done, left } = d.progress; bar.hidden = false;
    bar.querySelector('span').innerHTML = `<b>${done}</b> kész · <b>${left}</b> hátra`;
    requestAnimationFrame(() => { bar.querySelector('i').style.width = Math.round(done / Math.max(1, done + left) * 100) + '%'; });
  }
  el.querySelector('.foot').textContent = d.foot || '';
  icons();
}

let tickTimer = null;
function renderHome() {
  const t = today(), { year, week } = isoWeek(t);
  const hour = Number(new Date().toLocaleString('en-GB', { timeZone: 'Europe/Budapest', hour: '2-digit', hour12: false }));
  const hello = hour < 10 ? 'Jó reggelt!' : hour < 18 ? 'Jó munkát!' : 'Szép estét!';
  $('#app').innerHTML = `<div class="page">
    <div class="greet"><h1>${hello}</h1><p>${esc(huLong.format(toDate(t)))} · ${year}. ${week}. hét</p></div>
    <div class="islands">
      ${islandShell('isNaplo', 'naplo', 'notebook-pen', 'Munkanapló', 'Teendők és bejegyzések', '/naplo/', 0)}
      ${islandShell('isValk', 'valk', 'clipboard-check', 'Valk heti lap', 'Robot karbantartás', '/valk/', 1)}
    </div></div>`;
  icons();
  loadNaplo().catch(() => {});
  loadValk().catch(() => {});
}

// --- Munkanapló sziget: a heti „Kész:” bejegyzések + a Teendőim állapota ---
async function loadNaplo() {
  const el = $('#isNaplo'); const t = today(), mon = mondayOf(t);
  let rows, st;
  try { [rows, st] = await Promise.all([api.week(mon, addDays(mon, 6)), api.todo()]); }
  catch (e) {
    fillIsland(el, { items: [{ icon: e instanceof AccessError ? 'lock' : 'wifi-off', html: e instanceof AccessError ? 'A napló külön kóddal védett – koppints a belépéshez.' : esc(e.message) }] });
    return;
  }
  const done = rows.filter((r) => /^Kész:/.test(r.text)).length;
  const items = [{ icon: 'circle-check-big', html: `Ezen a héten eddig <b>${done}</b> kész feladat`, good: done > 0 }];
  if (st) {
    items.push({ icon: 'list-todo', html: `Hátralévő feladatok: <b>${st.open}</b>` });
    (st.doing || []).slice(0, 2).forEach((x) => items.push({ icon: 'timer', html: `Folyamatban: ${esc(x.text)} <span class="dim" data-run="${x.started_at || ''}" data-spent="${x.spent_ms}">· ${fmtDur(x.spent_ms + (x.started_at ? Date.now() - x.started_at : 0))}</span>` }));
    if ((st.doing || []).length > 2) items.push({ icon: 'timer', html: `<span class="dim">+${st.doing.length - 2} további fut</span>` });
    if (st.starred) items.push({ icon: 'star', html: `Fontos és még nincs kész: <b>${st.starred}</b>`, alert: true, n: st.starred });
  } else {
    items.push({ icon: 'info', html: '<span class="dim">A Teendőim még nem küldött állapotot. (Teendőim → menü → Munkanapló)</span>' });
  }
  fillIsland(el, { items, progress: st ? { done, left: st.open + (st.doing || []).length } : null, foot: st ? `Teendőim: frissítve ${hhmm(st.updated_at)}` : '' });
  // A futó teendő ideje percenként frissül
  clearInterval(tickTimer);
  tickTimer = setInterval(() => $$('[data-run]').forEach((s) => { if (s.dataset.run) s.textContent = '· ' + fmtDur(Number(s.dataset.spent) + Date.now() - Number(s.dataset.run)); }), 30000);
}

// --- Valk sziget: e heti lap, jóváhagyásra vár, nyitott továbbjelzés ---
async function loadValk() {
  const el = $('#isValk');
  const [checks, idle] = await guarded(() => Promise.all([api.checks(), api.idle()]));
  const { year, week } = isoWeek(today());
  const mine = checks.filter((r) => r.robot === ROBOT);
  const thisWeek = mine.find((r) => r.iso_year === year && r.iso_week === week);
  const idleNow = idle.find((x) => x.robot === ROBOT && x.iso_year === year && x.iso_week === week);
  const unapproved = mine.filter((r) => !r.approved_by).length;
  const openEsc = mine.filter((r) => r.escalate && !r.approved_by).length;
  const items = [];
  if (thisWeek) items.push({ icon: 'circle-check-big', html: `A ${week}. heti lap kitöltve – ${esc(thisWeek.inspector)}, ${huShort.format(toDate(thisWeek.check_date))}`, good: true });
  else if (idleNow) items.push({ icon: 'pause-circle', html: `A ${week}. héten nem üzemelt` });
  else items.push({ icon: 'circle-alert', html: `A <b>${week}.</b> heti lap még nincs kitöltve`, alert: true });
  items.push(unapproved ? { icon: 'stamp', html: `<b>${unapproved}</b> lap jóváhagyásra vár`, alert: true, n: unapproved } : { icon: 'stamp', html: 'Minden lap jóváhagyva', good: true });
  if (openEsc) items.push({ icon: 'triangle-alert', html: `<b>${openEsc}</b> nyitott továbbjelzés`, alert: true, n: openEsc });
  fillIsland(el, { items, foot: `${mine.length} beküldött lap összesen` });
  if (!thisWeek && !idleNow) el.href = '/valk/#/uj';   // ha még nincs kész, egyből a kitöltésre visz
}

/* =====================================================================
   6. Projektek (a lista a szerverről jön, csak kóddal)
   ===================================================================== */
const PICONS = { tokmany: 'cylinder', adapter: 'puzzle', hegesztett: 'flame', muhely: 'wrench' };
let projCache = null;
const loadProjects = async () => (projCache ||= await guarded(() => api.projects()));
async function renderProjects() {
  $('#app').innerHTML = `<div class="page">
    <div class="greet"><h1>Projektek</h1><p>Koppints egy projektre, és lenyílnak az oldalai.</p></div>
    <div class="search-wrap"><i data-lucide="search"></i><input class="search" id="pq" type="search" placeholder="Keresés: tokmány, 3D, 2950…" autocomplete="off"></div>
    <div class="proj" id="projBody"><div class="card glass"><div class="skeleton" style="width:60%"></div></div></div></div>`;
  icons();
  const { projects } = await loadProjects();
  const plain = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const draw = () => {
    const words = plain($('#pq').value).split(/\s+/).filter(Boolean);
    const list = projects.map((g) => ({ ...g, items: g.items.filter((it) => words.every((w) => plain(`${it.t} ${(it.k || []).join(' ')} ${g.name}`).includes(w))) })).filter((g) => g.items.length);
    $('#projBody').innerHTML = list.length ? list.map((g, i) => `
      <details class="pcard glass" style="--i:${i}" ${words.length ? 'open' : ''}>
        <summary><span class="ico"><i data-lucide="${PICONS[g.key] || 'folder'}"></i></span>
          <span><b>${esc(g.name)}</b><small>${g.items.length} oldal${g.about ? ' · ' + esc(g.about) : ''}</small></span>
          <i class="chev" data-lucide="chevron-right"></i></summary>
        <ul>${g.items.map((it) => `<li><a href="${esc(it.u)}" target="_blank" rel="noopener"><span>${esc(it.t)}${(it.k || []).map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</span>${it.d ? `<small class="muted">${huShort.format(toDate(it.d))}</small>` : ''}</a></li>`).join('')}</ul>
      </details>`).join('') : `<div class="card glass"><p class="muted" style="margin:0">Nincs találat.</p></div>`;
    icons();
  };
  $('#pq').addEventListener('input', draw); draw();
}

/* =====================================================================
   8. Útvonalak: a cím # utáni része dönti el, melyik nézet látszik
   ===================================================================== */
const VIEWS = { '#/projektek': renderProjects, '#/beallitasok': renderSettings };
function route() {
  if (OLD.test(location.hash)) return location.replace('/valk/' + location.search + location.hash);
  if (!DEMO && !kmCode()) return renderGate();
  $('#menuBtn').hidden = false;
  const key = VIEWS[location.hash] ? location.hash : '#/';
  $$('.nav a[data-view]').forEach((a) => a.toggleAttribute('aria-current', a.dataset.view === key));
  $$('.nav a[aria-current]').forEach((a) => a.setAttribute('aria-current', 'page'));
  clearInterval(tickTimer); window.scrollTo(0, 0);
  Promise.resolve().then(VIEWS[key] || renderHome).catch((e) => { if (!(e instanceof AccessError)) console.error(e); });
  loadProjects().then((p) => { if (p.private_index) { const a = $('#privLink'); a.href = p.private_index; a.hidden = false; } }).catch(() => {});
}
$('#demo').hidden = !DEMO;
icons();
addEventListener('hashchange', route);
route();
