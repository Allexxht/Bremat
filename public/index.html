// --- Nyitó animáció ---
// A napi első megnyitáskor (utána legfeljebb 2,5 óránként) lemegy a videó: a konténer felépül,
// felkerül a kamionra, a kamion elhúz – és mögötte a kígyós vonal kirajzolja a BREMAT logót.
// Máskor csak a kész logó látszik. Koppintásra átugorható.
const INTRO_SRC = '/kozpont/intro.webm', LOGO_AT = 8.5;   // a videóban ekkor indul el a kamion
const LOGO_FROM = { x: 0.5, y: 0.47, w: 0.34 };   // kicsiben középen, a plató mögött bújik elő, onnan nő fel a helyére
const LOGO_FS = 236, LOGO_Y = 238, LOGO_X0 = 64;
const LOGO_PATHS = {   // a betűk vázvonala a betű „tinta-dobozában” (0–1): ezen fut a kígyó
  B: 'M.2,1 L.2,0 L.62,0 Q.94,0 .94,.25 Q.94,.48 .62,.48 L.2,.48 L.66,.48 Q1,.5 1,.75 Q1,1 .66,1 L.2,1',
  R: 'M.2,1 L.2,0 L.62,0 Q.95,0 .95,.27 Q.95,.52 .62,.52 L.2,.52 L.55,.52 L.95,1',
  E: 'M.95,0 L.17,0 L.17,1 L.95,1 M.17,.5 L.85,.5',
  M: 'M.12,1 L.12,0 L.5,.78 L.88,0 L.88,1',
  A: 'M.03,1 L.5,0 L.97,1 M.25,.7 L.75,.7',
  T: 'M0,.12 L1,.12 M.5,.12 L.5,1',
};
function buildLogo(svg) {
  const NS = 'http://www.w3.org/2000/svg', FONT = 'Archivo Black, Arial Black, sans-serif';
  const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
  svg.setAttribute('viewBox', '0 -20 1280 430');
  const defs = el('defs', {}, svg);
  const grad = el('linearGradient', { id: 'lgGlint', x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  [[0, 0], [0.42, 0], [0.5, 0.85], [0.58, 0], [1, 0]].forEach(([o, a]) => el('stop', { offset: o, 'stop-color': '#fff', 'stop-opacity': a }, grad));
  const logo = el('g', { class: 'logo' }, svg);
  const meas = el('text', { x: LOGO_X0, y: LOGO_Y, 'font-family': FONT, 'font-size': LOGO_FS, opacity: 0 }, svg);
  meas.textContent = 'BREMAT';
  const c = document.createElement('canvas').getContext('2d'); c.font = `${LOGO_FS}px "Archivo Black"`;
  const cap = c.measureText('B').actualBoundingBoxAscent;
  let inkL = Infinity, inkR = -Infinity;
  const reveals = [...'BREMAT'].map((ch, i) => {
    const x = meas.getStartPositionOfChar(i).x, ink = c.measureText(ch);
    const lx = x - ink.actualBoundingBoxLeft, lw = ink.actualBoundingBoxRight + ink.actualBoundingBoxLeft;
    inkL = Math.min(inkL, lx); inkR = Math.max(inkR, lx + lw);
    const d = LOGO_PATHS[ch].replace(/(-?[\d.]+),(-?[\d.]+)/g, (_, u, v) => `${(lx + u * lw).toFixed(1)},${(LOGO_Y - cap + v * cap).toFixed(1)}`);
    const mask = el('mask', { id: 'lgM' + i, maskUnits: 'userSpaceOnUse', x: -100, y: -100, width: 1500, height: 600 }, defs);
    const reveal = el('path', { d, fill: 'none', stroke: '#fff', 'stroke-width': lw * 0.62, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': 1, 'stroke-dashoffset': 1 }, mask);
    el('text', { x, y: LOGO_Y, 'font-family': FONT, 'font-size': LOGO_FS, fill: 'currentColor', mask: `url(#lgM${i})` }, logo).textContent = ch;
    return reveal;
  });
  const bb = meas.getBBox();
  meas.remove();
  const clip = el('clipPath', { id: 'lgClip' }, defs);
  el('text', { x: LOGO_X0, y: LOGO_Y, 'font-family': FONT, 'font-size': LOGO_FS }, clip).textContent = 'BREMAT';
  const glint = el('rect', { x: -420, y: 40, width: 420, height: 320, fill: 'url(#lgGlint)', opacity: 0 }, el('g', { 'clip-path': 'url(#lgClip)' }, logo));
  // a keret az eredeti logó arányai szerint (h = betűmagasság): a felső vonal épp a betűk fölött,
  // a jobb oldal végig lemegy, az alsó vonal ferdén a bal alsó sarokba, onnan a bal oldal vissza fel
  const h = cap, top = LOGO_Y - cap - 0.17 * h, n = (v) => v.toFixed(1);
  const FRAME = `M${n(inkL)},${n(top)} L${n(inkR + 0.09 * h)},${n(top)} L${n(inkR + 0.12 * h)},${n(LOGO_Y + 0.19 * h)} L${n(inkL + 0.58 * h)},${n(LOGO_Y + 0.77 * h)} Z`;
  const frame = el('path', { d: FRAME, fill: 'none', stroke: 'currentColor', 'stroke-width': n(0.115 * h), 'stroke-linejoin': 'miter', pathLength: 1, 'stroke-dasharray': '1 2', 'stroke-dashoffset': 1 }, svg);
  return () => {   // a lejátszás; visszaadja az animációkat (finish() = azonnal kész állapot)
    const A = (n, kf, delay, dur, easing = 'cubic-bezier(.65,0,.35,1)') => n.animate(kf, { delay: delay * 1000, duration: dur * 1000, easing, fill: 'both' });
    const per = 0.42, gap = 0.15, end = (reveals.length - 1) * gap + per, out = 'cubic-bezier(.2,.9,.2,1)';
    // kezdetben kicsi, a plató mögött (a kamion takarja); ahogy előbukkant, felnő a helyére
    const r = svg.parentNode.getBoundingClientRect(), pt = svg.createSVGPoint();
    pt.x = r.left + LOGO_FROM.x * r.width; pt.y = r.top + LOGO_FROM.y * r.height;
    const m = svg.getScreenCTM(), p = m ? pt.matrixTransform(m.inverse()) : { x: 640, y: 200 };
    const k = m ? (LOGO_FROM.w * r.width) / (bb.width * m.a) : 0.45;
    const cx = bb.x + bb.width / 2, cy = bb.y + bb.height / 2;
    const small = `translate(${(p.x - k * cx).toFixed(1)}px, ${(p.y - k * cy).toFixed(1)}px) scale(${k.toFixed(3)})`;
    const list = [
      ...reveals.map((r, i) => A(r, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], i * gap, per)),
      A(logo, [{ transform: small }, { transform: 'translate(0px, 0px) scale(1)' }], end + 0.15, 1.0, 'cubic-bezier(.45,0,.15,1)'),
      A(frame, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], end + 0.95, 0.95, 'cubic-bezier(.7,0,.25,1)'),
      A(glint, [{ transform: 'translateX(0)', opacity: 1 }, { transform: 'translateX(1800px)', opacity: 1 }], end + 1.85, 0.9, 'cubic-bezier(.5,0,.3,1)'),
    ];
    return list;
  };
}

function introDue() {
  const last = Number(store.get('kozpont-intro')) || 0, now = Date.now();
  const day = (ms) => ymdFmt.format(new Date(ms));
  return !last || day(last) !== day(now) || now - last > 2.5 * 3600e3;
}
// A Safari nem tud átlátszó WebM-et (fekete háttér lenne) – ott a videó kimarad, csak a logó rajzolódik ki.
const alphaVideo = () => !/^((?!chrome|android|crios|fxios|edg).)*safari/i.test(navigator.userAgent) && !!document.createElement('video').canPlayType('video/webm; codecs="vp9"');
async function intro(hero, force = false) {
  if (!hero) return;
  await document.fonts.load(`${LOGO_FS}px "Archivo Black"`).catch(() => {});
  if (!hero.isConnected) return;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.setAttribute('aria-hidden', 'true');
  hero.appendChild(svg);
  const play = buildLogo(svg);
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // kész állapot: a logó áll, és egy koppintás újraindítja az introt
  let done = false, anims = null, raf = 0, video = null;
  const finish = () => {
    if (done) return; done = true;
    hero.removeEventListener('click', skip);
    hero.classList.add('static');
    hero.addEventListener('click', () => { hero.replaceChildren(); hero.classList.remove('static'); intro(hero, true); }, { once: true });
  };
  if (!force && (calm || !introDue())) { play().forEach((a) => a.finish()); return finish(); }
  store.set('kozpont-intro', String(Date.now()));
  // a logó a kamion indulásakor kezd kirajzolódni; ha végigért, jön a kész állapot
  const startLogo = () => {
    if (anims) return;
    anims = play();
    Promise.all(anims.map((a) => a.finished)).then(finish, () => {});
  };
  // lejátszás közben egy koppintás átugorja a végére
  function skip() { cancelAnimationFrame(raf); if (video) { video.pause(); video.style.opacity = 0; } startLogo(); anims.forEach((a) => a.finish()); finish(); }
  hero.addEventListener('click', skip);
  if (!alphaVideo()) return startLogo();   // videó nélkül (Safari): csak a logó rajzolódik ki
  video = document.createElement('video');
  Object.assign(video, { muted: true, playsInline: true, preload: 'auto', src: INTRO_SRC });
  video.setAttribute('aria-hidden', 'true');
  hero.appendChild(video);   // a videó a logó fölött: a kamion eltakarja, mögötte bukkan elő
  const watch = () => { if (!hero.isConnected) return video.pause(); if (video.currentTime >= LOGO_AT) return startLogo(); raf = requestAnimationFrame(watch); };
  video.addEventListener('error', startLogo, { once: true });
  video.addEventListener('ended', startLogo, { once: true });
  video.play().then(() => { raf = requestAnimationFrame(watch); }, startLogo);
}

      return `<div class="idea-row glass ${r.status}" data-id="${esc(r.id)}" style="--i:${Math.min(i, 12)}">
        <button class="tick" type="button" data-a="tick" ${r.status === 'elvetve' ? 'disabled' : ''} aria-label="${r.status === 'kesz' ? 'Mégsem valósult meg' : 'Megvalósult'}" title="${r.status === 'kesz' ? 'Visszavonás' : 'Kipipálás: megvalósult'}"><i data-lucide="check"></i></button>
        <div class="txt">${esc(r.text)}</div>
        <div class="meta"><span class="pill ${r.status}"><i data-lucide="${st.icon}" style="width:13px;height:13px"></i>${st.t}</span><span>felírva ${fmt(r.created_at)}</span>${when ? `<span>· ${when}</span>` : ''}</div>
        ${ed ? '' : why}${ed ? editBox : `<div class="acts">${acts}</div>`}
      </div>`;
    }).join('') : `<div class="card glass"><p class="muted" style="margin:0">${rows.length ? 'Ebben a szűrőben nincs ötlet.' : 'Még nincs ötlet. Írd be fent az elsőt.'}</p></div>`;
    icons();
    const ta = $('#iList textarea'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  };
  const save = async (id, patch, msg) => {
    try { const r = await guarded(() => api.ideaUpdate(id, patch)); rows = rows.map((x) => (x.id === id ? r : x)); editing = null; draw(); if (msg) toast(msg); }
    catch (e) { if (!(e instanceof AccessError)) toast(e.message); }
  };
  $('#iFilters').addEventListener('click', (e) => { const b = e.target.closest('[data-f]'); if (b) { ideaFilter = b.dataset.f; draw(); } });
  $('#iList').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const id = b.closest('[data-id]').dataset.id, r = rows.find((x) => x.id === id), a = b.dataset.a;
    if (a === 'tick') return save(id, { status: r.status === 'kesz' ? 'nyitott' : 'kesz' }, r.status === 'kesz' ? 'Visszatéve a nyitottak közé.' : 'Szép! Megvalósult.');
    if (a === 'doing') return save(id, { status: 'folyamatban' });
    if (a === 'pause') return save(id, { status: 'nyitott' });
    if (a === 'reopen') return save(id, { status: 'nyitott', reason: '' }, 'Visszatéve a nyitottak közé.');
    if (a === 'reject' || a === 'edit') { editing = { id, mode: a }; return draw(); }
    if (a === 'cancel') { editing = null; return draw(); }
    if (a === 'del') {
      if (!confirm('Biztosan törlöd ezt az ötletet?\n\n' + short(r.text, 120))) return;
      try { await guarded(() => api.ideaDelete(id)); rows = rows.filter((x) => x.id !== id); editing = null; draw(); toast('Törölve.'); }
      catch (err) { if (!(err instanceof AccessError)) toast(err.message); }
    }
  });
  $('#iList').addEventListener('submit', (e) => {
    e.preventDefault(); const f = e.target, id = f.closest('[data-id]').dataset.id;
    const reason = f.reason.value.trim();
    if (f.dataset.form === 'reject') return save(id, { status: 'elvetve', reason }, 'Rendben, félretéve.');
    const text = f.text.value.trim(); if (!text) return toast('Az ötlet nem lehet üres.');
    save(id, { text, reason }, 'Elmentve.');
  });
  $('#iList').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.form) e.target.form.requestSubmit(); });
  $('#iText').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('#ideaForm').requestSubmit(); });
  $('#ideaForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const t = $('#iText').value.trim(); if (!t) return $('#iText').focus();
    const btn = e.target.querySelector('button[type=submit]'); btn.disabled = true;
    try { const r = await guarded(() => api.ideaAdd(t)); rows = [r, ...rows.filter((x) => x.id !== r.id)]; $('#iText').value = ''; if (ideaFilter !== 'mind' && ideaFilter !== 'nyitott') ideaFilter = 'mind'; draw(); toast('Felírva.'); }
    catch (err) { if (!(err instanceof AccessError)) toast(err.message); }
    finally { btn.disabled = false; $('#iText').focus(); }
  });
  draw();
  $('#iText').focus();
}

/* =====================================================================
   5c. Robot programok (#/teszt) – 3. változat (2026. nov. 26., Alex)
   A termékek, részek, verziók a DTPS mappából jönnek (a Teendőim percenként
   küldi a neveket). Itt: mi vár tesztre, mit kell javítani, mi kész – és a
   „Megnyitás DTPS-ben” gomb (a helyi Központ indítja a gépen).
   A logika a közös /programteszt.js-ben (a szerver is azt használja).
   ===================================================================== */
const huDay = new Intl.DateTimeFormat('hu-HU', { timeZone: 'Europe/Budapest', month: 'short', day: 'numeric' });
function whenText(iso) {
  if (!iso) return '';
  const d = new Date(iso), ymd = ymdFmt.format(d);
  if (ymd === today()) return `ma, ${hhmm(iso)}`;
  if (ymd === addDays(today(), -1)) return `tegnap, ${hhmm(iso)}`;
  return huDay.format(d);
}
const stHtml = (x) => { const s = stateOf(x); return `<span class="st ${s.k}" style="--c:${s.color}${s.k === 'custom' ? `;color:${s.color}` : ''}">${esc(s.t)}</span>`; };
const customNums = (s) => s.customs.map((c) => `<span style="color:${c.color}"><b>${c.n}</b> ${esc(c.t.toLowerCase())}</span>`).join('');
const ptOrder = (p) => { const s = summary(p); return s.fix || s.wait || s.tweak ? 0 : s.parts ? 1 : 2; };
// --- Időmérés: közös darabok (lista, termék, statisztika) ---
const TK_COLOR = { prog: 'var(--tm-prog)', kint: 'var(--tm-kint)', test: 'var(--tm-test)' };
const pad2 = (n) => String(n).padStart(2, '0');
const clockTxt = (ms) => { const x = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(x / 3600); return h ? `${h}:${pad2(Math.floor(x % 3600 / 60))}:${pad2(x % 60)}` : `${Math.floor(x / 60)}:${pad2(x % 60)}`; };
const durTxt = (ms) => { const m = Math.round(ms / 60000); if (m < 1) return ms > 0 ? '<1 p' : '0 p'; const h = Math.floor(m / 60); return h ? `${h} ó ${pad2(m % 60)} p` : `${m} p`; };
const LONG_RUN = 30 * 60000;   // ennyi után rákérdez, hogy megy-e még
const runSnooze = (id) => Number(store.get('tm-ok-' + id) || 0);
/** Az összes futó óra (egyszerre általában egy). */
const runsOf = (products) => products.map((p) => { const e = runningOf(p); return e ? { p, e, part: p.parts.find((x) => x.id === e.part) } : null; }).filter(Boolean);
let ptTick = null;   // másodpercenként frissíti a futó órákat ([data-since]) és a „még megy?” kérdést ([data-long])
function startPtTick() {
  clearInterval(ptTick);
  ptTick = setInterval(() => {
    const now = Date.now();
    $$('[data-since]').forEach((el) => { el.textContent = clockTxt(now - Number(el.dataset.since)); });
    $$('[data-long]').forEach((el) => {
      const on = now >= Number(el.dataset.long);
      if (on && !el.classList.contains('long')) {   // most vált át: a „mikor hagytad abba” alapból az indulás + 30 perc
        const inp = el.querySelector('input[type="time"]');
        if (inp && !inp.dataset.touched) inp.value = new Date(Math.min(now, Number(inp.dataset.from) + LONG_RUN)).toLocaleTimeString('hu-HU', { timeZone: 'Europe/Budapest', hour: '2-digit', minute: '2-digit' });
      }
      el.classList.toggle('long', on);
    });
  }, 1000);
}
/** Budapesti idő → ms (a nyári/téli időt a böngésző tudja). */
function budaTime(ymd, h, m) {
  const guess = Date.parse(`${ymd}T${pad2(h)}:${pad2(m)}:00Z`);
  const d = new Date(guess), loc = new Date(d.toLocaleString('en-US', { timeZone: 'Europe/Budapest' })), utc = new Date(d.toLocaleString('en-US', { timeZone: 'UTC' }));
  return guess - (loc - utc);
}
/** A futó óra sávja: mi megy, mióta, leállítás; 30 perc után rákérdez (elfelejtetted?). */
function runBanner({ p, e, part }, link = true) {
  const from = Date.parse(e.from), longAt = Math.max(from + LONG_RUN, runSnooze(e.id));
  const hm = new Date(Math.min(Date.now(), from + LONG_RUN)).toLocaleTimeString('hu-HU', { timeZone: 'Europe/Budapest', hour: '2-digit', minute: '2-digit' });
  return `<div class="tm-run no-print ${Date.now() >= longAt ? 'long' : ''}" style="--c:${TK_COLOR[e.k]}" data-long="${longAt}">
    <span class="dot"></span>
    <span class="w"><b>${TKINDS[e.k].t} megy</b> · ${esc(part?.name || '?')}<small>${link ? `<a href="#/teszt/${esc(p.id)}">${esc(p.sku)}</a>` : esc(p.sku)} · indult ${hhmm(e.from)}</small></span>
    <b class="t" data-since="${from}">${clockTxt(Date.now() - from)}</b>
    <button type="button" class="solid" data-tm="stop" data-pid="${esc(p.id)}">Leállítás</button>
    <div class="ask"><b>Még megy? Régóta fut az óra.</b>
      <button type="button" data-tm="snooze" data-eid="${esc(e.id)}">Igen, még megy</button>
      <span>Elfelejtettem, ekkor hagytam abba:</span><input type="time" value="${hm}" aria-label="Mikor hagytad abba" data-from="${from}" oninput="this.dataset.touched=1">
      <button type="button" data-tm="stopat" data-pid="${esc(p.id)}">Leállítás ekkor</button></div>
  </div>`;
}
/** A sáv gombjai; done(pid, p) a frissített termékkel hív vissza. true, ha a kattintás a sávé volt. */
async function runBannerClick(ev, done) {
  const b = ev.target.closest('[data-tm]'); if (!b) return false;
  const a = b.dataset.tm, box = b.closest('.tm-run');
  if (a === 'snooze') { const t = Date.now() + LONG_RUN; store.set('tm-ok-' + b.dataset.eid, String(t)); box.dataset.long = String(t); box.classList.remove('long'); return true; }
  let at;
  if (a === 'stopat') {
    const inp = box.querySelector('input[type="time"]'), from = Number(inp.dataset.from);
    const [h, m] = inp.value.split(':').map(Number); if (!Number.isFinite(h) || !Number.isFinite(m)) { inp.focus(); return true; }
    // óra:perc budapesti idő szerint, az indulás napján (ha az korábbi az indulásnál, a következő napon)
    const day = ymdFmt.format(new Date(from)); let t = budaTime(day, h, m); if (t < from) t = budaTime(addDays(day, 1), h, m);
    if (t > Date.now()) { toast('Ez az időpont még nem volt.'); return true; }
    at = new Date(t).toISOString();
  }
  try { const p = await guarded(() => api.ptOp(b.dataset.pid, at ? { type: 'time_stop', at } : { type: 'time_stop' })); toast('Óra leállítva.'); done(b.dataset.pid, p); }
  catch (er) { if (!(er instanceof AccessError)) toast(er.message); }
  return true;
}
const syncText = (at) => at ? `A Teendőim percenként beolvassa a DTPS mappát. Utoljára: ${whenText(at)}.` : 'Még nem jött adat a DTPS mappából. A Teendőim küldi percenként (menü → BREMAT Központ → DTPS mappa beolvasása most).';

// --- Robot programok widget: összesítő gyűrű; a kereső a termékeket és a részeket is innen kapja ---
async function loadPtIsland() {
  const { products } = await api.ptList();
  for (const p of products) {
    const s = summary(p);
    hwIndex.push({ t: p.sku, s: `${p.name} · ${PSTATES[pstateOf(p)].t} · ${s.wait} tesztre vár · ${s.fix} javítani`, k: 'pt', u: `#/teszt/${p.id}` });
    visibleParts(p).forEach((x) => hwIndex.push({ t: x.name, s: `${p.sku} · ${latestOf(x).v} · ${stateOf(x).t}`, k: 'pt', icon: 'box', u: `#/teszt/${p.id}` }));
  }
  const t = { wait: 0, fix: 0, tweak: 0, ok: 0, auto: 0 }, cm = new Map();
  for (const p of products) { const s = summary(p); STATES.forEach((k) => { t[k] += s[k]; }); s.customs.forEach((c) => { const key = `${c.t}|${c.c}`; cm.set(key, { ...c, n: (cm.get(key)?.n || 0) + c.n }); }); }
  // sorrend, mint a táblában: Tesztre vár, Javítani kell, saját állapotok, Kis finomítás, Kész
  const rows = [...['wait', 'fix'].map((k) => ({ t: STATE[k].t, color: `var(--st-${k})`, n: t[k] })), ...cm.values(), ...['tweak', 'ok', 'auto'].map((k) => ({ t: STATE[k].t, color: `var(--st-${k})`, n: t[k] }))].filter((x) => x.n || x.color.includes('ok'));
  const n = rows.reduce((a, x) => a + x.n, 0);

  const r = 46, c = 2 * Math.PI * r; let acc = 0;
  const segs = rows.map((x) => { const v = x.n / n; const out = v ? `<circle cx="62" cy="62" r="${r}" stroke-width="14" style="stroke:${x.color}" stroke-dasharray="${Math.max(0, c * v - 3)} ${c}" stroke-dashoffset="${-c * acc}"/>` : ''; acc += v; return out; }).join('');
  hwFill('pt', `<div class="hw-donut"><div class="ring"><svg viewBox="0 0 124 124" aria-hidden="true"><circle class="tr" cx="62" cy="62" r="${r}" stroke-width="14"/>${segs}</svg><div class="lab"><b>${t.ok + t.auto}</b><span>kész</span></div></div>
    <ul class="hw-legend">${rows.map((x) => `<li style="--k:${x.color}"><b class="tab">${x.n}</b> ${esc(x.t)}</li>`).join('')}</ul></div>`, t.wait);
}

// --- ARC-EYE edző widget: a szint és az XP, a /arceye/ oldal böngészőben tárolt állapotából ---
const AE_LEVELS = [[0, 'Tanonc'], [100, 'Betanított'], [250, 'Beállító'], [450, 'Varratvadász'], [700, 'ARC-EYE mester'], [1000, 'Integrátor-jelölt']];

// --- A termék infója („mi újság vele”, Alex, 2026. nov. 27.): a listán és a termék oldalán is írható ---
const pnoteHtml = (p, edit) => edit

      <div class="row"><button class="btn" type="button" data-pn="cancel">Mégse</button><button class="btn rp-fix" type="button" data-pn="save" data-pid="${esc(p.id)}"><i data-lucide="check"></i>Mentés</button></div></div>`
  : p.note?.text ? `<div class="rp-pn"><i data-lucide="message-square-text"></i><span class="t">${esc(p.note.text)}<small>${esc(whenText(p.note.at))}</small></span><button type="button" class="rp-link" data-pn="edit" data-pid="${esc(p.id)}">Szerkesztés</button></div>`

/** A termék-infó gombjai. state: { edit, set(edit), saved(p) } */

// --- Lista: a termékek ---
const ptTabs = (cur) => `<nav class="tm-tabs no-print" aria-label="Robot programok"><a href="#/teszt"${cur === 'list' ? ' aria-current="page"' : ''}><i data-lucide="list"></i>Termékek</a><a href="#/teszt/stat"${cur === 'stat' ? ' aria-current="page"' : ''}><i data-lucide="chart-column"></i>Statisztika</a></nav>`;

// --- Statisztika: mennyi idő ment el a robotprogramokra (hét / hónap / év), összkép a főnöknek ---
const MONTHS = ['Jan', 'Feb', 'Már', 'Ápr', 'Máj', 'Jún', 'Júl', 'Aug', 'Szep', 'Okt', 'Nov', 'Dec'];
const MONTHS_L = ['január', 'február', 'március', 'április', 'május', 'június', 'július', 'augusztus', 'szeptember', 'október', 'november', 'december'];
const WDAYS = ['H', 'K', 'Sze', 'Cs', 'P', 'Szo', 'V'];
/** Az időszak: { start, end (nem tartozik bele), label, name, b: [{ key, l }], bucket(ymd) → key }. off: 0 = most, −1 = előző… */
function statRange(per, off) {
  const t = today();
  if (per === 'het') {
    const start = addDays(mondayOf(t), 7 * off), end = addDays(start, 7), w = isoWeek(start);
    return { start, end, label: `${w.week}. hét · ${huShort.format(toDate(start))} – ${huShort.format(toDate(addDays(end, -1)))}`, name: `A ${w.week}. héten`, prev: 'előző hét',
      b: WDAYS.map((l, i) => ({ key: addDays(start, i), l })), bucket: (ymd) => ymd };
  }
  if (per === 'honap') {

  });

    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ráfordított órák időszakonként">${g}</svg><div class="st-tip" hidden></div>`;
}

      ${log.length ? `<details><summary>Időbejegyzések (${es.length})</summary><div class="tm-log">${log.map((e) => `<div style="--c:${TK_COLOR[e.k]}"><span><span class="k">${TKINDS[e.k].t}${e.k === 'kint' ? '' : e.k === 'prog' ? ' · iroda' : ''}</span><small>${esc(whenText(e.from))}${e.v ? ` · ${esc(e.v)}` : ''} · ${SRC[e.src] || ''}</small></span><b>${e.ms === null ? `<span data-since="${Date.parse(e.from)}">${clockTxt(now - Date.parse(e.from))}</span>` : `${e.ms < 0 ? '−' : ''}${durTxt(Math.abs(e.ms))}`}</b>${e.src !== 'pc' && e.ms !== null ? `<button type="button" data-a="tdel" data-id="${esc(e.id)}" aria-label="Időbejegyzés törlése" title="Törlés"><i data-lucide="trash-2"></i></button>` : '<span></span>'}</div>`).join('')}</div></details>` : ''}`;
  };
  let infoEdit = false;
  const noteHtml = (n) => `<div class="rp-note"><div class="t"><time>${esc(whenText(n.at))}</time>${esc(n.text)}</div><button type="button" data-a="notedel" data-id="${esc(n.id)}" aria-label="Infó törlése">×</button></div>`;
  // B változat (Alex, 2026. nov. 27.): felül a program, alatta lenyíló sorok (jobbra az értékük), a fő gombok mindig alul
  const acc = (k, icon, color, title, val, inner) => `<section class="rp-acc"${openAcc.has(k) ? ' data-open' : ''}>
      <button type="button" class="rp-acch" data-a="acc" data-k="${k}" aria-expanded="${openAcc.has(k)}"><span class="i" style="--c:${color}"><i data-lucide="${icon}"></i></span><b>${title}</b><span class="v">${val}</span><span class="ch" aria-hidden="true">›</span></button>
      <div class="rp-accb">${inner}</div></section>`;
  const drawPanel = () => {
    const x = p.parts.find((y) => y.id === cur);
    if (!x) return close();
    const keep = panel.scrollTop;
    const v = latestOf(x), o = openPoints(x), done = x.points.filter((y) => y.done);
    const groups = notesByVersion(x), curG = groups.find((g) => g.v === v.v) || { notes: [] }, older = groups.filter((g) => g.v !== v.v);
    const now = Date.now(), es = timeOf(p, pctime).filter((e) => e.part === x.id), tt = timeSum(es, now);
    const r = runningOf(p), mine = r && r.part === x.id ? r : null;
    const s = stateOf(x), finished = x.status === 'ok' || x.status === 'auto';
    const pt = (y) => `<div class="rp-ptw"><button class="rp-pt ${y.done ? 'on' : ''}" type="button" data-a="pt" data-id="${esc(y.id)}"><i>✓</i><span>${esc(y.text)}${y.v ? `<em>${esc(y.v)}</em>` : ''}</span></button><button class="rp-ptdel" type="button" data-a="ptdel" data-id="${esc(y.id)}" aria-label="Pont törlése" title="Törlés"><i data-lucide="trash-2"></i></button></div>`;
    const todoIn = `${o.length ? `<div class="rp-pts">${o.map(pt).join('')}</div>`
        : `<p class="rp-empty">${x.status === 'ok' ? `<b class="n-ok">✓ Minden tökéletes${x.ok_at ? ` (${esc(whenText(x.ok_at))})` : ''}</b>` : 'Nincs nyitott pont. Ha a tesztnél valami nem jó: lent „Mi a teendő?”, soronként egy pont.'}</p>`}
      ${writing ? `<textarea id="rpObs" maxlength="6000" placeholder="Soronként egy pont, pl. Kezdőpont 2 mm-t csúszik" aria-label="Mi a teendő"></textarea>
        <div class="rp-acts two"><button class="btn" type="button" data-a="cancel">Mégse</button><button class="btn rp-fix" type="button" data-a="save"><i data-lucide="wrench"></i>Mentés – javítani kell</button></div>` : ''}
      ${done.length ? `<details><summary>Kipipált pontok (${done.length})</summary><div class="rp-pts" style="margin-top:10px">${done.slice().reverse().map(pt).join('')}</div></details>` : ''}`;
    const stIn = `<div class="rp-seg" role="group" aria-label="Állapot">${STATES.map((k) => `<button type="button" data-a="status" data-v="${k}" aria-pressed="${x.status === k}" style="--c:var(--st-${k})">${STATE[k].t}</button>`).join('')}
        <button type="button" class="cust" data-a="custom" aria-pressed="${x.status === 'custom'}" aria-expanded="${custOpen}" style="--c:${s.color}">${x.status === 'custom' ? `${esc(s.t)} · átírás` : '+ Saját állapot (bármi, színnel)'}</button></div>
      ${custOpen ? `<div class="rp-custom">
        <input id="rpCustT" maxlength="40" placeholder="pl. Jigre vár, Holnap tesztelem…" aria-label="Saját állapot" value="${x.status === 'custom' ? esc(s.t) : ''}">
        <div class="rp-colors" role="group" aria-label="Szín">${Object.entries(COLORS).map(([k, c]) => `<button type="button" data-a="ccol" data-v="${k}" aria-pressed="${custCol === k}" aria-label="${c.t}" title="${c.t}" style="--c:${c.hex}"></button>`).join('')}</div>
        ${(() => { const u = usedCustoms(products.map((q) => (q.id === p.id ? p : q))); return u.length ? `<div class="rp-lbl" style="margin:0">Korábbiak</div><div class="rp-used">${u.map((c) => `<button type="button" data-a="cuse" data-t="${esc(c.t)}" data-c="${c.c}" style="--c:${COLORS[c.c].hex}">${esc(c.t)}</button>`).join('')}</div>` : ''; })()}
        <div class="row"><button class="btn" type="button" data-a="ccancel">Mégse</button><button class="btn rp-fix" type="button" data-a="csave"><i data-lucide="check"></i>Mentés</button></div></div>` : ''}
      <div class="rp-lbl" style="margin:0">Jelölés</div>
      <div class="rp-seg mk" role="group" aria-label="Jelölés">${[['', 'Nincs', 'var(--muted)'], ...Object.entries(MARKS).map(([k, m]) => [k, m.t, m.hex])].map(([k, t, c]) => `<button type="button" data-a="mark" data-v="${k}" aria-pressed="${(x.mark || '') === k}" style="--c:${c}">${t}</button>`).join('')}</div>`;
    const infoIn = `<div class="rp-info"><div class="rp-lbl" style="margin:0">Összesítő infó – minden verzióra</div>
        ${infoEdit ? `<textarea id="rpInfo" maxlength="8000" placeholder="pl. mindig 2 db-ot fogunk be, a 3-as jig kell…">${esc(x.info || '')}</textarea>
          <div class="row"><button class="btn" type="button" data-a="infocancel">Mégse</button><button class="btn rp-fix" type="button" data-a="infosave"><i data-lucide="check"></i>Mentés</button></div>`
        : `<div class="t ${x.info ? '' : 'empty'}">${x.info ? esc(x.info) : 'Még nincs. Ide az kerül, ami minden verzióra igaz.'}</div><div class="row"><button class="rp-link" type="button" data-a="infoedit">${x.info ? 'Szerkesztés' : '+ Infó írása'}</button></div>`}</div>
      <div class="rp-lbl" style="margin:0">Infó a ${esc(v.v)} verzióhoz</div>
      <div class="rp-notes">${curG.notes.slice().reverse().map(noteHtml).join('')}
        <div class="rp-add"><textarea id="rpNote" maxlength="4000" placeholder="Infó a ${esc(v.v)}-hoz…" aria-label="Új infó"></textarea><button class="btn" type="button" data-a="noteadd" aria-label="Infó mentése"><i data-lucide="send-horizontal"></i></button></div></div>`;
    const histIn = `${older.length ? older.map((g) => `<div class="rp-ver"><div class="h"><span><b class="mono">${esc(g.v)}</b>${g.version?.m ? ` · ${esc(whenText(g.version.m))}` : ''}</span>${g.version ? `<a class="rp-link" href="${esc(dtpsLink(p, g.version))}" target="_blank" rel="noopener">Megnyitás</a>` : ''}</div>
        ${g.notes.length ? `<div class="rp-notes">${g.notes.slice().reverse().map(noteHtml).join('')}</div>` : '<span class="rp-foot">Nincs infó.</span>'}</div>`).join('') : '<p class="rp-empty">Még nincs korábbi verzió.</p>'}
      ${x.tests.length ? `<div class="rp-lbl" style="margin:0">Tesztek (${x.tests.length})</div><div class="rp-old" style="margin:0">${x.tests.slice().reverse().map((t) => `<div><span>${esc(whenText(t.at))} · <span class="mono">${esc(t.v || '')}</span></span><span class="${t.ok ? 'n-ok' : 'n-fix'}" style="font-weight:700">${t.ok ? 'Minden tökéletes' : `${t.n || ''} észrevétel`}</span></div>`).join('')}</div>` : '<p class="rp-empty">Még nem volt teszt.</p>'}`;
    const infoN = (x.info ? 1 : 0) + curG.notes.length;
    panel.innerHTML = `<div class="rp-top"><h2>${esc(x.name)}<small>${esc(p.sku)}${MARKS[x.mark] ? ` · <span class="rp-mk" style="--mk:${MARKS[x.mark].hex}">${MARKS[x.mark].t}</span>` : ''}</small></h2><button class="x" type="button" data-a="close" aria-label="Bezár"><i data-lucide="x"></i></button></div>
      <div class="rp-cur" style="--c:${s.color}"><div class="t"><small>Legfrissebb${v.m ? ` · ${esc(whenText(v.m))}` : ''}</small><span class="v">${esc(v.v)}</span><span class="f mono">${esc(v.file)}</span></div>
        <div class="b"><a class="btn rp-open" href="${esc(dtpsLink(p, v))}" target="_blank" rel="noopener" title="A programozó gépen működik, ahol a Teendőim fut."><i data-lucide="monitor-play"></i>DTPS</a>${mine ? '' : `<button class="btn rp-tst" type="button" data-a="tstart" data-k="test"><i data-lucide="play"></i>Teszt</button>`}</div></div>
      ${acc('todo', 'list-checks', 'var(--st-fix)', 'Mi a teendő', writing ? 'írás…' : o.length ? `<b class="n-fix">${o.length} pont</b>` : 'nincs pont', todoIn)}
      ${acc('st', 'tag', s.color, 'Állapot', `${stHtml(x)}`, stIn)}
      ${acc('time', 'timer', 'var(--tm-prog)', 'Idő', mine ? `<b class="n-fix">${TKINDS[mine.k].t} <span data-since="${Date.parse(mine.from)}">${clockTxt(now - Date.parse(mine.from))}</span></b>` : durTxt(tt.all), timeHtml(x))}
      ${acc('info', 'info', 'var(--st-wait)', 'Infó', infoN ? `${infoN} infó` : 'még nincs', infoIn)}
      ${acc('hist', 'history', 'var(--muted)', 'Előzmény', `${x.versions.length} verzió · ${x.tests.length} teszt`, histIn)}
      <div class="rp-bot">
        ${mine ? `<button type="button" class="rp-stop" data-a="tstop" style="--c:${TK_COLOR[mine.k]}"><span class="dot"></span>${mine.k === 'test' ? 'Teszt vége' : mine.k === 'kint' ? 'Javítás vége' : 'Óra leállítása'}<span class="t" data-since="${Date.parse(mine.from)}">${clockTxt(now - Date.parse(mine.from))}</span></button>` : ''}
        <div class="rp-acts two">${finished ? '' : `<button class="btn rp-ok" type="button" data-a="ok"><i data-lucide="check"></i>Minden tökéletes</button>`}<button class="btn" type="button" data-a="write"><i data-lucide="pencil-line"></i>Mi a teendő?</button></div>
      </div>`;
    icons();
    panel.scrollTop = keep;
  };
  const open = (pid) => { cur = pid; writing = false; infoEdit = false; custOpen = false; tfOpen = false; drawPanel(); panel.hidden = false; scrim.hidden = false; panel.querySelector('.x').focus(); };
  function close() { cur = null; writing = false; panel.hidden = true; scrim.hidden = true; }
  const run = async (op, msg) => {
    if (busy) return; busy = true;
    try { p = await guarded(() => api.ptOp(p.id, op)); products = products.map((q) => (q.id === p.id ? p : q)); writing = false; infoEdit = false; custOpen = false; tfOpen = false; drawTable(); drawPanel(); if (msg) toast(msg); return true; }
    catch (e) { if (!(e instanceof AccessError)) toast(e.message); }
    finally { busy = false; }
  };
  app.addEventListener('keydown', pnoteKeys);
  app.addEventListener('click', async (e) => {
    if (await pnoteClick(e, { set: (id) => { pnEdit = !!id; drawTable(); }, saved: (n) => { p = n; products = products.map((q) => (q.id === n.id ? n : q)); pnEdit = false; drawTable(); } })) return;
    if (await runBannerClick(e, (pid, n) => { products = products.map((q) => (q.id === pid ? n : q)); if (pid === p.id) p = n; drawTable(); if (cur) drawPanel(); })) return;
    const ps = e.target.closest('[data-ps]');
    if (ps) { if (busy) return; busy = true; try { p = await guarded(() => api.ptOp(p.id, { type: 'pstate', pstate: ps.dataset.ps })); products = products.map((q) => (q.id === p.id ? p : q)); drawTable(); toast(`${p.sku}: ${PSTATES[ps.dataset.ps].t}`); } catch (er) { if (!(er instanceof AccessError)) toast(er.message); } finally { busy = false; } return; }
    const r = e.target.closest('tr[data-part]'); if (r) open(r.dataset.part);
  });
  app.addEventListener('keydown', (e) => { const r = e.target.closest('tr[data-part]'); if (r && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(r.dataset.part); } });
  scrim.addEventListener('click', close);
  panel.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-a]'); if (!b) return;
    const a = b.dataset.a, x = p.parts.find((y) => y.id === cur);
    if (a === 'close' || !x) return close();
    if (a === 'acc') { const k = b.dataset.k; if (openAcc.has(k)) openAcc.delete(k); else openAcc.add(k); return drawPanel(); }
    if (a === 'tstart') {
      // egyszerre egy óra megy: a másik termékben futót előbb leállítja
      for (const q of products) if (q.id !== p.id && runningOf(q)) {
        try { const n = await guarded(() => api.ptOp(q.id, { type: 'time_stop' })); products = products.map((z) => (z.id === n.id ? n : z)); }
        catch (er) { if (!(er instanceof AccessError)) toast(er.message); return; }
      }
      return run({ type: 'time_start', part: x.id, kind: b.dataset.k }, `${TKINDS[b.dataset.k].t}: az óra megy.`);
    }
    if (a === 'tstop') return run({ type: 'time_stop' }, 'Óra leállítva.');
    if (a === 'tfix') { tfOpen = true; openAcc.add('time'); drawPanel(); return $('#tmMin').focus(); }
    if (a === 'tfcancel') { tfOpen = false; return drawPanel(); }
    if (a === 'tfk' || a === 'tfs') { const m = $('#tmMin').value, d = $('#tmDay').value; if (a === 'tfk') tfKind = b.dataset.v; else tfSign = Number(b.dataset.v); drawPanel(); $('#tmMin').value = m; $('#tmDay').value = d; return; }
    if (a === 'tfsave') {
      const m = Math.round(Number($('#tmMin').value)), d = $('#tmDay').value;
      if (!(m > 0)) return $('#tmMin').focus();
      return run({ type: 'time_fix', part: x.id, kind: tfKind, min: tfSign * m, ...(d && d !== today() ? { day: d } : {}) }, `${TKINDS[tfKind].t}: ${tfSign > 0 ? '+' : '−'}${durTxt(m * 60000)}`);
    }
    if (a === 'tdel') { if (!confirm('Törlöd ezt az időbejegyzést?')) return; return run({ type: 'time_delete', entry: b.dataset.id }, 'Időbejegyzés törölve.'); }
    if (a === 'pt') return run({ type: 'point_toggle', part: x.id, point: b.dataset.id });
    if (a === 'ptdel') { const y = x.points.find((z) => z.id === b.dataset.id); if (!y || !confirm(`Törlöd ezt a pontot?\n\n${y.text}`)) return; return run({ type: 'point_delete', part: x.id, point: y.id }, 'Pont törölve.'); }
    if (a === 'ok') return run({ type: 'test_ok', part: x.id }, `${x.name}: kész`);
    if (a === 'status') return run({ type: 'status', part: x.id, status: b.dataset.v }, `${x.name}: ${STATE[b.dataset.v].t}`);
    if (a === 'mark') return run({ type: 'mark', part: x.id, mark: b.dataset.v || null }, `${x.name}: ${MARKS[b.dataset.v]?.t || 'jelölés nélkül'}`);
    if (a === 'custom') { openAcc.add('st'); custOpen = !custOpen; custCol = x.status === 'custom' ? stateOf(x).c : custCol; drawPanel(); return custOpen && $('#rpCustT').focus(); }
    if (a === 'ccol') { custCol = b.dataset.v; const t = $('#rpCustT').value; drawPanel(); $('#rpCustT').value = t; return; }
    if (a === 'ccancel') { custOpen = false; return drawPanel(); }
    if (a === 'csave') { const t = $('#rpCustT').value.trim(); if (!t) return $('#rpCustT').focus(); return run({ type: 'status_custom', part: x.id, text: t, color: custCol }, `${x.name}: ${t}`); }
    if (a === 'cuse') return run({ type: 'status_custom', part: x.id, text: b.dataset.t, color: b.dataset.c }, `${x.name}: ${b.dataset.t}`);
    if (a === 'infoedit') { infoEdit = true; openAcc.add('info'); drawPanel(); return $('#rpInfo').focus(); }
    if (a === 'infocancel') { infoEdit = false; return drawPanel(); }
    if (a === 'infosave') return run({ type: 'info_set', part: x.id, text: $('#rpInfo').value }, 'Összesítő infó elmentve.');
    if (a === 'noteadd') { const t = $('#rpNote').value; if (!t.trim()) return $('#rpNote').focus(); return run({ type: 'note_add', part: x.id, text: t }, `Infó a ${latestOf(x).v}-hoz elmentve.`); }
    if (a === 'notedel') { if (!confirm('Törlöd ezt az infót?')) return; return run({ type: 'note_delete', part: x.id, note: b.dataset.id }); }
    if (a === 'write') { writing = true; openAcc.add('todo'); drawPanel(); const t = $('#rpObs'); t.scrollIntoView({ block: 'center' }); return t.focus(); }
    if (a === 'cancel') { writing = false; return drawPanel(); }
    if (a === 'save') { const t = $('#rpObs').value; if (!t.trim()) return $('#rpObs').focus(); return run({ type: 'test_fix', part: x.id, text: t }, `${x.name}: javítani kell`); }
  });
  panel.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'rpCustT') { e.preventDefault(); return panel.querySelector('[data-a="csave"]').click(); }
    if (e.key === 'Enter' && (e.target.id === 'tmMin' || e.target.id === 'tmDay')) { e.preventDefault(); return panel.querySelector('[data-a="tfsave"]').click(); }
    if (e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    const k = { rpObs: 'save', rpInfo: 'infosave', rpNote: 'noteadd' }[e.target.id];
    if (k) panel.querySelector(`[data-a="${k}"]`).click();
  });
  const onKey = (e) => { if (e.key === 'Escape' && !panel.hidden) close(); };
  document.addEventListener('keydown', onKey);
  window.addEventListener('hashchange', () => { document.removeEventListener('keydown', onKey); panel.remove(); scrim.remove(); }, { once: true });
  drawTable();
}

/* =====================================================================
   6. Projektek (a lista a szerverről jön, csak kóddal)
   ===================================================================== */
const PICONS = { tokmany: 'cylinder', adapter: 'puzzle', hegesztett: 'flame', muhely: 'wrench' };
let projCache = null;
const loadProjects = async () => (projCache ||= await guarded(() => api.projects()));
async function renderProjects() {
  $('#app').innerHTML = `<div class="page">
    <div class="greet"><h1>Projektek</h1><p>Koppints egy projektre, és lenyílnak az oldalai.</p></div>
    <div class="row" id="projTop"></div>
    <div class="search-wrap"><i data-lucide="search"></i><input class="search" id="pq" type="search" placeholder="Keresés: tokmány, 3D, 2950…" autocomplete="off"></div>
    <div class="proj" id="projBody"><div class="card glass"><div class="skeleton" style="width:60%"></div></div></div></div>`;
  icons();
  const { projects, private_index } = await loadProjects();
  if (private_index) $('#projTop').innerHTML = `<a class="btn" href="${esc(private_index)}" target="_blank" rel="noopener"><i data-lucide="lock"></i>Saját oldalak<i data-lucide="arrow-up-right"></i></a>`;
  const plain = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const draw = () => {
    const words = plain($('#pq').value).split(/\s+/).filter(Boolean);
    const list = projects.map((g) => ({ ...g, items: g.items.filter((it) => words.every((w) => plain(`${it.t} ${(it.k || []).join(' ')} ${g.name}`).includes(w))) })).filter((g) => g.items.length);
    $('#projBody').innerHTML = list.length ? list.map((g, i) => `
      <details class="pcard glass" style="--i:${i}" ${words.length ? 'open' : ''}>
        <summary><span class="ico"><i data-lucide="${PICONS[g.key] || 'folder'}"></i></span>
          <span><b>${esc(g.name)}</b><small>${g.items.length} oldal${g.about ? ' · ' + esc(g.about) : ''}</small></span>
          <i class="chev" data-lucide="chevron-right"></i></summary>
        <ul>${g.items.map((it) => `<li><a href="${esc(it.u)}" target="_blank" rel="noopener"><span>${esc(it.t)}${(it.k || []).map((k) => `<span class="chip">${esc(k)}</span>`).join('')}</span>${it.d ? `<small class="muted">${huShort.format(toDate(it.d))}</small>` : ''}</a></li>`).join('')}</ul>
      </details>`).join('') : `<div class="card glass"><p class="muted" style="margin:0">Nincs találat.</p></div>`;
    icons();
  };
  $('#pq').addEventListener('input', draw); draw();
}

/* =====================================================================
   7. Beállítások
   ===================================================================== */
function renderSettings() {
  const dark = store.get('kozpont-tema') === 'sotet';
  $('#app').innerHTML = `<div class="page" style="max-width:600px">
    <div class="greet"><h1>Beállítások</h1><p>Ezek csak ezen az eszközön érvényesek.</p></div>
    <div class="card glass"><h2>Megjelenés</h2>
      <label class="switch"><input type="checkbox" id="darkBg" ${dark ? 'checked' : ''}> Sötét háttér a Központban</label>
      <p class="muted" style="margin:8px 0 0">Világosban az üzemben, erős fényben is jól olvasható.</p></div>
    <form class="card glass" id="nameForm" style="display:flex;flex-direction:column;gap:12px"><h2 style="margin:0">Név a naplóban</h2>
      <label class="field"><span>Ezzel a névvel kerülnek be a bejegyzéseid</span><input type="text" id="sName" maxlength="120" value="${esc(store.get('naplo-nev') || '')}"></label>
      <div><button class="btn primary" type="submit"><i data-lucide="check"></i>Mentés</button></div></form>
    <div class="card glass"><h2>Valk fájlok</h2>
      <label class="switch"><input type="checkbox" id="helyiOn" ${helyiOn() ? 'checked' : ''}> Valk fájlok a kezdőlapon (dokk és kereső)</label>
      <p class="muted" style="margin:8px 0 0">Csak azon a gépen kapcsold be, ahol a helyi BREMAT Központ fut (a Teendőim mellett). A fájlok ott maradnak, a netre nem kerülnek fel.</p></div>
    <div class="card glass"><h2>Belépés</h2>
      <p class="muted" style="margin:0 0 12px">Ezen az eszközön be vagy lépve. Kilépés után a Központ, a napló és a heti lap is újra kéri a kódot.</p>
      <button class="btn" type="button" id="logout"><i data-lucide="log-out"></i>Kilépés ezen az eszközön</button></div>
  </div>`;
  icons();
  $('#darkBg').addEventListener('change', (e) => { store.set('kozpont-tema', e.target.checked ? 'sotet' : 'vilagos'); applyTheme(); silk.redraw(); });
  $('#helyiOn').addEventListener('change', (e) => { if (e.target.checked) store.set('kozpont-helyi', '1'); else store.del('kozpont-helyi'); });
  $('#nameForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('#sName').value.trim(); if (v) store.set('naplo-nev', v); else store.del('naplo-nev'); toast('Elmentve.'); });
  $('#logout').addEventListener('click', () => { store.del('km-kod'); store.del('naplo-kod'); projCache = null; renderGate(); });
}

/* =====================================================================
   8. Útvonalak: a cím # utáni része dönti el, melyik nézet látszik
   ===================================================================== */
const VIEWS = { '#/otletek': renderIdeas, '#/projektek': renderProjects, '#/beallitasok': renderSettings, '#/teszt': renderPtList, '#/teszt/stat': renderPtStats };
const PT_ROUTE = /^#\/teszt\/([\w-]+)$/;
function route() {
  document.documentElement.classList.remove('hw-on'); silk.pause(false);   // a kezdőlap a renderHome-ban kapcsolja vissza
  if (OLD.test(location.hash)) return location.replace('/valk/' + location.search + location.hash);
  if (!DEMO && !kmCode()) return renderGate();
  $('#menuBtn').hidden = false;
  const ptm = !VIEWS[location.hash] && location.hash.match(PT_ROUTE);
  const key = VIEWS[location.hash] ? location.hash : ptm ? '#/teszt/*' : '#/';
  $$('.nav a[data-view]').forEach((a) => a.toggleAttribute('aria-current', a.dataset.view === key));
  $$('.nav a[aria-current]').forEach((a) => a.setAttribute('aria-current', 'page'));
  clearInterval(tickTimer); clearInterval(hwTimer); clearInterval(ptTick); $('#hwLayer')?.remove(); window.scrollTo(0, 0);
  Promise.resolve().then(ptm ? () => renderPtProduct(ptm[1]) : VIEWS[key] || renderHome).catch((e) => { if (!(e instanceof AccessError)) console.error(e); });
}
$('#demo').hidden = !DEMO;
icons();
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
