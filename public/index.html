<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef2">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>BREMAT Központ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..700,0..1,0&display=block">
<!-- Ikonok: Lucide (nyílt forrású ikonkészlet) -->
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<!--
  =====================================================================
  BREMAT Központ – a bremat-stuff kezdőlapja.
  Felül középen a cím, bal oldalt lenyitható menü, a cím alatt két
  „sziget”: Munkanapló és Valk heti lap, értesítés-jelvénnyel.
  Háttér: animált, hajlított „selyemszalagok” (canvas). Alapból világos,
  a Beállításokban sötétre váltható.
  A Központ nem tárol semmit: a meglévő szerverfüggvényeket kérdezi
  (/api/naplo, /api/km, /api/kozpont).
  =====================================================================
-->
<style>
/* ---------- Színek (tokenek): világos alap, sötét változat ---------- */
:root {
  --bg: #eceef2;
  --glass: rgba(255, 255, 255, .62);
  --glass-strong: rgba(255, 255, 255, .86);
  --glass-line: rgba(255, 255, 255, .85);
  --line: rgba(16, 20, 28, .1);
  --shadow: 0 12px 40px rgba(24, 30, 44, .12);
  --text: #12151b;
  --muted: #586070;
  --hover: rgba(16, 20, 28, .055);
  --active: rgba(16, 20, 28, .085);
  --accent: #c8102e;
  --scrim: rgba(20, 24, 33, .22);
  --naplo: #0e8ea3;  --naplo-soft: rgba(14, 142, 163, .13);
  --valk: #c8102e;   --valk-soft: rgba(200, 16, 46, .1);
  --idea: #b86e00;   --idea-soft: rgba(214, 140, 0, .13);
  --proj: #6a4bc4;   --proj-soft: rgba(106, 75, 196, .12);
  --pt: #2563c9;     --pt-soft: rgba(37, 99, 201, .12);
  --ae: #d2452f;     --ae-soft: rgba(226, 65, 47, .12);
  --ok: #1e9a4e; --warn: #c27c00; --bad: #c8102e;
  --badge-ink: #ffffff;
  --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
  --body: 'Manrope', 'Segoe UI', system-ui, sans-serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0b0c0e;
  --glass: rgba(22, 24, 28, .55);
  --glass-strong: rgba(20, 22, 26, .86);
  --glass-line: rgba(255, 255, 255, .12);
  --line: rgba(255, 255, 255, .1);
  --shadow: 0 12px 40px rgba(0, 0, 0, .5);
  --text: #eef1f6; --muted: #9aa3b2;
  --hover: rgba(255, 255, 255, .06); --active: rgba(255, 255, 255, .1);
  --accent: #ff5468; --scrim: rgba(0, 0, 0, .4);
  --naplo: #4cc7da; --naplo-soft: rgba(76, 199, 218, .14);
  --valk: #ff5468;  --valk-soft: rgba(255, 84, 104, .14);
  --idea: #f2b84b;  --idea-soft: rgba(242, 184, 75, .14);
  --proj: #a990ff;  --proj-soft: rgba(169, 144, 255, .15);
  --pt: #6ea4ff;    --pt-soft: rgba(110, 164, 255, .15);
  --ae: #ff7a5c;    --ae-soft: rgba(255, 122, 92, .15);
  --ok: #4ad37f; --warn: #f2b84b; --bad: #ff5468;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.5; overflow-x: hidden; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }

/* ---------- Háttér: a szalagokat a canvas rajzolja (lásd 1. pont a scriptben) ---------- */
#silk { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; display: block; }

/* ---------- Üveg ---------- */
.glass {
  background: var(--glass);
  -webkit-backdrop-filter: blur(22px) saturate(160%);
  backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--glass-line);
  box-shadow: var(--shadow);
}

/* ---------- Fejléc: bal oldalt menügomb, középen a cím ---------- */
.topbar {
  position: fixed; z-index: 20;
  top: calc(12px + env(safe-area-inset-top, 0px));
  left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  height: 64px; border-radius: 20px;
  display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; padding: 0 10px;
  animation: dropIn .7s var(--ease) both;
}
.title { grid-column: 2; text-align: center; margin: 0; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .02em; }
.title a { text-decoration: none; }
.title span { color: var(--muted); font-weight: 500; }
@keyframes dropIn { from { opacity: 0; transform: translateY(-14px); } }

.icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid transparent; display: grid; place-items: center; background: transparent; color: var(--text); cursor: pointer;
  transition: background .25s var(--ease), transform .2s var(--ease), border-color .25s; }
.icon-btn:hover { background: var(--hover); border-color: var(--glass-line); }
.icon-btn:active { transform: scale(.94); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Lenyitható menü ---------- */
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .35s var(--ease); }
.drawer {
  position: fixed; z-index: 31;
  top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  left: max(12px, env(safe-area-inset-left, 0px)); width: min(300px, calc(100vw - 24px));
  border-radius: 24px; padding: 14px; background: var(--glass-strong);
  display: flex; flex-direction: column; gap: 6px; overflow-y: auto;
  transform: translateX(calc(-100% - 24px)); visibility: hidden;
  transition: transform .45s var(--ease), visibility 0s linear .45s;
}
body.menu-open .scrim { opacity: 1; pointer-events: auto; }
body.menu-open .drawer { transform: none; visibility: visible; transition: transform .45s var(--ease), visibility 0s; }
.drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 4px 12px 10px; }
.drawer-head b { font-family: var(--display); font-weight: 600; font-size: 17px; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav .label { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 4px; }
.nav a { display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 14px; text-decoration: none; font-weight: 600;
  transition: background .25s var(--ease); opacity: 0; transform: translateX(-10px); }
.nav a svg { width: 20px; height: 20px; stroke-width: 1.8; color: var(--muted); flex: none; transition: color .25s; }
.nav a .ext { margin-left: auto; width: 15px; height: 15px; }
.nav a:hover { background: var(--hover); }
.nav a:hover svg, .nav a[aria-current="page"] svg { color: var(--accent); }
.nav a[aria-current="page"] { background: var(--active); }
body.menu-open .nav a { opacity: 1; transform: none; transition: opacity .4s var(--ease) calc(var(--i) * 40ms + 120ms), transform .4s var(--ease) calc(var(--i) * 40ms + 120ms), background .25s var(--ease); }
.drawer-foot { margin-top: auto; padding: 12px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }

/* ---------- Tartalom ---------- */
main {
  position: relative; z-index: 1;
  padding-top: calc(112px + env(safe-area-inset-top, 0px)); padding-bottom: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; align-items: center; gap: 16px;
}
.page { width: min(860px, 100%); display: flex; flex-direction: column; gap: 16px; }
.greet { text-align: center; animation: rise .7s var(--ease) both; }
.greet h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4vw, 32px); text-wrap: balance; }
.greet p { margin: 2px 0 0; color: var(--muted); }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }

/* ---------- Nyitó animáció: konténer + kamion (videó), utána a kígyós BREMAT logó ---------- */
.hero { position: relative; width: min(100%, 760px); aspect-ratio: 3 / 1; margin: -8px auto -4px; cursor: pointer; }
.hero video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; z-index: 1; transition: opacity .5s var(--ease); }
.hero svg { position: absolute; inset: 8% 9%; width: 82%; height: 84%; overflow: visible; color: var(--text); pointer-events: none; }
.hero .letter { transform-box: fill-box; transform-origin: 50% 70%; }
.hero .logo { transform-box: view-box; transform-origin: 0 0; }
.hero.static { cursor: pointer; }

.skeleton { height: 14px; border-radius: 7px; background: var(--hover); animation: shimmer 1.4s ease-in-out infinite; }
@keyframes shimmer { 50% { opacity: .45; } }

/* ---------- Kezdőlap „Színes üveg”: kereső, óra + műszak, színezett widgetek, dokk, Widgetek panel ---------- */
/* A kezdőlapon (html.hw-on) a makett színei és háttere: a selyemszalag-canvas és a felső sáv nem kell
   (a canvas a homályos üveg mögött minden képkockán újrarajzolna – ettől akadt a dokk). */
:root.hw-on:not([data-theme="dark"]) {
  --bg: #eef0f7; --glass: rgba(255, 255, 255, .42); --glass-strong: rgba(255, 255, 255, .78); --glass-line: rgba(255, 255, 255, .9);
  --line: rgba(40, 30, 90, .1); --text: #16142a; --muted: #5d5a78; --accent: #7b3fe4; --hover: rgba(40, 30, 90, .06); --active: rgba(40, 30, 90, .14);
  --naplo: #0a9bb0; --valk: #e0244a; --pt: #3366ff; --ae: #ff6a3d; --idea: #e39400; --proj: #8a4dff;
  --shadow: 0 22px 60px rgba(60, 40, 140, .16), 0 2px 8px rgba(60, 40, 140, .06);
}
:root.hw-on:not([data-theme="dark"]) #silk, .hw-on .topbar { display: none; }
.hw-on main { padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
  display: inline-block; width: 1em; overflow: hidden; flex: none; font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased;
  font-variation-settings: 'FILL' 0, 'wght' 500, 'opsz' 24; transition: font-variation-settings .45s var(--ease); }
.ms.fill, .hw:hover .hw-tt .ms, .hw-dock a:hover .ms { font-variation-settings: 'FILL' 1, 'wght' 600, 'opsz' 24; }
.hw-c-naplo, .hw-naplo { --c: var(--naplo); } .hw-c-valk, .hw-valk, .hw-c-files { --c: var(--valk); } .hw-c-pt, .hw-pt { --c: var(--pt); }
.hw-c-ae, .hw-ae { --c: var(--ae); } .hw-c-idea, .hw-idea { --c: var(--idea); } .hw-c-proj, .hw-proj, .hw-c-settings { --c: var(--proj); }
.hw-page { width: min(1180px, 100%); display: flex; flex-direction: column; gap: 0; padding-bottom: 110px; }
.hw-aura { position: fixed; inset: -20vmax; z-index: -1; pointer-events: none; filter: blur(50px) saturate(1.5); }
.hw-aura i { position: absolute; border-radius: 50%; opacity: .8; animation: hwDrift 22s var(--ease) infinite alternate, hwMorph 14s var(--ease) infinite alternate; }
.hw-aura i:nth-child(1) { width: 46vmax; height: 46vmax; left: 8%; top: 4%; background: radial-gradient(circle, #ffc2d4, transparent 62%); }
.hw-aura i:nth-child(2) { width: 52vmax; height: 52vmax; right: 2%; top: 12%; background: radial-gradient(circle, #b8e6ff, transparent 62%); animation-delay: -8s; }
.hw-aura i:nth-child(3) { width: 40vmax; height: 40vmax; left: 30%; bottom: 0; background: radial-gradient(circle, #d6c4ff, transparent 62%); animation-delay: -14s; }
.hw-aura i:nth-child(4) { width: 30vmax; height: 30vmax; right: 24%; bottom: 10%; background: radial-gradient(circle, #ffe0a3, transparent 62%); animation-delay: -4s; }
[data-theme="dark"] .hw-aura i { opacity: .18; }
@keyframes hwDrift { to { transform: translate(6vmax, -4vmax) scale(1.12); } }
@keyframes hwMorph { 0%, 100% { border-radius: 50%; } 33% { border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%; } 66% { border-radius: 61% 39% 36% 64% / 58% 63% 37% 42%; } }
.hw-rise, .hw { animation: hwPop .8s cubic-bezier(.34, 1.56, .64, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes hwPop { from { transform: scale(.92); filter: blur(6px); } }
.hw-body.in > * { animation: hwIn .5s var(--ease) both; }
@keyframes hwIn { from { opacity: 0; transform: translateY(6px); } }

.hw-top { display: flex; align-items: center; gap: 14px 18px; padding: 10px 12px 10px 20px; border-radius: 22px; position: relative; z-index: 5; }
.hw-top.menu { padding-left: 10px; gap: 10px 14px; }
.hw-logo { font: 400 21px/1 'Archivo Black', 'Arial Black', sans-serif; letter-spacing: .01em; white-space: nowrap; text-decoration: none; }
.hw-logo span { color: var(--accent); }
.hw-search { flex: 1 1 280px; position: relative; min-width: 0; }
.hw-search label { display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 12px 0 14px; border-radius: 14px; background: rgba(255, 255, 255, .62); border: 1px solid var(--line); cursor: text; transition: border-color .3s, box-shadow .3s; }
.hw-search label:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent); }
.hw-search .ms { color: var(--muted); }
.hw-search input { flex: 1; min-width: 0; border: 0; background: transparent; outline: none; font-size: 15.5px; }
.hw-search input::placeholder { color: var(--muted); }
.hw-search kbd { font: 600 12px var(--body); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--muted); background: #fff; }
[data-theme="dark"] .hw-search label, [data-theme="dark"] .hw-edit { background: var(--glass-strong); }
[data-theme="dark"] .hw-search kbd { background: transparent; }
.hw-res { position: absolute; left: 0; right: 0; top: calc(100% + 8px); border-radius: 18px; padding: 6px; display: flex; flex-direction: column; gap: 2px; max-height: 60vh; overflow-y: auto; background: var(--glass-strong); animation: hwDrop .3s var(--ease); }
@keyframes hwDrop { from { transform: translateY(-6px); opacity: 0; } }
.hw-res button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 12px; min-height: 48px; }
.hw-res button:hover, .hw-res button[aria-selected="true"] { background: var(--hover); }
.hw-res .ri { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); flex: none; }
.hw-res .ri .ms { font-size: 21px; color: inherit; }
.hw-res b { font: 600 15px var(--display); display: block; overflow-wrap: anywhere; }
.hw-res small { color: var(--muted); font-size: 13px; }
.hw-res mark { background: color-mix(in srgb, var(--accent) 22%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; }
.hw-edit { flex: none; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; border-radius: 14px; border: 1px solid var(--line); background: rgba(255, 255, 255, .62); font-weight: 700; font-size: 14px; cursor: pointer; transition: background .3s; }
.hw-edit:hover { background: var(--glass-strong); }
.hw-edit .ms { font-size: 21px; }

.hw-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px 24px; flex-wrap: wrap; margin: 26px 6px 22px; }
.hw-time { font: 600 clamp(60px, 10vw, 104px)/.9 var(--display); letter-spacing: -.04em; background: linear-gradient(100deg, var(--pt), var(--proj) 35%, var(--valk) 65%, #ff9a3d); background-size: 220% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: hwHue 9s ease-in-out infinite alternate; }
.hw-time .colon { animation: hwBlink 2s steps(1) infinite; }
@keyframes hwHue { to { background-position: 100% 0; } }
@keyframes hwBlink { 50% { opacity: .25; } }
.hw-head p { margin: 4px 0 0; font-size: 17px; color: var(--muted); }
.hw-shift { --c: var(--naplo); border-radius: 24px; padding: 14px 20px 14px 14px; display: flex; align-items: center; gap: 14px; }
.hw-shift .ring { width: 62px; height: 62px; }
.hw-shift .ring .lab .ms { font-size: 24px; color: var(--c); }
.hw-shift-l { font-size: 13px; color: var(--muted); display: block; }
.hw-shift b { font: 700 22px/1.15 var(--display); display: block; }
.hw-shift small { font-size: 13px; color: var(--muted); }

.ring { position: relative; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; }
.ring .tr { stroke: var(--hover); }
.ring .fg { stroke: var(--c); stroke-linecap: round; transition: stroke-dashoffset 1.4s var(--ease); }
.ring .lab { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.1; }
.ring .lab b { font: 700 28px/1 var(--display); }
.ring .lab span { font-size: 11.5px; color: var(--muted); }

.hw-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; grid-auto-flow: dense; }
.hw { position: relative; overflow: hidden; border-radius: 36px; padding: 18px; display: flex; flex-direction: column; gap: 10px; min-height: 170px; text-decoration: none; color: inherit;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 20%, rgba(255, 255, 255, .5)), rgba(255, 255, 255, .38) 60%); transition: transform .35s var(--ease), box-shadow .35s; }
[data-theme="dark"] .hw { background: linear-gradient(145deg, color-mix(in srgb, var(--c) 18%, var(--glass)), var(--glass) 60%); }
.hw.wide { grid-column: span 2; }
.hw.tall { grid-row: span 2; }
.hw:hover { transform: translateY(-4px) scale(1.01); }
.hw:active { transform: scale(.98); }
.hw::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: radial-gradient(360px circle at var(--mx, 50%) var(--my, 0%), rgba(255, 255, 255, .55), transparent 45%); mix-blend-mode: soft-light; }
.hw:hover::after { opacity: 1; }
.hw::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px; pointer-events: none; opacity: 0; transition: opacity .4s;
  background: conic-gradient(from var(--hw-ang, 0deg), transparent 0 60%, var(--c) 75%, #fff 80%, var(--c) 85%, transparent 100%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.hw:hover::before { opacity: 1; animation: hwSpin 2.4s linear infinite; }
@property --hw-ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes hwSpin { to { --hw-ang: 360deg; } }
.hw-tt { display: flex; align-items: center; gap: 8px; font: 600 15px var(--display); color: var(--c); }
.hw-tt .ms { font-size: 23px; }
.hw-badge { min-width: 24px; height: 24px; padding: 0 7px; border-radius: 999px; background: var(--c); color: #fff; font: 700 13px/24px var(--display); text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 3px var(--glass-strong); }
.hw-tt .hw-badge { margin-left: auto; }
.hw-body { display: flex; flex-direction: column; gap: 8px; flex: 1; min-height: 0; }
.hw-big { font: 700 44px/1 var(--display); letter-spacing: -.02em; background: linear-gradient(180deg, var(--text), color-mix(in srgb, var(--c) 70%, var(--text))); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hw-big small { font: 600 15px var(--body); letter-spacing: 0; color: var(--muted); -webkit-text-fill-color: var(--muted); }
.hw-mini { margin: 0; font-size: 14px; color: var(--muted); }
.hw-mini b { color: var(--text); }
.hw-lead { margin: 0; font: 600 16px/1.35 var(--display); overflow-wrap: anywhere; }
.hw-foot { margin-top: auto; }
.hw-xp { height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; }
.hw-xp i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--ae), color-mix(in srgb, var(--ae) 55%, #fff)); transform-origin: left; animation: hwGrow 1.3s var(--ease) both .4s; }
@keyframes hwGrow { from { transform: scaleX(0); } }
.hw-donut { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.hw-donut .ring { width: 112px; height: 112px; }
.hw-list, .hw-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 15px; min-width: 0; flex: 1 1 180px; }
.hw-list li { display: flex; align-items: center; gap: 10px; }
.hw-list .ms { font-size: 20px; color: var(--muted); }
.hw-list li.alert .ms { color: var(--c); }
.hw-done { flex: none; gap: 6px; font-size: 14.5px; }
.hw-done .ms { color: var(--ok); font-size: 19px; }
.hw-legend { font-size: 14px; color: var(--muted); gap: 6px; }
.hw-legend li::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; background: var(--k); margin-right: 7px; }
.hw-legend b { color: var(--text); }
.hw-now { margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 999px; background: var(--glass-strong); border: 1px solid var(--line); }
.hw-now .tx { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hw-now b { font-family: var(--display); }
.hw-now .tab { margin-left: auto; font: 600 15px var(--display); white-space: nowrap; }
.hw-now .pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; animation: hwPulse 2s infinite; }
@keyframes hwPulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 12px transparent; } }
.hw-empty { grid-column: 1 / -1; padding: 28px; border-radius: 34px; text-align: center; color: var(--muted); }

.hw-dock { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%); z-index: 15; display: flex; align-items: flex-end; gap: 10px; padding: 10px 16px; border-radius: 999px; }
.hw-dock.demo { bottom: calc(env(safe-area-inset-bottom, 0px) + 50px); }
.hw-dock a { position: relative; width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; text-decoration: none; color: #fff;
  background: linear-gradient(145deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c)); box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 35%, transparent), inset 0 1px 0 rgba(255, 255, 255, .5);
  transition: width .2s var(--ease), height .2s var(--ease); }
.hw-dock a .ms { font-size: 27px; }
.hw-dock a .hw-badge { position: absolute; top: -7px; right: -7px; transform: scale(.85); box-shadow: 0 0 0 3px rgba(255, 255, 255, .9); }
.hw-dock a .tip { position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%) translateY(4px); white-space: nowrap; font: 600 13px var(--display); padding: 6px 10px; border-radius: 10px; background: var(--text); color: var(--bg); opacity: 0; pointer-events: none; transition: .2s; }
.hw-dock a:hover .tip, .hw-dock a:focus-visible .tip { opacity: 1; transform: translateX(-50%); }
.hw-dock .sep { width: 1px; align-self: stretch; background: var(--line); margin: 4px 2px; }

.hw-scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .35s; }
.hw-scrim.on { opacity: 1; pointer-events: auto; }
.hw-panel { position: fixed; z-index: 41; top: calc(12px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); width: min(380px, calc(100vw - 24px));
  border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--glass-strong); transform: translateX(calc(100% + 30px)); visibility: hidden;
  transition: transform .5s var(--ease), visibility 0s linear .5s; }
.hw-panel.on { transform: none; visibility: visible; transition: transform .5s var(--ease), visibility 0s; }
.hw-panel.instant, .hw-scrim.instant { transition: none; }
.hw-panel .ph { display: flex; align-items: center; justify-content: space-between; padding-left: 6px; }
.hw-panel h2 { margin: 0; font: 600 20px var(--display); }
.hw-opts { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; min-height: 0; }
.hw-opt { display: flex; align-items: center; gap: 12px; padding: 8px 6px; min-height: 54px; border-radius: 14px; cursor: pointer; }
.hw-opt:hover { background: var(--hover); }
.hw-opt .oi { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--c); flex: none; }
.hw-opt .oi .ms { font-size: 21px; }
.hw-opt .ot { flex: 1; min-width: 0; }
.hw-opt .ot b { display: block; font: 600 15px var(--display); }
.hw-opt .ot small { color: var(--muted); font-size: 13px; }
.hw-tog { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--active); position: relative; cursor: pointer; flex: none; margin: 0; transition: background .3s; }
.hw-tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .25); transition: transform .35s cubic-bezier(.34, 1.56, .64, 1); }
.hw-tog:checked { background: var(--c); }
.hw-tog:checked::after { transform: translateX(18px); }
.hw-panel .foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); padding: 4px 4px 0; }

/* Nagy képernyőn minden arányosan nagyobb (a makett arányai maradnak) */
@media (min-width: 1400px) { .hw-page, .hw-dock { zoom: 1.1; } }
@media (min-width: 1700px) { .hw-page, .hw-dock { zoom: 1.2; } }
@media (min-width: 2100px) { .hw-page, .hw-dock { zoom: 1.32; } }
@media (max-width: 900px) { .hw-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) {
  .hw-grid { grid-template-columns: minmax(0, 1fr); }
  .hw.wide { grid-column: auto; } .hw.tall { grid-row: auto; }
  .hw-search kbd, .hw-edit span:not(.ms), .hw-logo { display: none; }
  .hw-top { padding: 10px; gap: 10px; }
  .hw-edit { padding: 0 12px; }
  .hw-dock { left: 12px; right: 12px; transform: none; overflow-x: auto; scrollbar-width: none; padding: 8px; gap: 8px; border-radius: 30px; }
  .hw-dock::-webkit-scrollbar { display: none; }
  .hw-dock a { width: 48px; height: 48px; }
  .hw-dock a .hw-badge { top: -2px; right: -2px; transform: scale(.75); }
  .hw-dock a .tip { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .hw-aura i, .hw-rise, .hw, .hw-time, .hw-time .colon, .hw-xp i, .hw-now .pulse, .hw:hover::before { animation: none; }
  .hw, .hw-panel, .hw-scrim, .ring .fg, .hw-dock a, .ms { transition: none; }
}

/* Projektek, beállítások, belépés */
.card { border-radius: 24px; padding: 20px; animation: rise .6s var(--ease) both; }
.card h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 600; font-size: 18px; }
.muted { color: var(--muted); }
.proj { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 14px; align-items: start; }
.pcard { border-radius: 22px; animation: rise .6s var(--ease) both; animation-delay: calc(var(--i) * 60ms); }
.pcard > summary { list-style: none; cursor: pointer; padding: 16px 18px; display: flex; gap: 14px; align-items: center; }
.pcard > summary::-webkit-details-marker { display: none; }
.pcard .ico { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--hover); color: var(--text); flex: none; }
.pcard .ico svg { width: 20px; height: 20px; }
.pcard b { font-family: var(--display); font-weight: 600; display: block; }
.pcard small { color: var(--muted); }
.pcard .chev { margin-left: auto; color: var(--muted); transition: transform .3s var(--ease); flex: none; }
.pcard[open] .chev { transform: rotate(90deg); }
.pcard ul { list-style: none; margin: 0; padding: 4px 10px 10px; border-top: 1px solid var(--line); }
.pcard li a { display: flex; justify-content: space-between; gap: 10px; padding: 9px 8px; border-radius: 10px; text-decoration: none; }
.pcard li a:hover { background: var(--hover); }
.pcard li small { white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip { display: inline-block; padding: 0 7px; margin-left: 4px; border-radius: 999px; font-size: 11.5px; font-weight: 700; background: var(--hover); color: var(--muted); }
.search { width: 100%; min-height: 48px; padding: 0 16px 0 44px; border-radius: 16px; border: 1px solid var(--line); background: var(--glass-strong); }
.search-wrap { position: relative; }
.search-wrap svg { position: absolute; left: 14px; top: 14px; width: 20px; height: 20px; color: var(--muted); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field span { font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.field input { min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--line);
  background: var(--glass-strong); font-weight: 600; cursor: pointer; text-decoration: none; transition: transform .2s var(--ease), border-color .2s; }
.btn:hover { border-color: color-mix(in srgb, var(--text) 30%, transparent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--accent) 35%, transparent); }
.btn svg { width: 18px; height: 18px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; font-weight: 600; }
.switch input { width: 20px; height: 20px; accent-color: var(--accent); }
.err { color: var(--bad); font-weight: 600; margin: 0; }
.gate { width: min(420px, 100%); display: flex; flex-direction: column; gap: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; display: none;
  padding: 12px 18px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 700; box-shadow: var(--shadow); }
.demo-bar { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: 12px; background: #e9a92b; color: #1b1200; font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 999px; }

/* Ötletek */
.idea-new { display: flex; flex-direction: column; gap: 12px; }
.idea-new textarea, .idea-row textarea { width: 100%; min-height: 84px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--glass-strong); resize: vertical; line-height: 1.45; }
.idea-row textarea { min-height: 64px; }
.idea-new .row { justify-content: space-between; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; }
.filters button { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass-strong); font-weight: 600; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.filters button small { color: var(--muted); font-variant-numeric: tabular-nums; }
.filters button[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.filters button[aria-pressed="true"] small { color: inherit; opacity: .7; }
.ideas { display: flex; flex-direction: column; gap: 10px; }
.idea-row { border-radius: 20px; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i) * 40ms); }
.idea-row .tick { width: 28px; height: 28px; margin-top: 1px; border-radius: 9px; border: 2px solid color-mix(in srgb, var(--muted) 60%, transparent); background: transparent; display: grid; place-items: center; cursor: pointer; color: #fff; padding: 0; }
.idea-row .tick svg { width: 18px; height: 18px; stroke-width: 3; opacity: 0; }
.idea-row.kesz .tick { background: var(--ok); border-color: var(--ok); }
.idea-row.kesz .tick svg { opacity: 1; }
.idea-row.elvetve .tick { border-style: dashed; cursor: default; }
.idea-row .txt { white-space: pre-wrap; overflow-wrap: anywhere; font-weight: 600; }
.idea-row.kesz .txt { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.idea-row.elvetve .txt { text-decoration: line-through; color: var(--muted); }
.idea-row .meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; color: var(--muted); }
.idea-row .why { grid-column: 2; font-size: 14px; padding: 8px 12px; border-radius: 12px; background: var(--hover); white-space: pre-wrap; overflow-wrap: anywhere; }
.idea-row .why b { color: var(--text); }
.idea-row .acts { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.idea-row .acts button { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.idea-row .acts button:hover { background: var(--hover); }
.idea-row .acts button svg { width: 15px; height: 15px; }
.idea-row .acts .danger { color: var(--bad); }
.idea-row .edit { grid-column: 2; display: flex; flex-direction: column; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--hover); color: var(--muted); }
.pill.folyamatban { background: var(--idea-soft); color: var(--idea); }
.pill.kesz { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.pill.elvetve { background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad); }
.idea-row.folyamatban { border-color: color-mix(in srgb, var(--idea) 45%, var(--glass-line)); }
.kbd-hint { font-size: 12.5px; color: var(--muted); }
@media (max-width: 480px) { .kbd-hint { display: none; } }

/* Robot programok (3. változat, 2026. nov. 26.): a DTPS mappából; termékek → tábla (Tesztre vár → Javítani kell → Kész) + oldalpanel */
:root { --st-wait: #2563c9; --st-fix: #d1342f; --st-tweak: #c27c00; --st-ok: #1f9d55; --st-auto: #0a8fa3; --ps-test: #7b3fe4; --paper: #ffffff; }
:root[data-theme="dark"] { --st-wait: #6ea4ff; --st-fix: #ff6b63; --st-tweak: #f2b84b; --st-ok: #4ad37f; --st-auto: #4cc7da; --ps-test: #a98bff; --paper: #16191e; }
.rp-list, .rp-tbl { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.rp-prod { display: grid; grid-template-columns: 1fr minmax(110px, 220px); gap: 8px 20px; align-items: center; padding: 16px 20px; border-top: 1px solid var(--line); text-decoration: none; }
.rp-prod:first-child { border-top: 0; }
.rp-prod:hover { background: var(--hover); }
.rp-prod b { font-family: var(--display); font-weight: 600; font-size: 18px; }
.rp-prod .nm { color: var(--muted); font-size: 14px; }
.rp-prod .nums { grid-column: 1 / -1; display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.rp-prod .nums b { font-family: inherit; font-size: inherit; }
/* Termék állapota a listában: Tesztelés alatt = erősen kiemelve; Automatizált = kiemelve, de csendesebben;
   Áll = semmi extra; Munkán kívül = szürke, háttérbe húzódik. */
.rp-prod { position: relative; transition: background .3s, opacity .3s, filter .3s; }
.rp-prod .ttl { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; }
.ps { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font: 700 12.5px/1.6 var(--body); white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.rp-prod.ps-test { background: linear-gradient(90deg, color-mix(in srgb, var(--ps-test) 14%, transparent), color-mix(in srgb, var(--ps-test) 4%, transparent)); box-shadow: inset 6px 0 0 var(--ps-test); }
.rp-prod.ps-test b { font-size: 20px; }
.rp-prod.ps-test .ps { background: var(--ps-test); border-color: var(--ps-test); color: #fff; }
.rp-prod.ps-test .ps::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: psPulse 1.6s infinite; }
@keyframes psPulse { 0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, .8); } 80%, 100% { box-shadow: 0 0 0 7px rgba(255, 255, 255, 0); } }
.rp-prod.ps-auto { box-shadow: inset 3px 0 0 var(--st-auto); background: color-mix(in srgb, var(--st-auto) 5%, transparent); }
.rp-prod.ps-auto .ps { color: var(--st-auto); border-color: color-mix(in srgb, var(--st-auto) 45%, transparent); }
.rp-prod.ps-auto .ps svg { width: 14px; height: 14px; }
.rp-prod.ps-off { opacity: .5; filter: grayscale(1); }
.rp-prod.ps-off:hover { opacity: .8; }
.rp-psg { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.rp-psg button { min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass-strong); font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.rp-psg button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.rp-psg button svg { width: 16px; height: 16px; }
.rp-bar { display: flex; gap: 3px; height: 10px; }
.rp-bar i { flex: 1; border-radius: 3px; background: var(--c); }
.st { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; white-space: nowrap; }
.st::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.st.auto { --c: var(--st-auto); color: var(--st-auto); } .n-auto { color: var(--st-auto); }
.st.wait { --c: var(--st-wait); } .st.fix { --c: var(--st-fix); color: var(--st-fix); } .st.tweak { --c: var(--st-tweak); color: var(--st-tweak); } .st.ok { --c: var(--st-ok); color: var(--st-ok); }
.n-wait { color: var(--st-wait); } .n-fix { color: var(--st-fix); } .n-tweak { color: var(--st-tweak); } .n-ok { color: var(--st-ok); }
.rp-head { display: flex; flex-direction: column; gap: 4px; }
.rp-head h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(26px, 5vw, 34px); }
.rp-head p { margin: 0; color: var(--muted); }
.rp-sum { display: flex; gap: 6px 16px; flex-wrap: wrap; font-weight: 700; margin-top: 4px; }
.rp-tbl { width: 100%; border-collapse: separate; border-spacing: 0; }
.rp-tbl th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 12px 16px; }
.rp-tbl td { padding: 14px 16px; border-top: 1px solid var(--line); vertical-align: middle; }
.rp-tbl tbody tr { cursor: pointer; }
.rp-tbl tbody tr:hover td, .rp-tbl tbody tr:focus-visible td { background: var(--hover); }
.rp-tbl tbody tr:focus-visible { outline: none; }
/* Jelölt részek: más keret (kihúzva: halvány + áthúzva; csak teszt: szaggatott lila; ideiglenes: pontozott narancs) */
.rp-tbl tbody tr[class*="mk-"] { outline: 2px solid var(--mk); outline-offset: -4px; border-radius: 14px; }
.rp-tbl tbody tr.mk-test { outline-style: dashed; }
.rp-tbl tbody tr.mk-temp { outline-style: dotted; outline-width: 3px; }
.rp-tbl tbody tr.mk-strike { outline-width: 1px; outline-style: dashed; }
.rp-tbl tbody tr.mk-strike td { opacity: .5; }
.rp-tbl tbody tr.mk-strike .part span:first-child { text-decoration: line-through; text-decoration-thickness: 2px; }
.rp-mk { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; font: 700 11.5px/1.6 var(--body); letter-spacing: .02em; color: #fff; background: var(--mk); vertical-align: 2px; text-decoration: none; white-space: nowrap; }
.rp-seg.mk button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.rp-tbl .part { font-weight: 800; overflow-wrap: anywhere; }
.mono { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 14px; }
.rp-tbl .todo { color: var(--muted); font-size: 14.5px; }
.rp-tbl .todo b { color: var(--text); font-weight: 600; }
.rp-foot { font-size: 13.5px; color: var(--muted); }
@media (max-width: 640px) {
  .rp-tbl thead { display: none; }
  .rp-tbl, .rp-tbl tbody { display: block; }
  .rp-tbl tr { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
  .rp-tbl tbody tr:first-child { border-top: 0; }
  .rp-tbl td { padding: 0; border: 0; background: none !important; }
  .rp-tbl .c-st { grid-row: 1; grid-column: 2; }
  .rp-tbl .c-todo { grid-column: 1 / -1; }
  .rp-tbl tbody tr:hover { background: var(--hover); }
}
.rp-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; }
.rp-panel { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--paper); z-index: 61; border-left: 1px solid var(--line);
  box-shadow: var(--shadow); overflow-y: auto; padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 16px; animation: rp-in .22s var(--ease); }
@keyframes rp-in { from { transform: translateX(24px); opacity: 0; } }
.rp-panel .x { align-self: flex-end; border: 1px solid var(--line); background: none; width: 42px; height: 42px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; color: var(--text); }
.rp-panel .x svg { width: 20px; height: 20px; }
.rp-panel h2 { margin: -6px 0 0; font-family: var(--display); font-weight: 600; font-size: 24px; overflow-wrap: anywhere; }
.rp-panel h2 small { display: block; font-family: var(--body); font-size: 14px; color: var(--muted); font-weight: 600; }
.rp-cur { border: 1px solid var(--line); border-left: 5px solid var(--c); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
.rp-cur small { color: var(--muted); font-weight: 700; font-size: 12.5px; text-transform: uppercase; letter-spacing: .05em; }
.rp-cur .v { font-family: var(--display); font-size: 30px; font-weight: 700; line-height: 1.1; }
.rp-cur .f { overflow-wrap: anywhere; color: var(--muted); }
.rp-open { background: var(--st-wait); border-color: var(--st-wait); color: #fff; text-decoration: none; min-height: 50px; }
.rp-lbl { font-size: 12.5px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: -8px; }
.rp-pts { display: flex; flex-direction: column; gap: 6px; }
.rp-ptw { display: flex; gap: 6px; align-items: stretch; }
.rp-ptdel { flex: none; width: 44px; border-radius: 12px; border: 1px solid var(--line); background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.rp-ptdel svg { width: 18px; height: 18px; }
.rp-ptdel:hover { color: var(--st-fix); border-color: var(--st-fix); }
.rp-pt { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: none; text-align: left; cursor: pointer; width: 100%; color: var(--text); }
.rp-pt i { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-style: normal; font-weight: 900; color: transparent; font-size: 13px; }
.rp-pt.on i { background: var(--st-ok); border-color: var(--st-ok); color: #fff; }
.rp-pt.on span { text-decoration: line-through; color: var(--muted); }
.rp-pt em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 700; margin-left: 6px; }
.rp-acts { display: grid; gap: 8px; }
.rp-acts .btn { min-height: 50px; font-weight: 800; }
.btn.rp-ok { background: var(--st-ok); border-color: var(--st-ok); color: #fff; }
.btn.rp-fix { background: var(--text); border-color: var(--text); color: var(--paper); }
.rp-panel textarea { width: 100%; min-height: 110px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); resize: vertical; font: inherit; color: inherit; }
.rp-panel details summary { cursor: pointer; color: var(--muted); font-weight: 700; }
.rp-old { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; font-size: 14.5px; }
.rp-old > div { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 12px; border-radius: 10px; background: var(--hover); }
.rp-old a { color: var(--st-wait); font-weight: 700; text-decoration: none; white-space: nowrap; }
.rp-good { margin: 0; color: var(--st-ok); font-weight: 800; }
.rp-seg { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 6px; }
.rp-seg button { min-height: 44px; padding: 4px 6px; border-radius: 12px; border: 1px solid var(--line); background: none; font-weight: 700; font-size: 13.5px; color: var(--muted); cursor: pointer; line-height: 1.15; }
.rp-seg button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: #fff; }
.rp-seg .cust { grid-column: 1 / -1; border-style: dashed; overflow-wrap: anywhere; }
.rp-seg .cust[aria-pressed="true"] { border-style: solid; }
.rp-custom { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--hover); }
.rp-custom input { min-height: 46px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font-size: 16px; }
.rp-colors { display: flex; flex-wrap: wrap; gap: 8px; }
.rp-colors button { width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--paper); background: var(--c); box-shadow: 0 0 0 1px var(--line); cursor: pointer; }
.rp-colors button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--c); }
.rp-used { display: flex; flex-wrap: wrap; gap: 6px; }
.rp-used button { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); font-weight: 700; font-size: 13.5px; cursor: pointer; }
.rp-used button::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.rp-custom .row { display: flex; justify-content: flex-end; gap: 8px; }
@media (max-width: 420px) { .rp-seg { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { .rp-prod.ps-test .ps::before { animation: none; } }
.rp-info { border-radius: 14px; background: var(--hover); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.rp-info .t { white-space: pre-wrap; overflow-wrap: anywhere; }
.rp-info .t.empty { color: var(--muted); }
.rp-info .row { display: flex; gap: 8px; justify-content: flex-end; }
.rp-link { border: 0; background: none; color: var(--st-wait); font-weight: 700; cursor: pointer; padding: 2px 0; font-size: 14px; }
.rp-notes { display: flex; flex-direction: column; gap: 6px; }
.rp-note { display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); }
.rp-note .t { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.rp-note time { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.rp-note button { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 8px; font-size: 16px; }
.rp-note button:hover { color: var(--st-fix); background: var(--hover); }
/* ---- Időmérés (2026. nov. 27.): iroda = Teendőim DTPS-mérés, kint = javítás a robotnál, teszt ---- */
:root { --tm-prog: #0a9bb0; --tm-kint: #e8631c; --tm-test: #5b3fd6; }
:root[data-theme="dark"] { --tm-prog: #4cc7da; --tm-kint: #ff8a4c; --tm-test: #a48bff; }
.tab { font-variant-numeric: tabular-nums; }
.tm-tabs { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--hover); align-self: center; }
.tm-tabs a { min-height: 40px; padding: 0 18px; border-radius: 10px; display: inline-flex; align-items: center; gap: 7px; font-weight: 700; color: var(--muted); text-decoration: none; }
.tm-tabs a[aria-current] { background: var(--paper); color: var(--text); box-shadow: 0 2px 8px rgba(40, 30, 90, .12); }
.tm-tabs a svg { width: 16px; height: 16px; }
.tm-run { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; padding: 12px 14px 12px 18px; border-radius: 18px; color: #fff; background: var(--c); box-shadow: 0 10px 30px color-mix(in srgb, var(--c) 35%, transparent); }
.tm-run .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; flex: none; animation: psPulse 1.4s infinite; }
.tm-run .w { flex: 1; min-width: 150px; line-height: 1.3; }
.tm-run .w small { display: block; opacity: .85; font-size: 13px; }
.tm-run .w a { color: inherit; }
.tm-run .t { font: 700 22px/1 var(--display); font-variant-numeric: tabular-nums; }
.tm-run button { min-height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, .6); background: rgba(255, 255, 255, .16); color: #fff; font-weight: 800; cursor: pointer; }
.tm-run button.solid { background: #fff; color: var(--c); border-color: #fff; }
.tm-run .ask { display: none; flex-basis: 100%; gap: 8px; flex-wrap: wrap; align-items: center; padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, .3); }
.tm-run.long .ask { display: flex; }
.tm-run .ask b { flex-basis: 100%; }
.tm-run .ask input { min-height: 42px; border-radius: 12px; border: 0; padding: 0 10px; font: inherit; color: #16142a; }
.tm-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tm-tiles > div { border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 14px; padding: 9px 11px; min-width: 0; }
.tm-tiles b { display: block; font: 700 19px/1.2 var(--display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm-tiles span { font-size: 12.5px; color: var(--muted); line-height: 1.25; display: block; }
.tm-total { margin: -4px 0 0; font-size: 14px; color: var(--muted); }
.tm-total b { color: var(--text); }
.tm-live { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--muted); padding: 9px 12px; border-radius: 14px; background: color-mix(in srgb, var(--tm-prog) 10%, transparent); }
.tm-live i { width: 9px; height: 9px; border-radius: 50%; background: var(--tm-prog); flex: none; animation: psPulse 2s infinite; }
.tm-go { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tm-go button { display: flex; align-items: center; justify-content: center; gap: 9px; min-height: 54px; border-radius: 16px; border: 0; padding: 0 14px; cursor: pointer; background: var(--c); color: #fff; font-weight: 800; font-size: 15.5px; }
.tm-go button svg { width: 18px; height: 18px; }
.tm-go .stop { grid-column: 1 / -1; background: var(--st-fix); justify-content: flex-start; }
.tm-go .stop .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: psPulse 1.4s infinite; }
.tm-go .stop .t { margin-left: auto; font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.tm-vers { display: flex; flex-direction: column; gap: 7px; }
.tm-ver { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 13.5px; }
.tm-ver b { font-family: ui-monospace, Consolas, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
.tm-ver .bar { height: 10px; border-radius: 5px; background: var(--hover); display: flex; gap: 2px; overflow: hidden; }
.tm-ver .bar i { display: block; height: 100%; background: var(--c); }
.tm-ver span:last-child { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm-fix { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 16px; background: var(--hover); }
.tm-fix .in { display: flex; gap: 8px; flex-wrap: wrap; }
.tm-fix input { min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); font: inherit; font-size: 16px; color: inherit; }
.tm-fix input[type="number"] { width: 110px; }
.tm-fix .row { display: flex; justify-content: flex-end; gap: 8px; }
.tm-log > div { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 7px 10px 7px 12px; border-radius: 10px; background: var(--hover); font-size: 14px; }
.tm-log { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.tm-log .k { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.tm-log .k::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tm-log small { color: var(--muted); display: block; }
.tm-log b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tm-log button { border: 0; background: none; color: var(--muted); cursor: pointer; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; }
.tm-log button svg { width: 16px; height: 16px; }
.tm-log button:hover { color: var(--st-fix); background: var(--paper); }
.rp-tbl .c-time { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 600; text-align: right; }
.rp-tbl th.c-time { text-align: right; }
.rp-tbl .c-time .on { color: var(--st-fix); font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.rp-tbl .c-time .on::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--st-fix); }
.n-tm { color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.n-tm svg { width: 14px; height: 14px; }
@media (max-width: 640px) {
  .rp-tbl .c-time { grid-column: 1 / -1; text-align: left; font-size: 13.5px; }
  .rp-tbl .c-time:not(:empty)::before { content: "Idő: "; font-weight: 500; }
  .rp-tbl .c-time:empty { display: none; }
}
@media (max-width: 420px) { .tm-tiles { grid-template-columns: 1fr; } .tm-tiles > div { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; } .tm-go { grid-template-columns: 1fr; } }


/* Rész panel – B változat (2026. nov. 27.): lenyíló sorok, a fő gombok alul */
.rp-panel { padding-bottom: 0; gap: 12px; }
.rp-top { display: flex; align-items: flex-start; gap: 12px; }
.rp-top h2 { margin: 0; flex: 1; min-width: 0; }
.rp-top h2 .rp-mk { font-size: 12px; }
.rp-top .x { flex: none; }
.rp-panel .rp-cur { flex-direction: row; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; }
.rp-cur .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.rp-cur .t .v { font-size: 26px; }
.rp-cur .t .f { font-size: 12.5px; }
.rp-cur .b { display: flex; flex-direction: column; gap: 6px; flex: none; }
.rp-cur .b .btn { min-height: 42px; padding: 0 14px; font-weight: 800; border-radius: 12px; }
.btn.rp-tst { background: var(--tm-test); border-color: var(--tm-test); color: #fff; }
.rp-acc { border: 1px solid var(--line); border-radius: 16px; overflow: hidden; flex: none; }
.rp-acc[data-open] { box-shadow: 0 6px 20px rgba(40, 30, 90, .07); }
.rp-acch { width: 100%; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto 14px; gap: 12px; align-items: center; padding: 10px 14px 10px 12px; min-height: 56px; border: 0; background: none; cursor: pointer; text-align: left; color: var(--text); }
.rp-acch:hover { background: var(--hover); }
.rp-acch .i { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.rp-acch .i svg { width: 18px; height: 18px; }
.rp-acch > b { font-weight: 800; font-size: 15.5px; }
.rp-acch .v { color: var(--muted); font-weight: 700; font-size: 14px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.rp-acch .v .st { font-size: 14px; }
.rp-acch .ch { color: var(--muted); font-size: 22px; line-height: 1; font-weight: 700; transition: transform .2s; text-align: center; }
.rp-acc[data-open] .ch { transform: rotate(90deg); }
.rp-accb { display: none; flex-direction: column; gap: 12px; padding: 4px 14px 14px; }
.rp-acc[data-open] .rp-accb { display: flex; }
.rp-empty { margin: 0; color: var(--muted); font-size: 14px; padding: 10px 12px; border-radius: 12px; background: var(--hover); }
.rp-acts.two { grid-template-columns: 1fr 1fr; }
.rp-acts.two > :only-child { grid-column: 1 / -1; }
.rp-bot { position: sticky; bottom: 0; margin: auto -22px 0; padding: 12px 22px calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--paper); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; z-index: 2; }
.rp-bot .btn { min-height: 52px; }
.rp-stop { display: flex; align-items: center; gap: 10px; min-height: 52px; border-radius: 14px; border: 0; padding: 0 16px; cursor: pointer; background: var(--st-fix); color: #fff; font-weight: 800; font-size: 15.5px; }
.rp-stop .dot { width: 12px; height: 12px; border-radius: 50%; background: #fff; animation: psPulse 1.4s infinite; }
.rp-stop .t { margin-left: auto; font: 700 20px/1 var(--display); font-variant-numeric: tabular-nums; }
.rp-accb .tm-go .stop { display: none; }
@media (max-width: 420px) { .rp-acch .v { max-width: 130px; } .rp-acts.two .btn { font-size: 14px; padding: 0 8px; } }
@media (prefers-reduced-motion: reduce) { .rp-stop .dot { animation: none; } }

/* Termék-infó („mi újság vele”) – a listán a sor link (rp-hit), a gombok fölötte */
.rp-hit { position: absolute; inset: 0; z-index: 1; border-radius: inherit; }
.rp-hit:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.rp-pn { grid-column: 1 / -1; position: relative; z-index: 2; display: flex; gap: 10px; align-items: flex-start; padding: 9px 12px; border-radius: 12px; background: color-mix(in srgb, var(--st-tweak) 9%, var(--paper)); border: 1px solid color-mix(in srgb, var(--st-tweak) 25%, transparent); font-size: 14.5px; }
.rp-pn > svg { width: 18px; height: 18px; flex: none; margin-top: 2px; color: var(--st-tweak); }
.rp-pn .t { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.rp-pn .t small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; margin-top: 2px; }
.rp-pn .rp-link { flex: none; font-size: 13.5px; }
.rp-pn.none { background: none; border: 0; padding: 0; }
.rp-pn.edit { flex-direction: column; align-items: stretch; background: var(--paper); }
.rp-pn.edit textarea { width: 100%; min-height: 80px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); resize: vertical; font: inherit; color: inherit; }
.rp-pn.edit .row { display: flex; justify-content: flex-end; gap: 8px; }
.rp-head .rp-pn { margin: 6px 0 2px; }
.rp-head .rp-pn.none { margin: 2px 0; }
/* Statisztika */
.st-card { border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.st-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.st-seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--hover); }
.st-seg button { border: 0; background: none; min-height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 700; color: var(--muted); cursor: pointer; }
.st-seg button[aria-pressed="true"] { background: var(--paper); color: var(--text); box-shadow: 0 2px 8px rgba(40, 30, 90, .12); }
.st-nav { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.st-nav button { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; display: grid; place-items: center; color: var(--text); }
.st-nav button:disabled { opacity: .35; cursor: default; }
.st-nav button { font-size: 22px; line-height: 1; font-weight: 700; }
.st-kpi small span { white-space: nowrap; display: inline; }
.st-nav span { min-width: 150px; text-align: center; }
.st-kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.st-kpi > div { border-radius: 18px; padding: 14px 16px; background: var(--glass-strong); border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); min-width: 0; }
.st-kpi b { display: block; font: 700 28px/1.15 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.st-kpi span { font-size: 13.5px; color: var(--muted); display: block; }
.st-kpi small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.st-chart { border-radius: 18px; padding: 14px 14px 6px; background: var(--glass-strong); border: 1px solid var(--line); position: relative; }
.st-legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 13.5px; color: var(--muted); margin-bottom: 6px; }
.st-legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.st-chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.st-chart text { fill: var(--muted); font: 600 11.5px var(--body); }
.st-chart .gl { stroke: var(--line); }
.st-chart rect.hit { fill: transparent; cursor: pointer; }
.st-chart rect.hit.on { fill: var(--hover); }
.st-tip { position: absolute; pointer-events: none; background: #16142a; color: #fff; padding: 8px 10px; border-radius: 10px; font-size: 12.5px; line-height: 1.5; white-space: nowrap; transform: translate(-50%, -100%); z-index: 2; }
.st-tip[hidden] { display: none; }
.st-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 6px; }
.st-empty { margin: 0; padding: 30px 10px; text-align: center; color: var(--muted); }
.st-tw { overflow-x: auto; border-radius: 18px; border: 1px solid var(--line); background: var(--glass-strong); }
.st-tbl { width: 100%; border-collapse: collapse; min-width: 560px; }
.st-tbl th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 800; padding: 12px 14px; }
.st-tbl td { padding: 11px 14px; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.st-tbl .r { text-align: right; white-space: nowrap; }
.st-tbl a { color: inherit; text-decoration: none; font-family: var(--display); font-weight: 600; }
.st-tbl small { display: block; color: var(--muted); font-size: 13px; }
.st-tbl tbody tr:hover td { background: var(--hover); }
.st-boss { border-radius: 24px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
.st-boss h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 20px; }
.st-boss ul { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.st-boss .row { display: flex; gap: 8px; flex-wrap: wrap; }
.print-only-h { display: none !important; }
@media print { .print-only-h { display: block !important; } }
@media (max-width: 760px) { .st-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); } .st-kpi b { font-size: 23px; } .st-card { padding: 14px; } }
@media print {

/* =====================================================================

/* =====================================================================
   1. A háttér: hajlított „selyemszalagok” – a videókártya rajzolja (WebGL).
   Egy kis program (shader) minden képpontra kiszámolja: melyik szalagon
   van, és az hol jár a hajlatában. A szalag felső széle alatt árnyék, az
   alsó szélén vékony fényes él – ettől néz ki egymásra boruló anyagnak.
   Teljes felbontás, 60 kép/mp, élsimítással; rejtett lapnál áll.
   ===================================================================== */
const silk = (() => {
  const cv = $('#silk');
  const gl = cv.getContext('webgl', { antialias: false, premultipliedAlpha: false, alpha: false, powerPreference: 'low-power' });
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!gl) { cv.style.display = 'none'; return { redraw() {}, pause() {} }; }   // nincs WebGL: marad a sima háttérszín

  const VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
  const FS = `
    #extension GL_OES_standard_derivatives : enable
    precision highp float;
    uniform vec2 res; uniform float time; uniform float dark;

    // A „magasság”: ebből lesznek a szalagok. Ferdén futó, lassan hullámzó felület.
    float field(vec2 q) {
      float t = time * 0.06;
      vec2 r = vec2(q.x * 0.913 + q.y * 0.407, -q.x * 0.407 + q.y * 0.913);   // kb. 24 fokkal elforgatva
      float y = r.y;
      y += 0.22 * sin(r.x * 1.35 + t * 1.3);
      y += 0.11 * sin(r.x * 2.70 - t * 0.9 + r.y * 1.1);
      y += 0.05 * sin(r.x * 4.90 + t * 1.7 - r.y * 0.6);
      return y * 4.2;                         // ennyi szalag fér egy képernyőnyi magasságba
    }
    // Egy szalag színe: halvány árnyalat szalagonként, a szélek felé finom fény-árnyék
    vec3 tint(float i) {
      float k = mod(i, 5.0);
      vec3 L = k < 1.0 ? vec3(.965,.972,.985) : k < 2.0 ? vec3(.935,.968,.975) : k < 3.0 ? vec3(.975,.950,.958)
             : k < 4.0 ? vec3(.948,.958,.980) : vec3(.978,.968,.952);
      vec3 D = k < 1.0 ? vec3(.105,.112,.125) : k < 2.0 ? vec3(.075,.118,.135) : k < 3.0 ? vec3(.135,.080,.090)
             : k < 4.0 ? vec3(.085,.100,.135) : vec3(.120,.100,.085);
      return mix(L, D, dark);
    }
    vec3 shade(float b) {
      float i = floor(b), f = fract(b);               // f: 0 = a szalag alsó (fényes) széle, 1 = a teteje
      vec3 c = tint(i);
      float body = 0.90 + 0.10 * sin(f * 3.14159);    // a szalag közepe kicsit domborúbb
      float shadow = pow(smoothstep(0.55, 1.0, f), 2.2); // a fölötte lévő szalag árnyéka
      float rim = exp(-f * 28.0);                     // vékony fényes él
      vec3 col = c * body;
      col *= 1.0 - shadow * mix(0.15, 0.55, dark);
      col += rim * mix(0.10, 0.05, dark);
      return col;
    }
    void main() {
      vec2 q = (gl_FragCoord.xy - 0.5 * res) / res.y;
      float b = field(q);
      float w = fwidth(b);                            // egy képpont mennyi „szalagnyi” – ennyivel simítunk
      vec3 col = 0.25 * (shade(b - 0.75 * w) + shade(b - 0.25 * w) + shade(b + 0.25 * w) + shade(b + 0.75 * w));
      // nagyon halvány szemcse, hogy a színátmenetek ne csíkozódjanak
      float n = fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453);
      col += (n - 0.5) / 255.0;
      gl_FragColor = vec4(col, 1.0);
    }`;
  gl.getExtension('OES_standard_derivatives');
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) { console.warn('Háttér: a shader nem fordult le'); cv.style.display = 'none'; return { redraw() {}, pause() {} }; }
  gl.useProgram(prog);
  const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);   // egy nagy háromszög, ami lefedi a képet
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uRes = gl.getUniformLocation(prog, 'res'), uTime = gl.getUniformLocation(prog, 'time'), uDark = gl.getUniformLocation(prog, 'dark');

  let raf = 0; const t0 = performance.now();
  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);   // éles kijelzőn is éles, de max. 2×
    cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, cv.width, cv.height);
  }
  function draw(sec) {
    gl.uniform2f(uRes, cv.width, cv.height);
    gl.uniform1f(uTime, sec);
    gl.uniform1f(uDark, document.documentElement.dataset.theme === 'dark' ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  let off = false;   // a kezdőlapon nem látszik (ott a színes köd a háttér) – akkor nem is rajzol
  function frame(now) { draw((now - t0) / 1000); raf = requestAnimationFrame(frame); }
  function start() { cancelAnimationFrame(raf); if (off) return; if (calm) draw(20); else raf = requestAnimationFrame(frame); }
  resize(); start();
  addEventListener('resize', () => { resize(); if (calm) draw(20); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else start(); });
  return { redraw: () => { if (calm) draw(20); }, pause: (on) => { if (off === on) return; off = on; if (on) cancelAnimationFrame(raf); else start(); } };
})();

/* =====================================================================
   2. Adatréteg – mindhárom szerverfüggvény ugyanúgy működik:
   POST kérés JSON-nal, benne a művelet (action) és a belépési kód.
   ===================================================================== */
class AccessError extends Error {}
async function post(url, action, payload, code) {
  let res;
  try { res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, code, ...payload }), cache: 'no-store' }); }
  catch { throw new Error('Nincs kapcsolat a szerverrel.'); }
  let body = null; try { body = await res.json(); } catch { /* nem JSON */ }
  if (res.status === 401) throw new AccessError(body?.error || 'Hibás hozzáférési kód');
  if (!res.ok) throw new Error(body?.error || `Szerverhiba (${res.status})`);
  return body?.data;
}
const kmCode = () => store.get('km-kod') || '';

/* ---------- Dátum (budapesti idő) ---------- */
const ymdFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Budapest', year: 'numeric', month: '2-digit', day: '2-digit' });
const today = () => ymdFmt.format(new Date());
const toDate = (ymd) => new Date(ymd + 'T00:00:00Z');
const addDays = (ymd, n) => { const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const mondayOf = (ymd) => addDays(ymd, -((toDate(ymd).getUTCDay() + 6) % 7));
function isoWeek(ymd) {
  const d = toDate(ymd); d.setUTCDate(d.getUTCDate() + 3 - ((d.getUTCDay() + 6) % 7));
  const year = d.getUTCFullYear(), jan4 = new Date(Date.UTC(year, 0, 4));
  return { year, week: 1 + Math.round(((d - jan4) / 86400000 - 3 + ((jan4.getUTCDay() + 6) % 7)) / 7) };
}
const huLong = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'long', day: 'numeric', weekday: 'long' });
const huShort = new Intl.DateTimeFormat('hu-HU', { timeZone: 'UTC', month: 'short', day: 'numeric' });
const hhmm = (iso) => new Date(iso).toLocaleTimeString('hu-HU', { timeZone: 'Europe/Budapest', hour: '2-digit', minute: '2-digit' });
function fmtDur(ms) { const m = Math.floor(ms / 60000); if (m < 1) return '<1 p'; const h = Math.floor(m / 60); return h ? `${h} ó ${m % 60} p` : `${m} p`; }

function demoApi() {
  const m = mondayOf(today()), w = isoWeek(today());
  const mk = (d, who, a, s, appr, escl) => ({ id: 'demo-' + d, check_date: d, ...(({ year, week }) => ({ iso_year: year, iso_week: week }))(isoWeek(d)), robot: ROBOT, inspector: who, action_count: a, skip_count: s, approved_by: appr ? 'Nagy Béla' : null, escalate: !!escl });
  const d = (v) => new Promise((r) => setTimeout(() => r(structuredClone(v)), 250));
  const ago = (days) => new Date(Date.now() - days * 86400000).toISOString();
  const idea = (id, text, status, days, reason = null) => ({ id, text, status, reason, created_at: ago(days), updated_at: ago(days), done_at: status === 'kesz' || status === 'elvetve' ? ago(days / 2) : null });
  let ideas = [
    idea('i1', 'Gyorscserélő adapter a 2-es cellához', 'folyamatban', 2),

  ];

  return {
    ptList: () => d({ products: pts.filter((x) => !x.gone), synced_at: ptSynced, pctime: ptPc }),
    ptOp: (id, op) => {

    ideaUpdate: (id, patch) => {

      if (patch.reason !== undefined) cur.reason = String(patch.reason ?? '').trim() || null;
      cur.updated_at = ts; return d(cur);
    },
    ideaDelete: (id) => { ideas = ideas.filter((x) => x.id !== id); return d(true); },
    ping: () => d(true),
    projects: () => d({ private_index: '#', projects: [
      { key: 'tokmany', name: 'Tokmány vagy lemez', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Lemez vagy tokmány', u: '#', d: '2026-11-04' }, { t: 'Vastag lemez 3D', u: '#', d: '2026-10-29', k: ['3D'] }] },
      { key: 'adapter', name: 'Univerzális adapter és befogó', about: 'Mintaprojekt a demóhoz.', items: [{ t: 'Univerzális adapter', u: '#', d: '2026-10-19' }] } ] }),

    idle: () => d([]),
    week: () => d([1, 2, 3, 4, 5].map((i) => ({ id: String(i), date: m, text: i < 6 ? `Kész: minta ${i}` : 'x' }))),
    todo: () => d({ open: 5, starred: 3, doing: [{ text: '3100.0610 új kialakítás', spent_ms: 3600000, started_at: Date.now() - 720000 }], updated_at: new Date(Date.now() - 300000).toISOString() }),
  };
}

// Demó időmérés: a Teendőim DTPS-mérése (pctime) az elmúlt hetekből + a robotnál mért teszt / kint javítás (p.time)
function demoPc(pts) {
  let seed = 7; const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const pc = [], now = Date.now(), day = 86400000;
  const add = (p, x, ver, t, min, k) => {
    if (t > now) return;
    if (k === 'prog') pc.push({ cid: `d${pc.length}`, folder: p.folder, program: ver.dir, from: new Date(t).toISOString(), ms: min * 60000 });
    else (p.time ||= []).push({ id: `dt${p.time.length}-${k}`, part: x.id, k, v: ver.v, from: new Date(t).toISOString(), ms: min * 60000, src: 'ora' });
  };
  for (const p of pts) {
    const span = p.sku === '2950.7510' ? 40 : p.sku === '2950.5750' ? 75 : 95, quiet = p.sku === '2950.7510' ? 0 : p.sku === '2950.5750' ? 25 : 55;
    for (let d = span; d >= quiet; d--) {
      const t0 = new Date(now - d * day); const wd = t0.getDay(); if (wd === 0 || wd === 6 || rnd() < 0.35) continue;
      t0.setHours(7, 30, 0, 0);
      for (const x of p.parts) {
        if (rnd() < 0.72) continue;
        const vs = x.versions.filter((v) => !v.m || Date.parse(v.m) <= t0.getTime() + day); const ver = vs[vs.length - 1] || x.versions[0];
        const s0 = t0.getTime() + Math.floor(rnd() * 6) * 3600000;
        const pm = 10 + Math.floor(rnd() * 45); if (s0 + 3 * 3600000 + 45 * 60000 > now) continue;
        add(p, x, ver, s0, pm, 'prog');
        if (rnd() < 0.45) add(p, x, ver, s0 + 2 * 3600000, 10 + Math.floor(rnd() * 25), 'test');
        if (rnd() < 0.25) add(p, x, ver, s0 + 3 * 3600000, 5 + Math.floor(rnd() * 20), 'kint');
      }
    }
  }
  // most is megy: a Teendőim méri a V-FAL_K+EGYEB-et (4 perce frissült)
  const p = pts[0], x = p.parts.find((y) => y.key === 'V_FAL_K+EGYEB');
  if (x) pc.push({ cid: 'dlive', folder: p.folder, program: latestOf(x).dir, from: new Date(now - 22 * 60000).toISOString(), ms: 20 * 60000 });
  return pc;
}

const SHIFT = { from: 420, to: 900, breaks: [[480, 495], [615, 630], [720, 750]] };
function shiftState() {
  const d = new Date(), n = d.getHours() * 60 + d.getMinutes();
  const left = SHIFT.to - n, pct = Math.min(1, Math.max(0, (n - SHIFT.from) / (SHIFT.to - SHIFT.from)));
  if (n < SHIFT.from) return { pct: 0, big: `${SHIFT.from / 60}:00`, label: 'A műszak kezdete', sub: `még ${fmtMin(SHIFT.from - n)}` };
  if (n >= SHIFT.to) return { pct: 1, big: 'Vége', label: 'A műszak véget ért', sub: 'Szép estét!' };
  const br = SHIFT.breaks.find(([a, b]) => n >= a && n < b), nx = SHIFT.breaks.find(([a]) => n < a);
  const sub = br ? `Szünet ${hm(br[1])}-ig` : nx ? `Következő szünet ${hm(nx[0])} (${nx[1] - nx[0]} perc)` : `Vége ${hm(SHIFT.to)}-kor`;
  return { pct, big: fmtMin(left), label: 'Hátra a műszakból', sub };
}
const hm = (m) => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const fmtMin = (m) => m >= 60 ? `${Math.floor(m / 60)} ó ${m % 60} p` : `${m} p`;

const ringGo = (root) => requestAnimationFrame(() => requestAnimationFrame(() => $$('circle[data-off]', root).forEach((e) => { e.style.strokeDashoffset = e.dataset.off; })));

function hwWire() {
  const q = $('#hwQ'), res = $('#hwRes'); let sel = 0, hits = [];
  const norm = (s) => String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const hl = (t, w) => { const i = norm(t).indexOf(w); return i < 0 || !w ? esc(t) : esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + w.length)) + '</mark>' + esc(t.slice(i + w.length)); };
  const draw = () => {
    const w = norm(q.value.trim());
    if (!w) { res.hidden = true; q.setAttribute('aria-expanded', 'false'); return; }
    const words = w.split(/\s+/);
    hits = hwIndex.filter((x) => words.every((v) => norm(`${x.t} ${x.s}`).includes(v))).slice(0, 8);
    sel = Math.min(sel, Math.max(0, hits.length - 1));
    res.innerHTML = hits.length ? hits.map((x, i) => `<button type="button" role="option" class="hw-c-${x.k}" aria-selected="${i === sel}" data-i="${i}"><span class="ri">${ms(x.icon || x.k)}</span><span><b>${hl(x.t, words[0])}</b><small>${hl(x.s, words[0])}</small></span></button>`).join('')
      : `<p class="hw-mini" style="padding:10px 12px;margin:0">Nincs találat erre: „${esc(q.value.trim())}”</p>`;
    res.hidden = false; q.setAttribute('aria-expanded', 'true');
  };
  const go = (i) => { const x = hits[i]; if (!x) return; if (/^https?:/.test(x.u)) window.open(x.u, '_blank', 'noopener'); else location.href = x.u; };
  q.addEventListener('input', () => { sel = 0; draw(); });
  q.addEventListener('focus', draw);

    if (e.key === 'ArrowDown') { sel = Math.min(hits.length - 1, sel + 1); draw(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { sel = Math.max(0, sel - 1); draw(); e.preventDefault(); }
    else if (e.key === 'Enter') { e.preventDefault(); go(sel); }
    else if (e.key === 'Escape') { q.value = ''; draw(); q.blur(); }
