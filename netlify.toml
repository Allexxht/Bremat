# BREMAT – Valk robot heti karbantartási lap
# A public/ mappa változtatás nélkül megy ki (nincs build lépés).
# Az adatkezelés Netlify Functions: /api/km (heti lap) és /api/naplo (külön
# Munkanapló, /naplo/). Az adatok a site saját Netlify Blobs tárolójában
# vannak (km-checks, naplo) – külső adatbázis nincs.
[build]
  publish = "public"
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # A hozzáférési kód a linkben is érkezhet (?kod=...): ne szivárogjon ki
    # a betöltött külső erőforrások (betűtípus) felé.
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow"

# Önfrissítő csomag (Teendőim + helyi Központ): a lista mindig friss legyen,
# a tartalom-összeg nevű fájlok nyugodtan gyorsítótárazhatók.
[[headers]]
  for = "/frissites/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/frissites/f/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
